<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Java Job Hunt: найди работу, пока не закончилась подушка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7ECF3; --paper:#FFFFFF; --ink:#1B2230; --muted:#5B6576;
  --blue:#2B55C9; --blue-soft:#DCE5FB; --orange:#DD7419; --orange-soft:#FBE6D2;
  --ok:#157F53; --ok-soft:#D9F2E6; --bad:#C23737; --bad-soft:#F8DEDE;
  --line:#C9D2DF; --code:#F2F5FA;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --paper:#1C2231; --ink:#E7EBF2; --muted:#9BA5B7;
    --blue:#86A2FF; --blue-soft:#243152; --orange:#F39B4B; --orange-soft:#3D2A18;
    --ok:#46C98F; --ok-soft:#173A2B; --bad:#F27676; --bad-soft:#3F1E22;
    --line:#313C54; --code:#151A26;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --paper:#1C2231; --ink:#E7EBF2; --muted:#9BA5B7;
  --blue:#86A2FF; --blue-soft:#243152; --orange:#F39B4B; --orange-soft:#3D2A18;
  --ok:#46C98F; --ok-soft:#173A2B; --bad:#F27676; --bad-soft:#3F1E22;
  --line:#313C54; --code:#151A26;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* HUD */
.hud{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;margin-bottom:18px}
.meter small{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.bar{height:10px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;transition:width .5s ease}
.bar.nerves i{background:var(--ok)}
.bar.nerves.low i{background:var(--bad)}
.bar.cash i{background:var(--orange)}
.pts{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;text-align:right}
.pts small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}

/* Funnel track */
.track{position:relative;display:flex;justify-content:space-between;margin:6px 0 22px;padding:0 6px}
.track::before{content:"";position:absolute;left:18px;right:18px;top:15px;height:3px;background:var(--line)}
.track .fill{position:absolute;left:18px;top:15px;height:3px;background:var(--blue);transition:width .6s ease}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:64px}
.dot{width:32px;height:32px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-size:15px;transition:all .3s}
.node.done .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.node.now .dot{border-color:var(--orange);background:var(--orange-soft);transform:scale(1.18)}
.node span{font-size:12px;color:var(--muted);margin-top:6px;text-align:center;line-height:1.2}
.node.now span{color:var(--ink);font-weight:700}

/* Card */
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 24px 22px;overflow:hidden}
.kicker{color:var(--muted);font-size:14px;margin:0 0 10px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6.4vw,50px);line-height:1.02;letter-spacing:-.02em;margin:0 0 16px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(19px,3.6vw,24px);line-height:1.2;margin:0 0 14px;letter-spacing:-.01em}
p{margin:0 0 12px;max-width:68ch}
.who{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.who .ava{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);font-size:20px}
.who .bubble{background:var(--code);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px}
.who .bubble b{display:block;font-size:13px;color:var(--muted);font-weight:500}

pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:14.5px;line-height:1.55;margin:0 0 16px}
code{font-family:var(--mono);font-size:.9em}
.kw{color:var(--blue);font-weight:600}.st{color:var(--ok)}.nm{color:var(--orange)}.cm{color:var(--muted);font-style:italic}

.opts{display:grid;gap:10px;margin:6px 0 4px}
.opt{position:relative;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.picked{border-color:var(--blue);background:var(--blue-soft)}
.opt .tip{display:inline-block;margin-left:8px;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--orange);color:#fff;vertical-align:1px}
.opt code{background:var(--code);padding:1px 5px;border-radius:4px}

.life{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line)}
.life button{background:transparent;border:1.5px solid var(--line);border-radius:30px;padding:6px 14px;font-size:14.5px;cursor:pointer}
.life button:hover:not(:disabled){border-color:var(--orange)}
.life button:disabled{opacity:.4;cursor:default}
.hint{margin-top:12px;padding:10px 14px;border-left:4px solid var(--orange);background:var(--orange-soft);border-radius:0 10px 10px 0;font-size:15.5px}

.ex{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--code);border:1px solid var(--line)}
.ex p:last-child{margin-bottom:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:700;cursor:pointer;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}

.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.grade{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.grade:hover{border-color:var(--orange)}
.grade strong{display:block;font-family:var(--display);font-size:19px;margin-bottom:6px}
.grade span{font-size:14.5px;color:var(--muted);line-height:1.4;display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:30px;padding:7px 14px;cursor:pointer;font-size:15px}
.chip.on{border-color:var(--blue);background:var(--blue-soft)}
.chip.good{border-color:var(--ok);background:var(--ok-soft)}
.chip.meh{border-color:var(--bad);background:var(--bad-soft)}

/* Rubber stamp: the one loud moment */
.stamp{position:absolute;top:18px;right:18px;font-family:var(--display);font-weight:800;font-size:22px;padding:6px 14px;border:4px solid currentColor;border-radius:8px;transform:rotate(-12deg);pointer-events:none;animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both;background:var(--paper)}
.stamp.ok{color:var(--ok)}.stamp.bad{color:var(--bad)}.stamp.mid{color:var(--orange)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}

.big{font-family:var(--display);font-weight:800;font-size:clamp(26px,5.4vw,40px);line-height:1.08;margin:6px 0 14px;letter-spacing:-.015em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats b{display:block;font-family:var(--display);font-size:22px}
.stats span{font-size:13.5px;color:var(--muted)}
.review{margin-top:14px;font-size:15px}
.review li{margin-bottom:6px}
.toast{font-size:14px;color:var(--muted);margin-top:8px;min-height:1.2em}
.foot{margin-top:18px;font-size:13.5px;color:var(--muted);text-align:center}

@media (max-width:600px){
  .card{padding:20px 16px 18px}
  .grades{grid-template-columns:1fr}
  .node{width:48px}.node span{font-size:10.5px}
  .dot{width:28px;height:28px;font-size:13px}
  .track::before,.track .fill{top:13px}
  .stamp{font-size:16px;top:12px;right:10px}
  .hud{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="hud"></div>

  <div id="app"></div>
  <p class="foot">Вопросы основаны на реальных собесах по Java 17–25, Spring Boot 3, Kafka и PostgreSQL. Совпадения с вашим опытом не случайны.</p>

/* ============ STATE ============ */
let S;
function reset(){
  S = {grade:null, nerves:100, weeks:0, limit:15, stage:-1, queue:[], qi:0,
       score:0, max:0, bonus:0, right:0, total:0, life:{ai:2,fifty:1,senior:1},
       backup:false, events:shuffle(EVENTS.slice()), misses:[], offerDelta:0};
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(code){
  let h = esc(code);
  h = h.replace(/("[^"]*")/g,'<span class="st">$1</span>');
  h = h.replace(/\b(int|static|return|try|finally|new|for|if|var|case|default|when|switch|String|Integer|Object|List|ArrayList|HashMap|Stream|System)\b/g,'<span class="kw">$1</span>');
  h = h.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="nm">$1</span>');
  return h;
}
const app = document.getElementById('app');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ============ HUD & TRACK ============ */
function drawHud(){
  const hud=document.getElementById('hud');
  if(S.stage<0){hud.innerHTML='';document.getElementById('track').innerHTML='';return}
  S.nerves=clamp(S.nerves,0,100);
  const left=Math.max(0,S.limit-S.weeks);
  hud.innerHTML=`<div class="hud">
    <div class="meter"><small>Нервы: ${S.nerves}</small><div class="bar nerves ${S.nerves<35?'low':''}"><i style="width:${S.nerves}%"></i></div></div>
    <div class="meter"><small>Подушка: ${left} нед.</small><div class="bar cash"><i style="width:${left/S.limit*100}%"></i></div></div>
    <div class="pts">${S.score+S.bonus}<small>очков</small></div></div>`;
  const n=STAGES.length;
  const pct = S.stage>=n ? 100 : (S.stage/(n-1))*100;
  document.getElementById('track').innerHTML=`<div class="track" role="list" aria-label="Этапы найма">
    <div class="fill" style="width:calc((100% - 36px) * ${pct/100})"></div>
    ${STAGES.map((s,i)=>`<div class="node ${i<S.stage?'done':''} ${i===S.stage?'now':''}" role="listitem"><div class="dot">${i<S.stage?'✓':s.icon}</div><span>${s.name}</span></div>`).join('')}
  </div>`;
}

    <h1>Найди работу Java-разработчиком</h1>
    <p>Резюме, HR, техсобес, лайвкодинг, архитектура и торг за оффер. Вопросы — с реальных собеседований. Шутки — тоже, к сожалению.</p>
    <p>У вас 100 нервов и подушка на 15 недель. Ошибки бьют по нервам, рекрутеры — по подушке. На сложных вопросах можно спросить ИИ (он иногда уверенно врёт), взять 50/50 или позвонить синьору.</p>
    ${best?`<p class="kicker">Ваш лучший результат: ${best.pts} очков, ${esc(best.title)}</p>`:''}
    <h2 style="margin-top:22px">Кого ищем?</h2>
    <div class="grades">${Object.entries(GRADES).map(([k,g])=>`<button class="grade" data-g="${k}"><strong>${g.label}</strong><span>${g.desc}</span></button>`).join('')}</div>
  </div>`;
  app.querySelectorAll('.grade').forEach(b=>b.onclick=()=>{S.grade=b.dataset.g;nextStage()});
}

function nextStage(){
  S.stage++;
  if(S.stage>=STAGES.length) return;
  const st=STAGES[S.stage];
  const n=GRADES[S.grade].n;
  S.qi=0;
  if(st.key==='resume') return resume();
  if(st.key==='offer') return offer();
  const pool={hr:HR,tech:TECH,code:CODE,design:DESIGN}[st.key];
  S.queue=shuffle(pool.slice()).slice(0,n[st.key]);
  showQ();
}

function stageDone(){
  const st=STAGES[S.stage];
  S.weeks+=st.weeks;
  if(checkFail()) return;
  if(st.key==='design'){
    const pct=S.score/S.max;
    if(pct<0.45) return end('reject');
  }
  if(EVENTS_AFTER[st.key] && S.events.length) return event(S.events.pop());
  nextStage();
}
function checkFail(){
  if(S.nerves<=0){end('burnout');return true}
  if(S.weeks>S.limit){end('money');return true}
  return false;
}

function resume(){
  drawHud();
  const picked=new Set();
  app.innerHTML=`<div class="card">
    <p class="kicker">Этап 1. Резюме против ATS-бота</p>
    <h2>Выберите 4 ключевых слова для резюме</h2>
    <p>Первым ваше резюме прочитает бот. Люди — возможно, потом.</p>
    <div class="chips">${KEYWORDS.map((k,i)=>`<button class="chip" data-i="${i}" aria-pressed="false">${esc(k.t)}</button>`).join('')}</div>
    <p class="toast" id="cnt">Выбрано 0 из 4</p>
    <div class="row"><button class="btn" id="send" disabled>Отправить резюме</button></div>
    <div id="res"></div>
  </div>`;
  const send=document.getElementById('send');
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(send.dataset.done) return;
    const i=+c.dataset.i;
    if(picked.has(i)){picked.delete(i);c.classList.remove('on');c.setAttribute('aria-pressed','false')}
    else if(picked.size<4){picked.add(i);c.classList.add('on');c.setAttribute('aria-pressed','true')}
    document.getElementById('cnt').textContent=`Выбрано ${picked.size} из 4`;
    send.disabled=picked.size!==4;
  });
  send.onclick=()=>{
    send.dataset.done=1;
    let good=0;
    picked.forEach(i=>{const c=app.querySelector(`.chip[data-i="${i}"]`);c.classList.remove('on');if(KEYWORDS[i].g){good++;c.classList.add('good')}else c.classList.add('meh')});
    S.score+=good*3; S.max+=12;
    let msg, cls, stamp;
    if(good===4){msg='ATS-бот доволен и даже добавил вас в «топ-кандидаты». Рекрутер откроет резюме на 7 секунд — это много.';cls='ok';stamp='Прошёл'}
    else if(good>=2){msg='Бот засомневался, но пропустил. Совет: «Вайбкодинг» лучше показывать делом, а не в резюме.';cls='mid';stamp='С натяжкой';S.nerves-=5}
    else {msg='Бот отклонил резюме за 0,3 секунды. К счастью, вас протащил по рефералке бывший коллега.';cls='bad';stamp='Отказ';S.nerves-=15}
    app.querySelector('.card').insertAdjacentHTML('beforeend',`<div class="stamp ${cls}">${stamp}</div>`);
    document.getElementById('res').innerHTML=`<div class="ex"><p>${msg}</p></div><div class="row"><button class="btn" id="go">Дальше</button></div>`;
    send.remove();
    drawHud();
    document.getElementById('go').onclick=stageDone;
    document.getElementById('go').focus();
  };
}

function showQ(){
  drawHud();
  const st=STAGES[S.stage];
  const q=S.queue[S.qi];
  const isHR=st.key==='hr';
  const order=shuffle(q.o.map((_,i)=>i));
  const titles={hr:'HR-скрининг',tech:'Технический собес',code:'Лайвкодинг',design:'Архитектурная секция'};
  const who={hr:['HR Алина','👩‍💼'],tech:['Тимлид Денис','🧔'],code:['Синьор Олег, шарит экран','👨‍💻'],design:['Архитектор Ирина','👩‍🔬']}[st.key];
  app.innerHTML=`<div class="card">
    <p class="kicker">Этап ${S.stage+1}. ${titles[st.key]} — вопрос ${S.qi+1} из ${S.queue.length}</p>
    <div class="who"><div class="ava" aria-hidden="true">${who[1]}</div><div class="bubble"><b>${who[0]}</b>${esc(q.q)}</div></div>
    ${q.code?`<pre><code>${hl(q.code)}</code></pre>`:''}
    <div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(isHR?q.o[i][0]:q.o[i])}</button>`).join('')}</div>
    ${isHR?'':`<div class="life">
      <button id="lai" ${S.life.ai?'':'disabled'}>🤖 Спросить ИИ (${S.life.ai})</button>
      <button id="l50" ${S.life.fifty?'':'disabled'}>✂️ 50/50 (${S.life.fifty})</button>
      <button id="lsn" ${S.life.senior?'':'disabled'}>📞 Звонок синьору (${S.life.senior})</button>
    </div><div id="hint"></div>`}
    <div id="after"></div>
  </div>`;
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>answer(+b.dataset.i,btns,q,isHR));
  if(!isHR){
    const optText=i=>q.o[i];
    const hint=document.getElementById('hint');
    const lockLife=()=>app.querySelectorAll('.life button').forEach(b=>b.disabled=true);
    document.getElementById('lai').onclick=()=>{
      S.life.ai--; lockLife();
      const honest=Math.random()<.7;
      let pick=q.a;
      if(!honest){const w=q.o.map((_,i)=>i).filter(i=>i!==q.a);pick=w[Math.floor(Math.random()*w.length)]}
      const tpl=(honest?AI_OK:AI_BAD)[Math.floor(Math.random()*3)];
      hint.innerHTML=`<div class="hint">🤖 ${esc(tpl.replace('%',optText(pick)))}</div>`;
      const b=btns.find(x=>+x.dataset.i===pick); b.insertAdjacentHTML('beforeend','<span class="tip">ИИ советует</span>');
      S.aiUsed={pick,honest};
    };
    document.getElementById('l50').onclick=()=>{
      S.life.fifty--; lockLife();
      const w=shuffle(q.o.map((_,i)=>i).filter(i=>i!==q.a)).slice(0,2);
      btns.forEach(b=>{if(w.includes(+b.dataset.i)){b.disabled=true;b.classList.add('gone')}});
      hint.innerHTML=`<div class="hint">✂️ Два неправильных ответа ушли искать работу вместо вас.</div>`;
    };
    document.getElementById('lsn').onclick=()=>{
      S.life.senior--; lockLife();
      const good=Math.random()<.8;
      let pick=q.a;
      if(!good){const w=q.o.map((_,i)=>i).filter(i=>i!==q.a);pick=w[Math.floor(Math.random()*w.length)]}
      hint.innerHTML=`<div class="hint">📞 «Ну… это зависит от контекста. ${good?'Но на собесе я бы ответил':'Хотя у нас в 2014-м на Java 7 было'}: «${esc(optText(pick))}». Всё, у меня созвон».</div>`;
    };
  }
}

function answer(i,btns,q,isHR){
  btns.forEach(b=>b.disabled=true);
  app.querySelectorAll('.life button').forEach(b=>b.disabled=true);
  const card=app.querySelector('.card');
  const chosen=btns.find(b=>+b.dataset.i===i);
  let html='';
  if(isHR){
    const [,pts,fb,nerv]=q.o[i];
    const best=Math.max(...q.o.map(o=>o[1]));
    S.score+=Math.max(pts,0); S.max+=best; S.bonus+=Math.min(pts,0);
    if(nerv) S.nerves+=nerv;
    if(pts<0) S.nerves-=6;
    chosen.classList.add('picked');
    const cls=pts>=8?'ok':pts>=3?'mid':'bad';
    card.insertAdjacentHTML('beforeend',`<div class="stamp ${cls}">${pts>=8?'Принято':pts>=3?'Хм':'Мимо'}</div>`);
    html=`<div class="ex"><p>${esc(fb)}</p></div>`;
  } else {
    S.max+=10; S.total++;
    const ok=i===q.a;
    const right=btns.find(b=>+b.dataset.i===q.a);
    right.classList.add('right');
    if(ok){S.score+=10;S.right++;S.nerves+=2}
    else {chosen.classList.add('wrong');S.nerves-=12;S.misses.push(q.q.length>70?q.q.slice(0,68)+'…':(q.code?q.code.split('\n')[0]+' …':q.q))}
    let aiNote='';
    if(S.aiUsed){
      if(!S.aiUsed.honest && S.aiUsed.pick===i) aiNote='<p>🤖 ИИ: «Прошу прощения за путаницу! Вы абсолютно правы, что засомневались». Вы не засомневались.</p>';
      else if(!S.aiUsed.honest) aiNote='<p>🤖 ИИ ошибся, но вы не повелись. Код-ревью в голове работает.</p>';
    }
    S.aiUsed=null;
    card.insertAdjacentHTML('beforeend',`<div class="stamp ${ok?'ok':'bad'}">${ok?'Верно':'Мимо'}</div>`);
    html=`<div class="ex">${aiNote}<p>${esc(q.ex)}</p></div>`;
  }
  const last=S.qi>=S.queue.length-1;
  document.getElementById('after').innerHTML=html+`<div class="row"><button class="btn" id="go">${last?'Завершить этап':'Следующий вопрос'}</button></div>`;
  drawHud();
  const go=document.getElementById('go'); go.focus({preventScroll:true});
  go.onclick=()=>{
    if(S.nerves<=0) return end('burnout');
    if(last) stageDone(); else {S.qi++;showQ();window.scrollTo({top:0})}
  };
}

function event(ev){
  drawHud();
  app.innerHTML=`<div class="card">
    <p class="kicker">Тем временем в поиске работы</p>
    <h2>${esc(ev.t)}</h2>
    <div class="who"><div class="ava" aria-hidden="true">${ev.ava}</div><div class="bubble"><b>${esc(ev.who)}</b>${esc(ev.text)}</div></div>
    <div class="opts">${ev.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
    <div id="after"></div></div>`;
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    btns.forEach(x=>x.disabled=true); b.classList.add('picked');
    const res=ev.o[+b.dataset.i].f();
    document.getElementById('after').innerHTML=`<div class="ex"><p>${esc(res)}</p></div><div class="row"><button class="btn" id="go">Дальше</button></div>`;
    drawHud();
    const go=document.getElementById('go'); go.focus({preventScroll:true});
    go.onclick=()=>{ if(!checkFail()) nextStage(); };
  });
}

function offer(){
  drawHud();
  const opts=[
    {t:'Назвать цифру по рынку, аргументировать опытом и спросить про бонусы и обучение', f:()=>{S.offerDelta=1;return['ok','Сильно','HR: «Обоснованно. Согласую с руководителем». Руководитель согласовал.']}},
    {t:'«Меня устроит любая сумма»', f:()=>{S.offerDelta=-1;return['bad','Продешевил','HR: «Отлично! Тогда минимальная по вилке». Она явно рада.']}},
    {t:'«ChatGPT сказал, что я стою в два раза больше»', f:()=>{ if(Math.random()<.35){S.offerDelta=1;return['ok','Сработало','HR: «Наш ИИ тоже так считает». Два ИИ договорились за вас.']} S.offerDelta=0;return['mid','Хм','HR: «А наш ИИ говорит, что ваш ИИ завышает». Ничья.']}},
    {t:'«У меня есть другой оффер» (его нет)', f:()=>{ if(Math.random()<.5){S.offerDelta=1;return['ok','Блеф удался','HR: «Мы готовы сделать лучше». Вы стараетесь не выдать себя лицом.']} S.offerDelta=-9;return['bad','Блеф раскрыт','HR: «Поздравляем! Не будем вам мешать». Упс.']}},
  ];
  app.innerHTML=`<div class="card">
    <p class="kicker">Этап 6. Оффер</p>
    <div class="who"><div class="ava" aria-hidden="true">👩‍💼</div><div class="bubble"><b>HR Алина</b>«Команда в восторге! Готовы сделать предложение. Вилка… ну, вы понимаете. Какие у вас ожидания?»</div></div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
    <div id="after"></div></div>`;
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{
    btns.forEach(x=>x.disabled=true); b.classList.add('picked');
    const [cls,stamp,txt]=opts[+b.dataset.i].f();
    app.querySelector('.card').insertAdjacentHTML('beforeend',`<div class="stamp ${cls}">${stamp}</div>`);
    document.getElementById('after').innerHTML=`<div class="ex"><p>${esc(txt)}</p></div><div class="row"><button class="btn" id="go">Посмотреть итог</button></div>`;
    const go=document.getElementById('go'); go.focus({preventScroll:true});
    go.onclick=()=>{S.weeks+=1; S.stage=STAGES.length; end(S.offerDelta<-1?'bluff':'offer')};
  });
}

function end(kind){
  const g=GRADES[S.grade].label;
  const pct=S.max?S.score/S.max:0;
  let tier=pct>=.85?3:pct>=.65?2:1;
  if(kind==='offer') tier=clamp(tier+S.offerDelta,1,4);
  const T={
    burnout:['🔥','Выгорание','Нервы закончились раньше вакансий. Вы уехали в деревню, завели коз и пишете им DSL на Kotlin.'],
    money:['💸','Подушка закончилась','Деньги кончились на ' + S.weeks + '-й неделе. Вы устроились разметчиком данных для ИИ, который потом прошёл собеседование вместо вас.'],
    reject:['📭','«Мы с вами свяжемся»','Команда решила продолжить с кандидатом, «который лучше соответствует ожиданиям». Судя по вакансии, это AI-агент с 10 годами опыта в Java 25.'],
    bluff:['🎭','Блеф раскрыт','Вы остались с «другим оффером», которого нет. Зато теперь вы знаете, как пахнет провал переговоров.'],
  };
  const OFFERS={
    1:['🙂',`Оффер ${g}: «обсудим после испытательного»`,'Испытательный срок три месяца, Java 11, легаси на Spring 4 и обещание «скоро мигрируем». Это старт!'],
    2:['😎',`Хороший оффер ${g}`,'Зарплата по рынку, гибрид два дня в неделю, Java 21, Spring Boot 3 и адекватный тимлид. Редкость, берите.'],
    3:['🚀',`Оффер мечты ${g}`,'Выше рынка, удалёнка, Java 25 в проде. Вы тот, кто ревьюит код AI-агентов, а не наоборот.'],
    4:['👑',`Легендарный оффер ${g}`,'Вам предложили больше, чем в вилке, и опцион. HR попросила не рассказывать остальным кандидатам.'],
  };
  let [emo,title,text]=kind==='offer'?OFFERS[tier]:T[kind];
  if(kind!=='offer' && S.backup) text+=' Утешение: друг с легаси на Java 8 всё ещё ждёт. Struts передаёт привет.';
  const pts=S.score+S.bonus;
  const win=kind==='offer';
  try{
    const best=JSON.parse(localStorage.getItem('jjh-best')||'null');
    if(!best||pts>best.pts) localStorage.setItem('jjh-best',JSON.stringify({pts,title}));
  }catch(e){}
  if(win) S.stage=STAGES.length;
  drawHud();
  const share=`Java Job Hunt: ${title}. ${pts} очков, ${S.right}/${S.total} технических ответов, ${S.weeks} недель поиска.`;
  app.innerHTML=`<div class="card">
    <p class="kicker">${win?'Поиск окончен':'Игра окончена'}</p>
    <div style="font-size:48px;line-height:1" aria-hidden="true">${emo}</div>
    <p class="big">${esc(title)}</p>
    <p>${esc(text)}</p>
    <div class="stats">
      <div><b>${pts}</b><span>очков</span></div>
      <div><b>${S.right}/${S.total}</b><span>технических ответов</span></div>
      <div><b>${S.weeks}</b><span>недель поиска</span></div>
    </div>
    ${S.misses.length?`<div class="review"><p><b>Что повторить перед реальным собесом:</b></p><ul>${S.misses.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:'<p>Ни одной технической ошибки. Подозрительно. Вы точно не AI-агент?</p>'}
    <div class="row"><button class="btn" id="again">Искать работу снова</button><button class="btn ghost" id="share">Скопировать результат</button></div>
    <p class="toast" id="toast"></p>
  </div>`;
  document.getElementById('again').onclick=()=>{intro();window.scrollTo({top:0})};
  document.getElementById('share').onclick=async()=>{
    const t=document.getElementById('toast');
    try{await navigator.clipboard.writeText(share);t.textContent='Скопировано. Можно отправить рекрутеру вместо резюме.'}
    catch(e){t.textContent=share}
  };
}

intro();
</script>
</body>
</html>
