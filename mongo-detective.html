<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mongo-детектив</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --panel:#14171f; --panel2:#1a1e28; --line:#262b38; --line2:#323848;
  --text:#e4e2dc; --muted:#8a90a0; --amber:#e8b04b; --amber2:#f3cd7f; --green:#3ddc84; --red:#ff6b6b;
  --blue:#7ab8ff; --purple:#c792ea; --paper:#1d1a14;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'PT Serif',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(232,176,75,.07),transparent 60%);}
code,kbd{font-family:var(--mono);font-size:.88em}
code{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:1px 5px;border-radius:4px;color:var(--amber2)}
kbd{border:1px solid var(--line2);border-bottom-width:2px;padding:0 5px;border-radius:4px}
b{color:#fff}
header{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(13,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:700 19px var(--serif);letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--green)} .logo i{color:var(--amber);font-style:normal}
.prog{flex:1;max-width:340px;display:flex;align-items:center;gap:10px;margin-left:auto}
.prog-track{flex:1;height:6px;background:var(--panel2);border-radius:9px;overflow:hidden}
#prog-bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--amber));transition:width .5s}
#prog-text{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.hbtn{background:none;border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:6px 11px;font:500 13px var(--sans);cursor:pointer;white-space:nowrap}
.hbtn:hover,.hbtn.active{border-color:var(--amber);color:var(--amber)}
#burger{display:none;font-size:18px;padding:4px 10px}
.wrap{display:flex;min-height:calc(100vh - 58px)}
aside{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;padding:10px 10px 30px}
.chap{margin-bottom:8px}
.chap-t{display:flex;justify-content:space-between;gap:8px;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:12px 8px 6px}
.chap-c{font-family:var(--mono);opacity:.8}
.lv{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:6px 8px;border-radius:7px;cursor:pointer;font:14px var(--sans)}
.lv:hover{background:var(--panel2)}
.lv.active{background:rgba(232,176,75,.12);box-shadow:inset 2px 0 var(--amber)}
.lv-n{font:12px var(--mono);color:var(--muted);width:20px;text-align:right;flex:none}
.lv-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-s{font:600 12px var(--mono);color:var(--muted);width:16px;text-align:center}
.lv.done .lv-s{color:var(--green)}
.lv.done .lv-t{color:#b9bcc4}
.side-foot{padding:16px 8px 0;border-top:1px solid var(--line);margin-top:10px}
main{flex:1;min-width:0;padding:28px 34px 80px}
#content{max-width:900px;margin:0 auto}
.crumb{font:500 12px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid}
.b-quiz{color:var(--blue);border-color:rgba(122,184,255,.4)} .b-query{color:var(--green);border-color:rgba(61,220,132,.4)} .b-answer{color:var(--amber);border-color:rgba(232,176,75,.5)}
h1{font:700 30px/1.25 var(--serif);margin:6px 0 18px}
h1 .num{color:var(--amber)} .okmark{color:var(--green);font-size:.7em}
.story{position:relative;background:var(--paper);border:1px solid #3a3221;border-radius:10px;padding:16px 20px 16px;font:16px/1.65 var(--serif);color:#e9e1cf;margin-bottom:16px}
.story-l,.task-l{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.8px;color:var(--amber);margin-bottom:6px}
.story code{color:#f3d9a0}
.theory{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.theory summary,.data summary{cursor:pointer;padding:12px 18px;font-weight:600;list-style:none;user-select:none}
.theory summary::-webkit-details-marker,.data summary::-webkit-details-marker{display:none}
.theory summary::after,.data summary::after{content:'▾';float:right;color:var(--muted);transition:transform .2s}
.theory:not([open]) summary::after,.data:not([open]) summary::after{transform:rotate(-90deg)}
.theory-b{padding:0 20px 16px;border-top:1px solid var(--line)}
.theory-b p,.theory-b ul{margin:12px 0}
.theory-b li{margin:4px 0}
pre{margin:12px 0;overflow-x:auto}
.theory-b pre{background:#0a0c10;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.theory-b pre code,.hintbox code{background:none;border:0;padding:0;color:#d6dbe6;font-size:13px;line-height:1.55}
table.cmp{border-collapse:collapse;margin:12px 0;font-size:14px;width:100%}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.cmp th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.task{border:1px solid rgba(61,220,132,.35);background:rgba(61,220,132,.06);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.task-l{color:var(--green)}
.console{background:#090b0f;border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.con-top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#11141b;border-bottom:1px solid var(--line)}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3a3f4c;margin-right:5px}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.con-t{font:12px var(--mono);color:var(--muted)} .con-k{margin-left:auto;font:11px var(--mono);color:#5d6371}
#editor{display:block;width:100%;min-height:70px;resize:vertical;background:#090b0f;color:#e8f0e8;border:0;outline:0;padding:14px 16px;font:14px/1.55 var(--mono);caret-color:var(--green);tab-size:2}
.con-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:#0e1117}
.sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:7px 13px;border-radius:8px;font:500 13px var(--sans);cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--green);border-color:var(--green);color:#06210f;font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none}
.btn.warn:hover{border-color:var(--red);color:var(--red)}
.hintbox{margin:0;padding:10px 16px;background:rgba(232,176,75,.08);border-top:1px solid rgba(232,176,75,.3);font:13px/1.6 var(--mono);color:var(--amber2);white-space:pre-wrap}
.output{max-height:460px;overflow-y:auto;border-top:1px solid var(--line);padding:6px 0;font:13px/1.55 var(--mono)}
.out-empty{color:#4d5361;padding:8px 16px}
.out-block{padding:8px 16px;border-bottom:1px dashed #1c2029}
.out-block:last-child{border-bottom:0}
.out-cmd{color:#9aa3b5;white-space:pre-wrap;word-break:break-word}
.pr{color:var(--green);font-weight:600}
.out-v{margin:6px 0 2px;white-space:pre;color:#d6dbe6}
.out-err{color:var(--red);margin-top:4px;white-space:pre-wrap;font-family:var(--sans);font-size:14px}
.out-info{color:var(--muted);padding:2px 0;font-size:12px}
.t-s{color:#a8e6a1}.t-n{color:#f5a97f}.t-k{color:var(--purple)}.t-f{color:var(--blue)}.t-r{color:#ff9ac1}
#feedback{margin-top:14px}
.fb{border-radius:10px;padding:13px 18px;font-size:15px}
.fb.bad{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);color:#ffc9c9}
.fb.good{background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.4);font-family:var(--serif);font-size:16px}
.fb-t{font:700 15px var(--sans);color:var(--green);margin-bottom:4px}
.fb .btn{margin-top:12px;font-family:var(--sans)}
.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.data{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:16px}
.muted{color:var(--muted);font-weight:400}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.tab{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:12px var(--mono);padding:4px 9px;border-radius:6px;cursor:pointer}
.tab span{color:var(--muted)} .tab.on{border-color:var(--amber);color:var(--amber)}
.dataview{margin:0;max-height:420px;overflow:auto;padding:12px 16px;border-top:1px solid var(--line);font:12.5px/1.55 var(--mono);background:#0a0c10;border-radius:0 0 10px 10px}
.quiz{display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.qcard.solved{border-color:rgba(61,220,132,.35)}
.qq{font-weight:600;font-size:16px;display:flex;gap:10px;margin-bottom:12px}
.qn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font:600 12px var(--mono);color:var(--amber)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopt{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 13px;border-radius:9px;font:14px var(--sans);cursor:pointer;transition:.15s}
.qopt:hover:not(:disabled){border-color:var(--amber)}
.qopt:disabled{cursor:default}
.qopt.right{border-color:var(--green);background:rgba(61,220,132,.12);color:#fff}
.qopt.wrong{border-color:var(--red);background:rgba(255,107,107,.08);opacity:.6;text-decoration:line-through}
.qexp{margin-top:10px;font-size:14px;color:#c6c9d1;min-height:0}
.good{color:var(--green);font-weight:600}.bad{color:var(--red);font-weight:600}
.answer{display:flex;gap:10px;margin-top:14px}
.answer input{flex:1;background:var(--paper);border:1px solid #4a3f28;border-radius:9px;color:#fff;padding:11px 14px;font:17px var(--serif);outline:0}
.answer input:focus{border-color:var(--amber)}
.nav{display:flex;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.modal-b{max-width:520px;background:var(--panel);border:1px solid var(--amber);border-radius:16px;padding:28px 30px;text-align:center;font-family:var(--serif);font-size:16px}
.modal-b h2{font-size:28px;margin:6px 0}
.big{font-size:54px}
#scrim{display:none}
@media (max-width:900px){
  #burger{display:inline-block}
  aside{position:fixed;left:0;top:58px;z-index:30;transform:translateX(-105%);transition:transform .25s;box-shadow:10px 0 40px rgba(0,0,0,.5)}
  body.nav-open aside{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.5);z-index:25}
  main{padding:20px 16px 60px}
  h1{font-size:24px}
  .qopts{grid-template-columns:1fr}
  .prog{max-width:none}
  .hide-m{display:none}
  .con-k{display:none}
}

.chap-t small{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:#646a7a;font-size:11px;margin-top:1px}
.day{color:var(--amber2);text-transform:none;letter-spacing:0}
.hbtn.active{border-color:var(--amber);color:var(--amber)}
.board-btn b{font-family:var(--mono);color:var(--amber);margin-left:2px}
.fb-btns{display:flex;flex-wrap:wrap;gap:8px}
.clue-new{margin-top:12px;background:#f3ead2;color:#2b2416;border-radius:4px;padding:10px 14px 10px;font:15px/1.5 var(--serif);box-shadow:3px 3px 0 rgba(0,0,0,.35);transform:rotate(-.6deg)}
.clue-new span{display:block;font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.8px;color:#a23b2b;margin-bottom:2px}
#toast{position:fixed;right:18px;bottom:18px;z-index:60;max-width:360px;transform:translateY(140%);opacity:0;transition:.35s;cursor:pointer}
#toast.show{transform:none;opacity:1}
.toast-i{background:#f3ead2;color:#2b2416;border-left:5px solid #a23b2b;border-radius:4px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;display:flex;flex-direction:column;gap:3px}
.toast-i b{font-size:15px;color:#a23b2b}.toast-i em{font-style:normal;font-family:var(--serif);color:#4a3d22}
.board .crumb{margin-bottom:2px}
.b-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.b-head h1{margin:4px 0 6px}
.b-pct{display:flex;align-items:center;gap:12px}
.b-pct-n{font:700 44px/1 var(--mono);color:var(--amber)}
.b-pct-l{font-size:13px;color:var(--muted);line-height:1.35}
.b-lead{color:#c9c3b2;font-family:var(--serif);margin:6px 0 14px}
.puzzle-wrap{position:relative;background:radial-gradient(circle at 20% 30%,#8a6a45 0 1px,transparent 2px) 0 0/9px 9px,radial-gradient(circle at 70% 60%,#6e5235 0 1px,transparent 2px) 0 0/13px 13px,#9b7a52;border-radius:10px;padding:14px;box-shadow:inset 0 0 0 6px #6b4f30,inset 0 0 30px rgba(0,0,0,.4)}
.puzzle{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.pz-empty{fill:rgba(40,28,14,.45);stroke:rgba(255,240,210,.25);stroke-width:1.2;stroke-dasharray:4 4}
.pz.fresh{animation:pzin 1.2s ease}
@keyframes pzin{0%{opacity:0;transform:translateY(-30px)}60%{opacity:1}100%{transform:none}}
.pz-cap{position:absolute;right:22px;bottom:20px;background:rgba(20,14,6,.75);color:#f3ead2;font:600 12px var(--mono);padding:4px 10px;border-radius:20px}
.board h2{font:700 18px var(--serif);margin:26px 0 12px;color:#f0e6cf}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.sc{position:relative;background:#f3ead2;color:#2b2416;border-radius:3px;padding:16px 12px 12px;box-shadow:2px 4px 0 rgba(0,0,0,.35);transition:.3s}
.sc .pin{position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b3241a);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.sc-av{width:42px;height:42px;border-radius:50%;color:#fff;display:grid;place-items:center;font:700 15px var(--sans);margin-bottom:6px}
.sc-n{font:700 15px var(--serif)}
.sc-o{font-size:12px;color:#6b5f48;margin-bottom:6px}
.sc-pins{display:flex;flex-wrap:wrap;gap:4px}
.sc-pins span{font-size:11px;background:#a23b2b;color:#fff;border-radius:3px;padding:1px 6px}
.sc-none{font-size:12px;color:#9b8f76;font-style:italic}
.sc.cleared{opacity:.55;filter:grayscale(.6)}
.sc-clr{margin-top:6px;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.6px;color:#2e6b3e}
.sc.prime{box-shadow:0 0 0 3px #e0483e,2px 6px 0 rgba(0,0,0,.4)}
.sc-prime{margin-top:6px;font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.6px;color:#c0392b}
.stamp{position:absolute;right:6px;top:8px;transform:rotate(-10deg);border:3px solid #c0392b;color:#c0392b;font:800 12px var(--sans);letter-spacing:1px;padding:2px 8px;border-radius:4px;background:rgba(243,234,210,.85)}
.b-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tl{border-left:3px solid #a23b2b;padding-left:14px}
.tl-i{position:relative;padding:6px 0;display:flex;gap:12px;font-size:14px}
.tl-i::before{content:'';position:absolute;left:-21px;top:12px;width:11px;height:11px;border-radius:50%;background:#f3ead2;border:3px solid #a23b2b}
.tl-i.night .tl-t{color:var(--amber)}
.tl-t{font:600 12.5px var(--mono);color:#c9c3b2;min-width:92px;padding-top:1px}
.tl-x{color:#efe6d2}
.tl-i.locked{opacity:.5}.tl-i.locked::before{background:transparent;border-style:dashed}
.clues{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.clue{background:#f3ead2;color:#2b2416;border-radius:3px;padding:10px 12px;font:14px/1.45 var(--serif);box-shadow:2px 3px 0 rgba(0,0,0,.35)}
.clue-n{display:block;font:700 11px var(--mono);color:#a23b2b;margin-bottom:2px}
.clue.locked{background:rgba(243,234,210,.12);color:#8a8473;box-shadow:none;border:1px dashed rgba(243,234,210,.25);font-style:italic}
.empty-note{color:var(--muted);font-style:italic}
.modal-b.wide{max-width:860px;width:100%}
.fin-pz svg{width:100%;height:auto;border-radius:6px;margin:10px 0}
@media (max-width:900px){.b-cols{grid-template-columns:1fr}.b-pct-n{font-size:34px}#toast{left:12px;right:12px;max-width:none}}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="burger" aria-label="Уровни">☰</button>
  <div class="logo"><i>🔍</i> Mongo-<span>детектив</span></div>
  <div class="prog"><div class="prog-track"><div id="prog-bar"></div></div><span id="prog-text">0 / 0</span></div>
  <button class="hbtn board-btn" id="board-btn">🧩 <span class="hide-m">Доска</span> <b id="board-pct">0%</b></button>
  <button class="hbtn" id="sandbox-btn">🧪 <span class="hide-m">Песочница</span></button>
</header>
<div class="wrap">
  <aside>
    <div id="levels"></div>
    <div class="side-foot"><button class="hbtn" id="reset-progress">Сбросить прогресс</button></div>
  </aside>
  <div id="scrim"></div>
  <main id="main"><div id="content"></div></main>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script>
/* ===== Мини-движок MongoDB (работает прямо в браузере) ===== */
var MM = (function(){
'use strict';
class MongoError extends Error{ constructor(m){ super(m); this.name='MongoError'; } }
const err = m => new MongoError(m);

function isObj(v){ return v!==null && typeof v==='object' && !Array.isArray(v) && !(v instanceof RegExp) && !(v instanceof Date) && !(v instanceof Cursor); }
function clone(v){
  if(v instanceof Date) return new Date(v.getTime());
  if(v instanceof RegExp) return v;
  if(Array.isArray(v)) return v.map(clone);
  if(isObj(v)){ const o={}; for(const k in v) o[k]=clone(v[k]); return o; }
  return v;
}
function typeRank(v){
  if(v===undefined||v===null) return 1;
  if(typeof v==='number') return 2;
  if(typeof v==='string') return 3;
  if(isObj(v)) return 4;
  if(Array.isArray(v)) return 5;
  if(typeof v==='boolean') return 8;
  if(v instanceof Date) return 9;
  return 10;
}
function cmp(a,b){
  const ra=typeRank(a), rb=typeRank(b);
  if(ra!==rb) return ra-rb;
  if(ra===1) return 0;
  if(ra===9){ a=a.getTime(); b=b.getTime(); }
  if(ra===4||ra===5){ const sa=canon(a), sb=canon(b); return sa<sb?-1:sa>sb?1:0; }
  return a<b?-1:a>b?1:0;
}
function deepEq(a,b){
  if(a===b) return true;
  if((a===null||a===undefined)&&(b===null||b===undefined)) return true;
  if(a instanceof Date && b instanceof Date) return a.getTime()===b.getTime();
  if(Array.isArray(a)&&Array.isArray(b)){ if(a.length!==b.length) return false; return a.every((x,i)=>deepEq(x,b[i])); }
  if(isObj(a)&&isObj(b)){
    const ka=Object.keys(a), kb=Object.keys(b);
    if(ka.length!==kb.length) return false;
    return ka.every(k=>Object.prototype.hasOwnProperty.call(b,k)&&deepEq(a[k],b[k]));
  }
  return false;
}
function canon(v){
  if(typeof v==='number') return 'n:'+(Math.round(v*1e6)/1e6);
  if(v===null||v===undefined) return 'null';
  if(typeof v==='string') return 's:'+JSON.stringify(v);
  if(typeof v==='boolean') return 'b:'+v;
  if(v instanceof Date) return 'd:'+v.toISOString();
  if(v instanceof RegExp) return 'r:'+String(v);
  if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
  if(typeof v==='object'){ const ks=Object.keys(v).filter(k=>v[k]!==undefined).sort(); return '{'+ks.map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'; }

}

/* ---------- пути к полям ---------- */
function resolve(doc, parts){
  if(parts.length===0) return [doc];
  if(doc===null||typeof doc!=='object') return [];
  if(Array.isArray(doc)){
    if(/^\d+$/.test(parts[0])) return doc.length>+parts[0] ? resolve(doc[+parts[0]], parts.slice(1)) : [];
    const out=[]; for(const el of doc) if(isObj(el)) out.push(...resolve(el,parts)); return out;
  }
  if(!Object.prototype.hasOwnProperty.call(doc,parts[0])) return [];
  return resolve(doc[parts[0]], parts.slice(1));
}
function getField(doc, path){
  const parts=path.split('.'); let cur=doc;
  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(cur===null||cur===undefined) return undefined;
    if(Array.isArray(cur)&&!/^\d+$/.test(p)){
      const rest=parts.slice(i).join('.');
      return cur.map(el=>isObj(el)?getField(el,rest):undefined).filter(x=>x!==undefined);
    }
    if(typeof cur!=='object') return undefined;
    cur=cur[p];
  }
  return cur;
}
function getPathRaw(obj,path){
  const parts=path.split('.'); let cur=obj;

  return cur;
}
function setPath(obj,path,val){
  const parts=path.split('.'); let cur=obj;

}
function unsetPath(obj,path){

  for(let i=0;i<parts.length-1;i++){ cur=cur?cur[parts[i]]:undefined; if(cur===null||typeof cur!=='object') return; }

/* ---------- фильтры ---------- */
function isOpObj(c){ return isObj(c) && Object.keys(c).length>0 && Object.keys(c).every(k=>k.startsWith('$')); }
function expand(vals){ const out=[]; for(const v of vals){ out.push(v); if(Array.isArray(v)) out.push(...v); } return out; }
function testRe(re,s){ re.lastIndex=0; return re.test(s); }

function checkQuery(q, where){
  if(q===undefined||q===null) return {};

}
function matchDoc(doc,q){

      const r = key==='$and' ? c.every(x=>matchDoc(doc,checkQuery(x))) : c.some(x=>matchDoc(doc,checkQuery(x)));
      if(key==='$nor' ? r : !r) return false;
      continue;
    }
    if(key==='$expr'){ if(!truthy(evalExpr(c,doc))) return false; continue; }
    if(key.startsWith('$')) throw err('Неизвестный оператор верхнего уровня: '+key+'. Операторы сравнения ($gt, $in…) пишутся внутри поля: { age: { $gt: 30 } }');
    if(!matchField(doc,key,c)) return false;
  }

}
function matchField(doc,path,c){
  const vals=resolve(doc,path.split('.'));
  if(isObj(c) && Object.keys(c).some(k=>k.startsWith('$'))){
    if(!isOpObj(c)) throw err('Нельзя смешивать операторы и обычные поля в условии для «'+path+'»');
    for(const op in c){ if(op==='$options') continue; if(!applyOp(vals,op,c[op],c)) return false; }
    return true;
  }
  if(isObj(c)){
    const ops=['gt','gte','lt','lte','ne','eq','in','nin','exists','regex','size','all','elemMatch','not'];
    const k=Object.keys(c).find(x=>ops.includes(x));
    if(k) throw err('Похоже, вы забыли знак $ перед оператором: пишите { '+path+': { $'+k+': … } }, а не { '+k+': … }');

}
const TYPES={string:3,number:2,double:2,int:2,object:4,array:5,bool:8,boolean:8,date:9,null:1};
function applyOp(vals,op,a,full){
  const ex=expand(vals);

    case '$eq': return matchEq(vals,a);
    case '$ne': return !matchEq(vals,a);
    case '$gt': return ex.some(v=>sameBracket(v,a)&&cmp(v,a)>0);
    case '$gte': return ex.some(v=>sameBracket(v,a)&&cmp(v,a)>=0);
    case '$lt': return ex.some(v=>sameBracket(v,a)&&cmp(v,a)<0);
    case '$lte': return ex.some(v=>sameBracket(v,a)&&cmp(v,a)<=0);
    case '$in': if(!Array.isArray(a)) throw err('$in требует массив: { поле: { $in: [ ... ] } }'); return a.some(x=>matchEq(vals,x));
    case '$nin': if(!Array.isArray(a)) throw err('$nin требует массив: { поле: { $nin: [ ... ] } }'); return !a.some(x=>matchEq(vals,x));
    case '$exists': return (vals.length>0)===!!a;
    case '$regex': {

      catch(e){ throw err('Некорректное регулярное выражение: '+e.message); }

    }
    case '$size': if(typeof a!=='number') throw err('$size требует число'); return vals.some(v=>Array.isArray(v)&&v.length===a);
    case '$all': if(!Array.isArray(a)) throw err('$all требует массив: { поле: { $all: [ ... ] } }'); return vals.some(v=>Array.isArray(v)&&a.every(x=>v.some(y=>eqOne(y,x))));

      return vals.some(v=>Array.isArray(v)&&v.some(el=>{

    case '$not':

  }
}

/* ---------- выражения агрегации ---------- */
function truthy(v){ return !(v===false||v===null||v===undefined||v===0); }
function evalExpr(e,doc){

    if(e.startsWith('$')) return getField(doc,e.slice(1));
    return e;
  }
  if(Array.isArray(e)) return e.map(x=>evalExpr(x,doc));
  if(isObj(e)){
    const keys=Object.keys(e);
    if(keys.length===1&&keys[0].startsWith('$')){
      const op=keys[0], a=e[op];
      const args=()=> (Array.isArray(a)?a:[a]).map(x=>evalExpr(x,doc));
      const nums=v=>(v.length===1&&Array.isArray(v[0])?v[0]:v).filter(x=>typeof x==='number');
      switch(op){
        case '$literal': return a;
        case '$add': return args().reduce((s,x)=>s+(typeof x==='number'?x:0),0);
        case '$subtract': { const [x,y]=args(); return x-y; }
        case '$multiply': return args().reduce((s,x)=>s*x,1);
        case '$divide': { const [x,y]=args(); if(y===0) throw err('$divide: деление на ноль'); return x/y; }
        case '$mod': { const [x,y]=args(); return x%y; }

        case '$round': { const [x,p]=args(); const m=Math.pow(10,p||0); return Math.round(x*m)/m; }
        case '$floor': return Math.floor(args()[0]);
        case '$ceil': return Math.ceil(args()[0]);
        case '$concat': { const v=args(); if(v.some(x=>x===null||x===undefined)) return null; return v.map(String).join(''); }
        case '$toUpper': { const v=args()[0]; return v==null?'':String(v).toUpperCase(); }
        case '$toLower': { const v=args()[0]; return v==null?'':String(v).toLowerCase(); }
        case '$toString': { const v=args()[0]; return v==null?null:String(v); }
        case '$substr': case '$substrCP': { const [s,i,n]=args(); return String(s??'').substr(i,n); }
        case '$strLenCP': return String(args()[0]??'').length;
        case '$size': { const v=args()[0]; if(!Array.isArray(v)) throw err('$size: аргумент должен быть массивом'); return v.length; }
        case '$arrayElemAt': { const [arr,i]=args(); if(!Array.isArray(arr)) return null; return i<0?arr[arr.length+i]:arr[i]; }
        case '$first': { const v=args()[0]; return Array.isArray(v)?v[0]:undefined; }
        case '$last': { const v=args()[0]; return Array.isArray(v)?v[v.length-1]:undefined; }
        case '$sum': return nums(args()).reduce((s,x)=>s+x,0);
        case '$avg': { const n=nums(args()); return n.length?n.reduce((s,x)=>s+x,0)/n.length:null; }
        case '$max': { const n=nums(args()); return n.length?Math.max(...n):null; }
        case '$min': { const n=nums(args()); return n.length?Math.min(...n):null; }
        case '$ifNull': { const v=args(); return (v[0]===null||v[0]===undefined)?v[1]:v[0]; }
        case '$cond': { let c,t,f; if(Array.isArray(a)) [c,t,f]=a; else ({if:c,then:t,else:f}=a); return truthy(evalExpr(c,doc))?evalExpr(t,doc):evalExpr(f,doc); }
        case '$eq': { const [x,y]=args(); return cmp(x,y)===0; }
        case '$ne': { const [x,y]=args(); return cmp(x,y)!==0; }
        case '$gt': { const [x,y]=args(); return cmp(x,y)>0; }
        case '$gte': { const [x,y]=args(); return cmp(x,y)>=0; }
        case '$lt': { const [x,y]=args(); return cmp(x,y)<0; }
        case '$lte': { const [x,y]=args(); return cmp(x,y)<=0; }
        case '$and': return args().every(truthy);
        case '$or': return args().some(truthy);
        case '$not': return !truthy(args()[0]);
        case '$in': { const [x,arr]=args(); if(!Array.isArray(arr)) throw err('$in в выражении требует массив вторым аргументом'); return arr.some(y=>deepEq(x,y)); }
        default: throw err('Неизвестный оператор выражения: '+op);
      }
    }
    const o={}; for(const k of keys) o[k]=evalExpr(e[k],doc); return o;
  }
  return e;
}

/* ---------- проекция и сортировка ---------- */
function project(doc,proj){
  if(proj===undefined||proj===null) return clone(doc);
  if(!isObj(proj)) throw err('Проекция должна быть объектом, например { name: 1, _id: 0 }');
  const keys=Object.keys(proj);
  if(!keys.length) return clone(doc);
  const nonId=keys.filter(k=>k!=='_id');
  const isInc=v=>v===1||v===true||isObj(v)||(typeof v==='string'&&v.startsWith('$'));
  const isExc=v=>v===0||v===false;
  const idOff=isExc(proj._id);
  if(!nonId.length){ if(idOff){ const o=clone(doc); delete o._id; return o; } return doc._id!==undefined?{_id:clone(doc._id)}:{}; }
  const inc=nonId.every(k=>isInc(proj[k])), exc=nonId.every(k=>isExc(proj[k]));
  if(!inc&&!exc) throw err('В проекции нельзя смешивать включение (1) и исключение (0) полей. Исключение: _id можно убрать через _id: 0');
  if(inc){
    const o={};
    if(!idOff&&doc._id!==undefined) o._id=clone(doc._id);
    for(const k of nonId){
      const v=proj[k];
      if(v===1||v===true){ const val=getField(doc,k); if(val!==undefined) setPath(o,k,clone(val)); }
      else { const r=evalExpr(v,doc); if(r!==undefined) setPath(o,k,clone(r)); }
    }
    return o;
  }
  const o=clone(doc); for(const k of nonId) unsetPath(o,k); if(idOff) delete o._id; return o;
}
function sortDocs(docs,spec){
  if(!isObj(spec)) throw err('sort принимает объект: { поле: 1 } (по возрастанию) или { поле: -1 } (по убыванию)');
  const keys=Object.entries(spec);
  for(const [k,d] of keys) if(d!==1&&d!==-1) throw err('В sort для поля «'+k+'» допустимы только 1 или -1');
  return docs.slice().sort((a,b)=>{
    for(const [k,d] of keys){
      let va=getField(a,k), vb=getField(b,k);
      if(Array.isArray(va)) va=va.slice().sort(cmp)[d===1?0:va.length-1];
      if(Array.isArray(vb)) vb=vb.slice().sort(cmp)[d===1?0:vb.length-1];
      const c=cmp(va,vb); if(c!==0) return c*d;
    }
    return 0;
  });
}

/* ---------- курсор ---------- */
class Cursor{
  constructor(src,filter,proj,meta){ this._src=src; this._f=filter||{}; this._p=proj; this._sort=null; this._skip=0; this._limit=0; this._meta=meta||null; }
  sort(s){ this._sort=s; return this; }
  skip(n){ if(typeof n!=='number'||n<0) throw err('skip требует неотрицательное число'); this._skip=n; return this; }
  limit(n){ if(typeof n!=='number') throw err('limit требует число'); this._limit=Math.abs(n); return this; }
  project(p){ this._p=p; return this; }
  projection(p){ this._p=p; return this; }
  pretty(){ return this; }
  batchSize(){ return this; }
  _matched(){ return this._src().filter(d=>matchDoc(d,this._f)); }
  toArray(){
    let d=this._matched();
    if(this._sort) d=sortDocs(d,this._sort);
    if(this._skip) d=d.slice(this._skip);
    if(this._limit) d=d.slice(0,this._limit);
    return d.map(x=>project(x,this._p));
  }
  count(){ return this._matched().length; }
  size(){ return this.toArray().length; }
  itcount(){ return this.toArray().length; }
  forEach(fn){ this.toArray().forEach(fn); }
  map(fn){ return this.toArray().map(fn); }
  hasNext(){ return this.toArray().length>0; }
  next(){ return this.toArray()[0]||null; }
  explain(){
    const m=this._meta;
    if(!m) return { queryPlanner:{ winningPlan:{ stage:'COLLSCAN' } } };
    const fields=Object.keys(this._f).filter(k=>!k.startsWith('$'));
    const idx=(m.indexes()||[]).find(ix=>fields.includes(Object.keys(ix.key)[0]));
    const all=this._src().length, n=this._matched().length;

    if(fields.includes('_id')) plan={ stage:'IDHACK' };
    else if(idx) plan={ stage:'FETCH', inputStage:{ stage:'IXSCAN', keyPattern:idx.key, indexName:idx.name } };
    else plan={ stage:'COLLSCAN', filter:this._f };
    return { explainVersion:'1', queryPlanner:{ namespace:'detective.'+m.name, winningPlan:plan },
      executionStats:{ nReturned:n, totalKeysExamined: idx?n:0, totalDocsExamined: plan.stage==='COLLSCAN'?all:n } };

}

/* ---------- группировка и конвейер ---------- */
function group(docs,spec){
  if(!isObj(spec)||!('_id' in spec)) throw err('В $group обязательно поле _id (по чему группировать). Например: { $group: { _id: "$city", count: { $sum: 1 } } }');
  const map=new Map(), order=[];
  for(const d of docs){
    let id=evalExpr(spec._id,d); if(id===undefined) id=null;
    const key=canon(id);
    if(!map.has(key)){ map.set(key,{id,docs:[]}); order.push(key); }
    map.get(key).docs.push(d);
  }
  return order.map(k=>{
    const g=map.get(k), out={_id:clone(g.id)};
    for(const f in spec){
      if(f==='_id') continue;
      const acc=spec[f];
      if(!isObj(acc)||Object.keys(acc).length!==1||!Object.keys(acc)[0].startsWith('$')) throw err('Поле «'+f+'» в $group должно быть аккумулятором, например { $sum: 1 } или { $avg: "$age" }');
      const op=Object.keys(acc)[0], ex=acc[op];
      const vals=g.docs.map(d=>evalExpr(ex,d));
      const nums=vals.filter(x=>typeof x==='number');
      const def=vals.filter(x=>x!==undefined&&x!==null);
      switch(op){
        case '$sum': out[f]=nums.reduce((s,x)=>s+x,0); break;
        case '$avg': out[f]=nums.length?nums.reduce((s,x)=>s+x,0)/nums.length:null; break;
        case '$min': out[f]=def.length?def.slice().sort(cmp)[0]:null; break;
        case '$max': out[f]=def.length?def.slice().sort(cmp)[def.length-1]:null; break;
        case '$push': out[f]=vals.filter(x=>x!==undefined).map(clone); break;
        case '$addToSet': { const s=[]; for(const v of vals) if(v!==undefined&&!s.some(x=>deepEq(x,v))) s.push(clone(v)); out[f]=s; break; }
        case '$first': out[f]=clone(vals[0]); break;
        case '$last': out[f]=clone(vals[vals.length-1]); break;
        case '$count': out[f]=g.docs.length; break;
        default: throw err('Неизвестный аккумулятор '+op+' в $group');
      }
    }
    return out;
  });

function aggregate(coll,pipeline,dbget){

    if(!isObj(stage)||Object.keys(stage).length!==1) throw err('Каждая стадия конвейера — объект с одним ключом, например { $match: { … } }');
    const name=Object.keys(stage)[0], a=stage[name];

      case '$skip': if(typeof a!=='number') throw err('$skip требует число'); docs=docs.slice(a); break;
      case '$count': if(typeof a!=='string'||!a) throw err('$count требует имя поля строкой: { $count: "total" }'); docs=docs.length?[{[a]:docs.length}]:[]; break;

        if(!spec||typeof spec.path!=='string'||!spec.path.startsWith('$')) throw err('Путь в $unwind должен начинаться с $, например { $unwind: "$skills" }');

    }

function fmt(v,ind){

  if(v===undefined) return 'undefined';
  if(typeof v==='string') return "'"+v.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";
  if(typeof v==='number') return Number.isInteger(v)?String(v):String(Math.round(v*1e10)/1e10);
  if(typeof v==='boolean') return String(v);
  if(v instanceof Date) return "ISODate('"+v.toISOString()+"')";
  if(v instanceof RegExp) return String(v);
  if(typeof v==='function') return '[Function]';
  if(Array.isArray(v)){
    if(!v.length) return '[]';
    const inner=v.map(x=>fmt(x,ind+1)); const one='[ '+inner.join(', ')+' ]';
    if(one.length<72&&!one.includes('\n')) return one;
    return '[\n'+inner.map(s=>pad1+s).join(',\n')+'\n'+pad+']';
  }
  if(typeof v==='object'){
    const ks=Object.keys(v); if(!ks.length) return '{}';
    const inner=ks.map(k=>(/^[A-Za-z_$][\w$]*$/.test(k)?k:"'"+k+"'")+': '+fmt(v[k],ind+1));
    const one='{ '+inner.join(', ')+' }';
    if(one.length<72&&!one.includes('\n')) return one;

  story: `Ночь на 14 марта. Из Городского музея похищен алмаз «Северная звезда». Вас, новенького аналитика детективного бюро, посадили за компьютер: все материалы следствия хранятся в базе данных <b>MongoDB</b>. Прежде чем допрашивать базу, разберёмся, как она устроена.`,

<p>Устройство похоже на матрёшку:</p>
<pre><code>сервер

<p>На диске MongoDB хранит документы в формате <b>BSON</b> (Binary JSON) — двоичном варианте JSON, где есть дополнительные типы: даты, ObjectId, целые и дробные числа.</p>

{
  id: 'q-ops', ch: 2, type: 'quiz', title: 'Операторы сравнения',
  story: `Точное совпадение — это хорошо, но свидетель говорит «высокий», а не «ровно 191 см». Нужны операторы сравнения.`,
  theory: `
<p>Операторы начинаются со знака <code>$</code> и пишутся <b>внутри</b> условия для поля:</p>
<pre><code>{ поле: { $оператор: значение } }</code></pre>
<table class="cmp"><tr><th>Оператор</th><th>Смысл</th><th>Пример</th></tr>
<tr><td><code>$eq</code></td><td>равно</td><td><code>{ age: { $eq: 30 } }</code> = <code>{ age: 30 }</code></td></tr>
<tr><td><code>$ne</code></td><td>не равно</td><td><code>{ genre: { $ne: 'роман' } }</code></td></tr>
<tr><td><code>$gt</code></td><td>больше (greater than)</td><td><code>{ pages: { $gt: 300 } }</code></td></tr>
<tr><td><code>$gte</code></td><td>больше или равно</td><td><code>{ pages: { $gte: 300 } }</code></td></tr>
<tr><td><code>$lt</code></td><td>меньше (less than)</td><td><code>{ price: { $lt: 500 } }</code></td></tr>
<tr><td><code>$lte</code></td><td>меньше или равно</td><td><code>{ price: { $lte: 500 } }</code></td></tr>
<tr><td><code>$in</code></td><td>одно из списка</td><td><code>{ lang: { $in: ['ru', 'en'] } }</code></td></tr>
<tr><td><code>$nin</code></td><td>ни одно из списка</td><td><code>{ lang: { $nin: ['ru', 'en'] } }</code></td></tr></table>
<p>Несколько операторов для одного поля можно объединить — получится диапазон:</p>
<pre><code>{ year: { $gte: 1900, $lt: 2000 } }   // XX век</code></pre>`,
  questions: [
    { q: 'Что найдёт фильтр { age: { $gt: 30 } }?', options: ['Возраст ровно 30', 'Возраст больше 30', 'Возраст 30 и больше', 'Возраст меньше 30'], correct: 1, explain: '$gt — строго больше. «Больше или равно» — это $gte.' },
    { q: 'Какой оператор означает «меньше или равно»?', options: ['$lt', '$le', '$lte', '$min'], correct: 2, explain: '$lte = less than or equal.' },
    { q: 'Что найдёт { city: { $in: [\'Москва\', \'Казань\'] } }?', options: ['Документы, где city — массив из двух городов', 'Документы, где город — Москва или Казань', 'Документы, где города нет', 'Ошибку'], correct: 1, explain: '$in проверяет, входит ли значение в список.' },
    { q: 'Как записать «рост от 170 до 180 включительно»?', options: ['{ height: 170-180 }', '{ height: { $gte: 170, $lte: 180 } }', '{ height: { $in: [170, 180] } }', '{ $gte: { height: 170 } }'], correct: 1, explain: 'Два оператора внутри одного условия для поля образуют диапазон. Вариант с $in найдёт только ровно 170 или ровно 180.' }
  ]
},

/* ================= ГЛАВА 6 ================= */
{
  id: 'q-index', ch: 6, type: 'quiz', title: 'Зачем нужны индексы',
  story: `В архиве бюро миллионы документов, и поиск по имени тормозит. Техотдел советует «завести индекс». Разберёмся, что это такое.`,
  theory: `
<p>Без индекса MongoDB при поиске просматривает <b>каждый</b> документ коллекции. Это называется <b>COLLSCAN</b> (collection scan). На миллионах записей — очень медленно.</p>
<p><b>Индекс</b> — это отдельная упорядоченная структура (B-дерево) по значениям выбранного поля, как алфавитный указатель в конце книги. С ним база сразу находит нужные документы — это <b>IXSCAN</b> (index scan).</p>
<pre><code>db.books.createIndex({ title: 1 })            // индекс по title
db.books.createIndex({ author: 1, year: -1 }) // составной индекс
db.books.createIndex({ isbn: 1 }, { unique: true })  // уникальный
db.books.getIndexes()                         // список индексов</code></pre>
<p>Индекс по <code>_id</code> создаётся автоматически.</p>
<p><b>Цена индексов:</b> они занимают память и замедляют запись — при каждой вставке и изменении индекс тоже нужно обновить. Поэтому индексы создают под реальные частые запросы, а не «на всё подряд».</p>

  theory: `
<p><code>aggregate()</code> принимает <b>конвейер</b> (pipeline) — массив стадий. Документы проходят через стадии по очереди, как детали по конвейеру: каждая стадия получает результат предыдущей.</p>
<pre><code>db.books.aggregate([
  { $match: { lang: 'ru' } },                            // 1. отфильтровать
  { $group: { _id: '$author', total: { $sum: 1 } } },    // 2. сгруппировать
  { $sort: { total: -1 } },                              // 3. отсортировать
  { $limit: 3 }                                          // 4. взять тройку
])</code></pre>
<table class="cmp"><tr><th>Стадия</th><th>Что делает</th></tr>
<tr><td><code>$match</code></td><td>фильтрует (как фильтр в find)</td></tr>
<tr><td><code>$project</code></td><td>выбирает и вычисляет поля</td></tr>
<tr><td><code>$group</code></td><td>группирует и считает итоги</td></tr>
<tr><td><code>$sort</code>, <code>$limit</code>, <code>$skip</code></td><td>как у курсора</td></tr>
<tr><td><code>$unwind</code></td><td>«разворачивает» массив в отдельные документы</td></tr>
<tr><td><code>$lookup</code></td><td>присоединяет документы из другой коллекции</td></tr>
<tr><td><code>$count</code></td><td>считает документы</td></tr></table>
<p>В выражениях агрегации <code>'$author'</code> (со знаком доллара в строке) означает «значение поля author».</p>
<p>Совет по производительности: ставьте <code>$match</code> как можно раньше — так дальше пойдёт меньше документов, а ещё <code>$match</code> в начале может использовать индекс.</p>`,

  if(isAns) h+='<div class="answer"><input id="ans" placeholder="Имя и фамилия" autocomplete="off"><button class="btn primary" id="ansbtn">Предъявить</button></div>';
  h+='<div id="feedback"></div>';
  h+='<details class="data" id="datapanel"><summary>🗂 Данные коллекций <span class="muted">— посмотреть, что лежит в базе</span></summary><div id="datatabs" class="tabs"></div><pre id="dataview" class="dataview"></pre></details>';
  return h;
}
var dataTab='suspects';
function renderData(lv){
  var st=stateFor(lv), names=Object.keys(st.cols).sort();
  if(names.indexOf(dataTab)<0) dataTab=names[0];
  $('#datatabs').innerHTML=names.map(function(n){ return '<button class="tab'+(n===dataTab?' on':'')+'" data-n="'+n+'">'+n+' <span>'+st.cols[n].length+'</span></button>'; }).join('');
  [].forEach.call(document.querySelectorAll('.tab'),function(b){ b.onclick=function(){ dataTab=b.dataset.n; renderData(lv); }; });
  var docs=st.cols[dataTab]||[];
  $('#dataview').innerHTML=docs.length?docs.map(function(d){ return hl(MM.fmt(d)); }).join('\n'):'<span class="muted">Коллекция пуста</span>';
}
function bindConsole(lv){
  var ed=$('#editor');
  ed.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); doRun(lv); return; }
    if(e.key==='Tab'){ e.preventDefault(); insertAt(ed,'  '); return; }
    var pairs={'{':'}','[':']','(':')'};
    if(pairs[e.key]&&ed.selectionStart===ed.selectionEnd){ e.preventDefault(); insertAt(ed,e.key+pairs[e.key]); ed.selectionStart=ed.selectionEnd=ed.selectionStart-1; save2(); return; }
    if((e.key==='}'||e.key===']'||e.key===')')&&ed.value[ed.selectionStart]===e.key&&ed.selectionStart===ed.selectionEnd){ e.preventDefault(); ed.selectionStart=ed.selectionEnd=ed.selectionStart+1; return; }
    if(e.key==='Enter'){
      var before=ed.value.slice(0,ed.selectionStart), line=before.split('\n').pop(), ind=(line.match(/^\s*/)||[''])[0];
      var prev=before.slice(-1), next=ed.value[ed.selectionStart];
      if('{[('.indexOf(prev)>=0&&prev){ e.preventDefault();
        if(next&&'}])'.indexOf(next)>=0){ insertAt(ed,'\n'+ind+'  \n'+ind); ed.selectionStart=ed.selectionEnd=ed.selectionStart-ind.length-1; }
        else insertAt(ed,'\n'+ind+'  ');
        save2(); return; }
      if(ind){ e.preventDefault(); insertAt(ed,'\n'+ind); save2(); return; }
    }
  });
  function save2(){ if(sandboxMode) progress.code.__sandbox=ed.value; else progress.code[lv.id]=ed.value; save(); }
  ed.addEventListener('input',save2);
  autoGrow(ed); ed.addEventListener('input',function(){ autoGrow(ed); });
  $('#run').onclick=function(){ doRun(lv); };
  $('#clear').onclick=function(){ $('#output').innerHTML='<div class="out-empty">Вывод очищен.</div>'; };
  $('#reset').onclick=function(){
    if(sandboxMode) sandboxState=freshState(); else levelStates[lv.id]=freshState(lv);
    appendOut('<div class="out-info">↺ Данные возвращены к исходному состоянию.</div>');
    if(!sandboxMode&&!progress.done[lv.id]) $('#feedback').innerHTML='';
    renderData(lv);
  };
  if($('#hint')) $('#hint').onclick=function(){ var hb=$('#hintbox'); hb.hidden=!hb.hidden; hb.innerHTML='💡 '+hl(lv.hint); };
  if($('#sol')) $('#sol').onclick=function(){
    var n=attempts[lv.id]||0;
    if(n<2&&!progress.done[lv.id]&&!confirm('Показать готовое решение? Попробуйте сначала сами — так запомнится лучше.')) return;
    ed.value=lv.solution; autoGrow(ed); save2(); ed.focus();
  };
  if($('#ansbtn')){
    var ans=$('#ans');
    var submit=function(){
      var v=norm(ans.value); if(!v) return;
      if(lv.answers.map(norm).indexOf(v)>=0) complete(lv);
      else { $('#feedback').innerHTML='<div class="fb bad">❌ Улик против этого человека недостаточно. Перепроверьте данные запросами.</div>'; ans.classList.remove('shake'); void ans.offsetWidth; ans.classList.add('shake'); }
    };
    $('#ansbtn').onclick=submit;
    ans.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  }
  renderData(lv);
  if(!sandboxMode&&progress.done[lv.id]) showSuccess(lv,true);
  setTimeout(function(){ if(window.innerWidth>900) ed.focus(); },30);
}
function autoGrow(ed){ ed.style.height='auto'; ed.style.height=Math.max(70,Math.min(420,ed.scrollHeight+4))+'px'; }
function insertAt(ed,txt){
  var s=ed.selectionStart,e=ed.selectionEnd;
  ed.value=ed.value.slice(0,s)+txt+ed.value.slice(e);
  ed.selectionStart=ed.selectionEnd=s+txt.length;
}
function appendOut(html){
  var o=$('#output'); var em=o.querySelector('.out-empty'); if(em) em.remove();
  o.insertAdjacentHTML('beforeend',html);
  while(o.children.length>30) o.removeChild(o.firstChild);
  o.scrollTop=o.scrollHeight;
}
function renderValue(res){
  if(res.kind==='text') return '<pre class="out-v">'+esc(res.value)+'</pre>';
  var v=res.value, h='';
  if(Array.isArray(v)){
    if(!v.length) return '<div class="out-info">[ ] — ничего не найдено</div>';
    var allDocs=v.every(function(d){ return d&&typeof d==='object'&&!Array.isArray(d); });
    if(allDocs){
      h='<pre class="out-v">'+v.slice(0,60).map(function(d){ return hl(MM.fmt(d)); }).join('\n')+'</pre>';
      if(v.length>60) h+='<div class="out-info">… и ещё '+(v.length-60)+'</div>';
      h+='<div class="out-info">документов: '+v.length+'</div>';
      return h;
    }
    return '<pre class="out-v">'+hl(MM.fmt(v))+'</pre>';
  }
  if(v===undefined) return '<div class="out-info">(команда выполнена, результата нет)</div>';
  return '<pre class="out-v">'+hl(MM.fmt(v))+'</pre>';
}
function doRun(lv){
  var ed=$('#editor'), code=ed.value, st=stateFor(lv);
  var echo='<div class="out-cmd"><span class="pr">detective&gt;</span> '+esc(code.trim().length>300?code.trim().slice(0,300)+'…':code.trim())+'</div>';
  var res;
  try{ res=MM.run(code,st); }
  catch(e){
    appendOut('<div class="out-block">'+echo+'<div class="out-err">⚠ '+esc(e.message)+'</div></div>');
    if(!sandboxMode&&lv.type==='query'&&!progress.done[lv.id]){ attempts[lv.id]=(attempts[lv.id]||0)+1; $('#feedback').innerHTML='<div class="fb bad">Запрос завершился ошибкой — прочитайте сообщение выше.</div>'; }
    return;
  }
  var pr=(res.prints||[]).map(function(p){ return '<pre class="out-v">'+esc(p)+'</pre>'; }).join('');
  appendOut('<div class="out-block">'+echo+pr+renderValue(res)+'</div>');
  renderData(lv);
  if(sandboxMode||lv.type!=='query') return;
  var r;
  try{ r=check(lv,res,st,code); }catch(e){ r={ok:false,msg:'Не удалось проверить: '+e.message}; }
  if(r.ok) complete(lv);
  else { attempts[lv.id]=(attempts[lv.id]||0)+1;
    var extra=attempts[lv.id]>=3?' Не получается? Нажмите «Подсказка» или «Решение».':'';
    $('#feedback').innerHTML='<div class="fb bad">❌ Пока не то. '+esc(r.msg||'')+extra+'</div>'; }
}

/* ---------- прохождение ---------- */
function complete(lv){
  var first=!progress.done[lv.id];
  progress.done[lv.id]=true; save();
  renderSidebar();
  showSuccess(lv,false);
  if(first) toast(lv);
  if(first){ var h=$('h1'); if(h&&!h.querySelector('.okmark')) h.insertAdjacentHTML('beforeend',' <span class="okmark">✓</span>'); }
  if(first&&doneCount()===LEVELS.length) setTimeout(showFinale,600);
}
function showSuccess(lv,quiet){
  var isLast=cur===LEVELS.length-1;
  var h='<div class="fb good'+(quiet?'':' pop')+'"><div class="fb-t">✅ '+(quiet?'Уровень пройден':'Верно!')+'</div>'+(lv.success?'<div>'+lv.success+'</div>':'')+
    (lv.clue?'<div class="clue-new"><span>🔎 Улика на доске</span>'+esc(lv.clue)+'</div>':'')+
    '<div class="fb-btns">'+(isLast?'':'<button class="btn primary" id="gonext">Следующий уровень →</button>')+'<button class="btn" id="goboard">🧩 Доска расследования · '+BOARDUI.state(progress.done).pct+'%</button></div></div>';
  $('#feedback').innerHTML=h;
  if($('#gonext')) $('#gonext').onclick=function(){ go(cur+1); };
  $('#goboard').onclick=function(){ openBoard(lv.id); };
}
function toast(lv){
  var t=$('#toast'), st=BOARDUI.state(progress.done);
  t.innerHTML='<div class="toast-i"><b>🧩 +1 фрагмент пазла</b><span>Дело раскрыто на '+st.pct+'%</span>'+(lv.clue?'<em>Новая улика: '+esc(lv.clue)+'</em>':'')+'</div>';
  t.className='show'; t.onclick=function(){ t.className=''; openBoard(lv.id); };
  clearTimeout(toast.tm); toast.tm=setTimeout(function(){ t.className=''; },5200);
}
function openBoard(fresh){
  sandboxMode=false; boardMode=true; renderSidebar(); closeNav();
  $('#content').innerHTML=BOARDUI.render(progress.done, fresh?BOARDUI.freshPiece(fresh):-1)+'<div class="nav"><button class="btn ghost" id="back">← Вернуться к уровню '+(cur+1)+'</button></div>';
  $('#back').onclick=function(){ go(cur); };
  window.scrollTo(0,0);
}
function showFinale(){
  var m=$('#modal');
  m.innerHTML='<div class="modal-b wide"><h2>Дело «Северная звезда» закрыто!</h2><div class="fin-pz">'+BOARDUI.render(progress.done,-1).match(/<svg class="puzzle"[\s\S]*?<\/svg>/)[0]+'</div><p>Вы прошли все '+LEVELS.length+' уровней «Mongo-детектива»: от первого <code>find()</code> до конвейеров агрегации с <code>$lookup</code>.</p>'+
    '<p>Что дальше: установите MongoDB локально или заведите бесплатный кластер в MongoDB Atlas и повторите запросы на настоящей базе. Песочница игры всегда под рукой — кнопка в шапке.</p><button class="btn primary" id="mclose">Закрыть</button></div>';
  m.hidden=false;
  $('#mclose').onclick=function(){ m.hidden=true; };
}

/* ---------- песочница ---------- */
function openSandbox(){
  sandboxMode=true; boardMode=false; renderSidebar(); closeNav();
  var h='<div class="lvl-head"><div class="crumb">Свободный режим</div><h1>🧪 Песочница</h1></div>'+
    '<div class="story">Здесь можно экспериментировать с любыми запросами без проверки. Доступны все коллекции базы <code>detective</code>. Изменения сохраняются, пока вы не нажмёте «Сбросить данные».</div>'+
    '<details class="theory"><summary>📖 Шпаргалка</summary><div class="theory-b">'+CHEAT+'</div></details>'+consoleHTML(null);
  $('#content').innerHTML=h;
  bindConsole({id:'__sandbox',hint:''});
}
var CHEAT='<pre><code>show collections\n'+
'db.coll.find(фильтр, проекция).sort({ f: 1 }).skip(n).limit(n)\n'+
'db.coll.findOne(фильтр)        db.coll.countDocuments(фильтр)\n'+
'db.coll.distinct(\'поле\', фильтр)\n\n'+
'// операторы\n$eq $ne $gt $gte $lt $lte $in $nin\n$and $or $nor $not $exists $regex $type\n$all $size $elemMatch\n\n'+
'// изменение\ndb.coll.insertOne({…})        db.coll.insertMany([…])\n'+
'db.coll.updateOne(ф, { $set: {…} })   updateMany, replaceOne\n'+
'$set $unset $inc $mul $min $max $rename $push $addToSet $pull $pop\n'+
'db.coll.deleteOne(ф)          db.coll.deleteMany(ф)\n\n'+
'// индексы\ndb.coll.createIndex({ f: 1 })   getIndexes()   find(…).explain()\n\n'+
'// агрегация\ndb.coll.aggregate([ { $match }, { $group }, { $sort }, { $limit },\n  { $project }, { $addFields }, { $unwind }, { $lookup }, { $count } ])\n'+
'// аккумуляторы: $sum $avg $min $max $push $addToSet $first $last</code></pre>';

/* ---------- навигация ---------- */
function closeNav(){ document.body.classList.remove('nav-open'); }
$('#burger').onclick=function(){ document.body.classList.toggle('nav-open'); };
$('#scrim').onclick=closeNav;
$('#sandbox-btn').onclick=openSandbox;
$('#board-btn').onclick=function(){ openBoard(null); };
$('#reset-progress').onclick=function(){
  if(!confirm('Сбросить весь прогресс и сохранённые запросы?')) return;
  progress={done:{},code:{},current:0}; save(); levelStates={}; attempts={}; go(0);
};
renderSidebar(); renderLevel();
})();

</script>
