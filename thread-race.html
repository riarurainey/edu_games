<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гонка потоков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --panel:#12151c; --panel2:#181c25; --line:#232836; --line2:#2f3546;
  --text:#e6e8ee; --muted:#858c9c; --dim:#5a6070;
  --c0:#4fd8f5; --c1:#ff6fd0; --c2:#ffbf47; --c3:#9ff26b;
  --ok:#3ee08a; --bad:#ff5d6c; --warn:#ffb347;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Unbounded','Inter',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);
  background-image:linear-gradient(rgba(79,216,245,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(79,216,245,.035) 1px,transparent 1px);
  background-size:28px 28px}
code,kbd{font-family:var(--mono);font-size:.87em}
code{background:rgba(255,255,255,.06);border:1px solid var(--line);padding:1px 5px;border-radius:4px;color:#ffd98a}
kbd{border:1px solid var(--line2);border-bottom-width:2px;padding:0 5px;border-radius:4px}
b{color:#fff}
header{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(11,13,18,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:800 17px var(--disp);letter-spacing:.3px;white-space:nowrap;display:flex;align-items:center;gap:9px}
.logo .bars{display:inline-flex;flex-direction:column;gap:3px}
.logo .bars i{display:block;height:3px;border-radius:2px}
.logo .bars i:nth-child(1){width:18px;background:var(--c0)}.logo .bars i:nth-child(2){width:12px;background:var(--c1);margin-left:5px}.logo .bars i:nth-child(3){width:15px;background:var(--c2);margin-left:2px}
.prog{flex:1;max-width:340px;display:flex;align-items:center;gap:10px;margin-left:auto}
.prog-track{flex:1;height:6px;background:var(--panel2);border-radius:9px;overflow:hidden}
#prog-bar{height:100%;width:0;background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2));transition:width .5s}
#prog-text{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.hbtn{background:none;border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:6px 11px;font:500 13px var(--sans);cursor:pointer}
.hbtn:hover{border-color:var(--c0);color:var(--c0)}
#burger{display:none;font-size:18px;padding:3px 10px}
.wrap{display:flex;min-height:calc(100vh - 58px)}
aside{width:290px;flex:none;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;padding:8px 10px 30px}
.chap-t{display:flex;justify-content:space-between;gap:8px;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:14px 8px 6px}
.chap-c{font-family:var(--mono)}
.lv{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:6px 8px;border-radius:7px;cursor:pointer;font:14px var(--sans)}
.lv:hover{background:var(--panel2)}
.lv.active{background:rgba(79,216,245,.1);box-shadow:inset 2px 0 var(--c0)}
.lv-n{font:12px var(--mono);color:var(--dim);width:20px;text-align:right;flex:none}
.lv-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-s{font:600 12px var(--mono);color:var(--dim);width:16px;text-align:center}
.lv.done .lv-s{color:var(--ok)} .lv.done .lv-t{color:#b5bac6}
.side-foot{padding:16px 8px 0;border-top:1px solid var(--line);margin-top:10px}
main{flex:1;min-width:0;padding:26px 30px 80px}
#content{max-width:1100px;margin:0 auto}
.crumb{font:500 12px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid}
.b-quiz{color:var(--c0);border-color:rgba(79,216,245,.4)} .b-sim{color:var(--c1);border-color:rgba(255,111,208,.4)} .b-star{color:var(--c2);border-color:rgba(255,191,71,.5)}
h1{font:800 26px/1.3 var(--disp);margin:8px 0 18px;letter-spacing:-.2px}
h1 .num{color:var(--c0)} .okmark{color:var(--ok);font-size:.75em}
.story{background:linear-gradient(135deg,rgba(255,111,208,.07),rgba(79,216,245,.05));border:1px solid var(--line2);border-left:3px solid var(--c1);border-radius:10px;padding:14px 18px;font-size:15.5px;margin-bottom:14px}
.theory{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.theory summary{cursor:pointer;padding:11px 18px;font-weight:600;list-style:none;user-select:none}
.theory summary::-webkit-details-marker{display:none}
.theory summary::after{content:'▾';float:right;color:var(--muted);transition:transform .2s}
.theory:not([open]) summary::after{transform:rotate(-90deg)}
.theory-b{padding:2px 20px 14px;border-top:1px solid var(--line)}
.theory-b p,.theory-b ul,.theory-b ol{margin:11px 0}
.theory-b li{margin:4px 0}
.theory-b pre{background:#07090d;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}
.theory-b pre code{background:none;border:0;padding:0;color:#d7dce8;font-size:13px;line-height:1.55}
.pc-demo{color:var(--c0)}
table.cmp{border-collapse:collapse;margin:12px 0;font-size:14px;width:100%}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.cmp th{background:var(--panel2);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.goal{border:1px solid rgba(62,224,138,.4);background:rgba(62,224,138,.06);border-radius:10px;padding:12px 18px;margin-bottom:12px}
.goal-l{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.8px;color:var(--ok);margin-bottom:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:7px 13px;border-radius:8px;font:500 13px var(--sans);cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#04230f;font-weight:700}
.btn.ghost{background:none}
.btn.small{padding:5px 11px;font-size:12px;margin-top:10px}
.btn.shield{border-color:rgba(79,216,245,.45);color:var(--c0)}
.btn.shield:hover{background:rgba(79,216,245,.1)}
.hintbox{background:rgba(255,191,71,.08);border:1px solid rgba(255,191,71,.35);color:#ffd88d;border-radius:10px;padding:10px 16px;margin-bottom:10px}
.ban{border-radius:10px;padding:10px 16px;margin-bottom:10px;font-size:14px}
.ban.warn{background:rgba(255,179,71,.08);border:1px solid rgba(255,179,71,.4);color:#ffd9a3}
.ban.bad{background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.4)}
.threads{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.threads.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.threads.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.th{--tc:var(--c0);background:#0a0c11;border:1px solid var(--line2);border-top:3px solid var(--tc);border-radius:10px;display:flex;flex-direction:column;min-width:0;transition:.15s;cursor:not-allowed}
.th.c1{--tc:var(--c1)}.th.c2{--tc:var(--c2)}.th.c3{--tc:var(--c3)}
.th.can{cursor:pointer}
.th.can:hover{box-shadow:0 0 0 1px var(--tc),0 8px 30px rgba(0,0,0,.4)}
.th.fin{opacity:.72}
.th-h{display:flex;align-items:center;gap:8px;padding:9px 12px 6px}
.th-k{font:700 11px var(--mono);width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--tc);color:#000;flex:none}
.th-n{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font:700 10px var(--mono);padding:2px 7px;border-radius:5px;letter-spacing:.3px;cursor:help}
.st-RUNNABLE{background:rgba(62,224,138,.15);color:var(--ok)}
.st-BLOCKED{background:rgba(255,93,108,.16);color:var(--bad)}
.st-WAITING{background:rgba(255,179,71,.16);color:var(--warn)}
.st-NEW{background:rgba(255,255,255,.08);color:var(--muted)}
.st-TERMINATED{background:rgba(255,255,255,.06);color:var(--muted)}
.st-bad{color:var(--bad)}
.th-note{font:12px var(--mono);color:var(--muted);padding:0 12px 4px}
.code{font:12.5px/1.6 var(--mono);padding:4px 0 6px;overflow-x:auto;flex:1}
.ln{display:flex;white-space:pre;padding-right:10px;min-width:max-content}
.gut{width:22px;flex:none;text-align:center;color:var(--tc);font-size:11px}
.ln.lbl .tx{opacity:.55}
.ln.pc{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 22%,transparent),transparent)}
.ln.pc .tx{opacity:1}
.th:not(.can) .ln.pc{background:linear-gradient(90deg,rgba(255,93,108,.18),transparent)}
.th:not(.can) .ln.pc .gut{color:var(--bad)}
.ln.last .tx{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--tc) 60%,transparent);text-underline-offset:3px}
.ln.flash{animation:flash .6s}
@keyframes flash{0%{background:color-mix(in srgb,var(--tc) 45%,transparent)}100%{background:transparent}}
.endln .tx{font-style:italic}
.exc{color:var(--bad);white-space:normal}
.j-k{color:#c792ea}.j-s{color:#a8e6a1}.j-n{color:#f5a97f}.j-c{color:#5f6b80;font-style:italic}.j-m{color:#82b1ff}
.locals{display:flex;flex-wrap:wrap;gap:5px;padding:6px 12px;border-top:1px dashed var(--line)}
.loc{font:11.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted)}
.loc b{color:var(--text);font-weight:600}
.th-f{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.why{flex:1;font-size:12px;color:var(--muted);line-height:1.35}
.btn.step{padding:5px 12px;border-color:var(--tc);color:var(--tc);background:none;font-weight:600}
.btn.step:not(:disabled):hover{background:color-mix(in srgb,var(--tc) 15%,transparent)}
.v-s{color:#a8e6a1}.v-n{color:#f5a97f}.v-k{color:#c792ea}.v-null{color:var(--dim)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.panel-t{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:6px}
.muted{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}
.var{display:flex;justify-content:space-between;gap:10px;font:13px var(--mono);padding:3px 6px;border-radius:5px}
.var.chg{animation:chg 1s}
@keyframes chg{0%{background:rgba(255,191,71,.35)}100%{background:transparent}}
.vk{color:#d7dce8}.vv{text-align:right;word-break:break-word}
.own{font:600 11.5px var(--mono);padding:0 6px;border-radius:4px;background:color-mix(in srgb,var(--oc) 18%,transparent);color:var(--oc);white-space:nowrap}
.own.c0{--oc:var(--c0)}.own.c1{--oc:var(--c1)}.own.c2{--oc:var(--c2)}.own.c3{--oc:var(--c3)}
.out,.log{font:12.5px/1.6 var(--mono);max-height:190px;overflow-y:auto}
.out .oerr{color:var(--bad)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:middle;background:var(--oc)}
.dot.c0{--oc:var(--c0)}.dot.c1{--oc:var(--c1)}.dot.c2{--oc:var(--c2)}.dot.c3{--oc:var(--c3)}
.log>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln-i{color:var(--dim);display:inline-block;width:26px}
.note{color:var(--warn)}
#feedback{margin-top:14px}
.fb{border-radius:10px;padding:13px 18px}
.fb.bad{background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.38);color:#ffd0d4}
.fb.info{background:rgba(79,216,245,.07);border:1px solid rgba(79,216,245,.35)}
.fb.good{background:rgba(62,224,138,.07);border:1px solid rgba(62,224,138,.4)}
.fb-t{font:700 16px var(--sans);color:var(--ok);margin-bottom:4px}
.fb.info .fb-t{color:var(--c0)}
.why-b{margin-bottom:8px;color:#cfe9ff}
.fb .btn{margin-top:12px}
.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.quiz{display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px}
.qcard.solved{border-color:rgba(62,224,138,.35)}
.qq{font-weight:600;font-size:15.5px;display:flex;gap:10px;margin-bottom:12px}
.qn{flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font:600 12px var(--mono);color:var(--c0)}
.multi{font:500 11px var(--sans);color:var(--c2);border:1px solid rgba(255,191,71,.4);border-radius:20px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopt{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 13px;border-radius:9px;font:14px var(--sans);cursor:pointer;transition:.15s}
.qopt:hover:not(:disabled){border-color:var(--c0)}
.qopt.sel{border-color:var(--c2);background:rgba(255,191,71,.1)}
.qopt:disabled{cursor:default}
.qopt.right{border-color:var(--ok);background:rgba(62,224,138,.12);color:#fff}
.qopt.wrong{border-color:var(--bad);opacity:.55;text-decoration:line-through}
.qexp{margin-top:10px;font-size:14px;color:#c4c9d4}
.good{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.nav{display:flex;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.modal-b{max-width:520px;background:var(--panel);border:1px solid var(--c0);border-radius:16px;padding:26px 28px;text-align:center}
.modal-b h2{font:800 22px var(--disp);margin:6px 0}
.big{font-size:50px}
body.replaying .th{cursor:progress}
#scrim{display:none}
@media (max-width:1000px){ .threads.n3{grid-template-columns:1fr 1fr} }
@media (max-width:900px){
  #burger{display:inline-block}
  aside{position:fixed;left:0;top:58px;z-index:30;transform:translateX(-105%);transition:transform .25s;box-shadow:10px 0 40px rgba(0,0,0,.5)}
  body.nav-open aside{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.5);z-index:25}
  main{padding:18px 16px 60px}
  h1{font-size:21px}
  .qopts{grid-template-columns:1fr}
  .logo-t{display:none}
}
@media (max-width:640px){
  .threads,.threads.n3,.threads.n4,.panels{grid-template-columns:1fr}
  .toolbar .sp{display:none}
}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="burger" aria-label="Уровни">☰</button>
  <div class="logo"><span class="bars"><i></i><i></i><i></i></span><span class="logo-t">Гонка потоков</span></div>
  <div class="prog"><div class="prog-track"><div id="prog-bar"></div></div><span id="prog-text">0 / 0</span></div>
</header>
<div class="wrap">
  <aside>
    <div id="levels"></div>
    <div class="side-foot"><button class="hbtn" id="reset-progress">Сбросить прогресс</button></div>
  </aside>
  <div id="scrim"></div>
  <main><div id="content"></div></main>
</div>
<div id="modal" hidden></div>
<script>
/* ===== Симулятор потоков: вы — планировщик ===== */
var SIM = (function () {
'use strict';
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function jx(cls, msg) { var e = new Error(msg || cls); e.jx = cls; e.jmsg = msg || ''; return e; }

/* ---- конструкторы инструкций ---- */
var B = {
  L: function (text, id) { return { t: 'label', text: text, id: id }; },
  S: function (text, fn) { return { t: 'exec', text: text, fn: fn }; },
  IF: function (text, cond, to, id) { return { t: 'if', text: text, cond: cond, to: to, id: id }; },
  GOTO: function (text, to, fn) { return { t: 'goto', text: text, to: to, fn: fn }; },
  SYNC: function (text, m) { return { t: 'lock', text: text, m: m, kind: 'sync' }; },
  END: function (text, m) { return { t: 'unlock', text: text, m: m }; },
  LOCK: function (text, m) { return { t: 'lock', text: text, m: m, kind: 'rl' }; },
  UNLOCK: function (text, m) { return { t: 'unlock', text: text, m: m }; },
  WAIT: function (text, m) { return { t: 'wait', text: text, m: m }; },
  NOTIFY: function (text, m) { return { t: 'notify', text: text, m: m }; },
  NOTIFYALL: function (text, m) { return { t: 'notifyAll', text: text, m: m }; },
  BLOCK: function (text, cond, fn, label) { return { t: 'block', text: text, cond: cond, fn: fn, label: label }; },
  PRINT: function (text, fn) { return { t: 'print', text: text, fn: fn }; },
  START: function (text, ti) { return { t: 'start', text: text, ti: ti }; },
  RET: function (text) { return { t: 'ret', text: text }; },
  ID: function (id, op) { op.id = id; return op; },
  jx: jx
};

function prep(level) {
  if (level._prepped) return;
  level.threads.forEach(function (th) {
    th._map = {};
    th.code.forEach(function (op, i) { if (op.id) th._map[op.id] = i; });
  });
  level._prepped = true;
}
function target(th, to) {
  if (to === '$end') return th.code.length;
  if (!(to in th._map)) throw new Error('Нет метки ' + to);
  return th._map[to];
}
function monName(op, t) { return typeof op.m === 'function' ? op.m(t.l) : op.m; }

function init(level) {
  prep(level);
  var s = {
    g: clone(level.vars || {}), mon: {}, out: [], steps: 0, seq: 0, exc: null, last: null,
    threads: level.threads.map(function (th) {
      return { pc: 0, l: clone(th.locals || {}), wait: null, done: false, exc: null, started: !th.notStarted };
    })
  };
  for (var i = 0; i < s.threads.length; i++) normalize(level, s, i);
  return s;
}

function normalize(level, s, ti) {
  var th = level.threads[ti], t = s.threads[ti], guard = 0;
  while (t.pc < th.code.length && guard++ < 1000) {
    var op = th.code[t.pc];
    if (op.t === 'label') { t.pc++; continue; }
    if (op.t === 'goto') { if (op.fn) op.fn(s.g, t.l); t.pc = target(th, op.to); continue; }
    break;
  }
  if (t.pc >= th.code.length && !t.done) finish(s, ti);
}
function finish(s, ti) {
  var t = s.threads[ti];
  t.done = true;
  // монитор synchronized освобождается при выходе из блока (в т.ч. по исключению/return); ReentrantLock — нет
  for (var m in s.mon) if (s.mon[m].owner === ti && s.mon[m].kind === 'sync') delete s.mon[m];
}
function free(s, m, ti) { return !s.mon[m] || s.mon[m].owner === ti; }
function acquire(s, m, ti, kind, count) {
  if (s.mon[m] && s.mon[m].owner === ti) s.mon[m].count += (count || 1);
  else s.mon[m] = { owner: ti, count: count || 1, kind: kind || 'sync' };
}

function view(level, s) {
  var v = {
    g: s.g, out: s.out, exc: s.exc, steps: s.steps,
    done: function (i) { return s.threads[i].done; },
    l: function (i) { return s.threads[i].l; },
    at: function (i, id) { var t = s.threads[i]; return !t.done && level.threads[i].code[t.pc] && level.threads[i].code[t.pc].id === id; }
  };
  v.allDone = s.threads.every(function (t) { return t.done; });
  var any = false;
  for (var i = 0; i < s.threads.length; i++) if (canStep(level, s, i)) { any = true; break; }

  story: 'Банк вводит synchronized повсюду. Но надо понимать, <b>на чём</b> именно мы синхронизируемся.',
  theory: `
<p>У каждого объекта в Java есть <b>монитор</b> (intrinsic lock). <code>synchronized</code> захватывает монитор: пока один поток его держит, другие, пытающиеся его захватить, ждут в состоянии <b>BLOCKED</b>.</p>
<pre><code>synchronized (lock) { ... }        // монитор объекта lock
synchronized void m() { ... }      // монитор this
static synchronized void s() {...} // монитор объекта Account.class</code></pre>
<ul>
<li>Монитор освобождается при выходе из блока — <b>в том числе по исключению или return</b>.</li>
<li>Мониторы <b>реентерабельны</b>: поток, уже владеющий монитором, может войти в него снова (например, synchronized-метод вызывает другой synchronized-метод того же объекта). Ведётся счётчик входов.</li>
<li>Синхронизация работает, только если все потоки используют <b>один и тот же</b> объект-монитор.</li>
<li>Кроме взаимного исключения, synchronized даёт <b>видимость</b>: всё, что поток записал до выхода из блока, увидит следующий поток, захвативший тот же монитор.</li>
</ul>
<p>Совет: синхронизируйтесь на <code>private final Object lock = new Object()</code>. Так чужой код не захватит ваш монитор. Никогда не синхронизируйтесь на строковых литералах или Integer: они кэшируются и могут оказаться общими с чужим кодом.</p>`,

/* ================= ГЛАВА 4. WAIT / NOTIFY ================= */
{
  id: 'q-wait', ch: 4, type: 'quiz', title: 'wait и notify',
  story: 'Очередь платёжных поручений: один поток кладёт заказы, другой забирает. Потребителю нужно как-то ждать, пока очередь пуста, не сжигая процессор в цикле.',
  theory: `
<p>Методы класса <code>Object</code> для ожидания условия:</p>
<ul>
<li><code>wait()</code> — <b>освобождает монитор</b> и усыпляет поток (WAITING) до сигнала.</li>
<li><code>notify()</code> — будит <b>один</b> произвольный поток, ждущий на этом мониторе.</li>
<li><code>notifyAll()</code> — будит всех.</li>
</ul>
<p>Все три можно вызывать <b>только владея монитором</b> (внутри synchronized на том же объекте). Иначе — <code>IllegalMonitorStateException</code>.</p>
<p>Разбуженный поток не продолжает работу сразу: сначала он должен <b>снова захватить монитор</b> (до этого он BLOCKED). За это время условие может снова измениться.</p>
<p>Поэтому канонический шаблон — всегда проверять условие <b>в цикле while</b>:</p>
<pre><code>synchronized (lock) {
    while (!condition) {   // НЕ if!
        lock.wait();
    }
    // условие точно выполнено, монитор у нас
}</code></pre>
<p>Ещё одна причина для while — <b>ложные пробуждения</b> (spurious wakeups): спецификация разрешает wait() вернуться без всякого notify.</p>
<p>В этой игре notify() будит поток, который ждёт дольше всех. В реальной JVM выбор не гарантирован.</p>`,
  questions: [
    { q: 'Что делает wait() с монитором?', options: ['Держит его, пока ждёт', 'Освобождает его на время ожидания, а после пробуждения захватывает снова', 'Удаляет монитор'], correct: 1, explain: 'Иначе никто не смог бы войти в synchronized и вызвать notify.' },
    { q: 'Что будет при вызове lock.notify() вне synchronized (lock)?', options: ['Ничего', 'IllegalMonitorStateException', 'Дедлок', 'Разбудятся все потоки'], correct: 1, explain: 'wait/notify/notifyAll требуют владения монитором.' },
    { q: 'Почему wait() вызывают в цикле while, а не в if?', multi: true, options: ['Пока разбуженный поток ждёт монитор, условие может снова стать ложным', 'Бывают ложные пробуждения', 'Так быстрее', 'notifyAll будит сразу несколько потоков, а условие подходит только одному'], correct: [0, 1, 3], explain: 'Все три причины сводятся к одному: после пробуждения условие нужно проверить заново.' }
  ]
},

/* ================= ГЛАВА 5. ПАМЯТЬ И VOLATILE ================= */
{
  id: 'q-jmm', ch: 5, type: 'quiz', title: 'Модель памяти Java',
  story: 'Самая коварная глава. Здесь баги не про «кто первый», а про то, что один поток может вообще <b>не увидеть</b> изменения другого. Или увидеть их в другом порядке.',
  theory: `
<p>Без синхронизации Java <b>не гарантирует</b>, что запись одного потока станет видна другому, и не гарантирует порядок, в котором она станет видна. Причины:</p>
<ul>
<li><b>Кэши процессора</b>: у каждого ядра свой кэш, и значение может долго «жить» в нём.</li>
<li><b>Оптимизации JIT</b>: компилятор может вынести чтение поля из цикла, если в этом потоке поле не меняется.</li>
<li><b>Переупорядочивание</b>: компилятор и процессор могут менять порядок независимых инструкций — внутри одного потока результат тот же, а для другого потока — нет.</li>
</ul>
<p>Правила видимости задаёт отношение <b>happens-before</b> (HB). Если действие X happens-before Y, то Y гарантированно видит результат X. Основные правила:</p>
<ul>
<li>В пределах одного потока — в порядке программы.</li>
<li>Освобождение монитора HB последующего захвата <b>того же</b> монитора.</li>
<li>Запись в <b>volatile</b>-поле HB последующего чтения этого поля.</li>
<li><code>t.start()</code> HB любого действия в потоке t; все действия потока t HB возврата из <code>t.join()</code>.</li>
<li>Транзитивность: если A HB B и B HB C, то A HB C.</li>
</ul>
<p><b>volatile</b> гарантирует видимость и запрещает переупорядочивание вокруг обращений к полю. Но атомарности составных операций (вроде <code>count++</code>) он <b>не даёт</b>.</p>`,
  questions: [
    { q: 'Что гарантирует volatile?', multi: true, options: ['Видимость записи другим потокам', 'Запрет переупорядочивания вокруг чтения/записи этого поля', 'Атомарность count++', 'Взаимное исключение, как synchronized'], correct: [0, 1], explain: 'volatile — про видимость и порядок, а не про атомарность.' },
    { q: 'Поток A пишет x = 1 и затем пишет в volatile-поле flag = true. Поток B прочитал flag == true. Увидит ли B x == 1?', options: ['Да — по правилам volatile и транзитивности', 'Нет, x ведь не volatile', 'Не определено'], correct: 0, explain: 'Запись x HB записи flag (порядок программы), запись flag HB чтения flag. Это основа «безопасной публикации» через volatile-флаг.' },
    { q: 'Что из этого создаёт отношение happens-before?', multi: true, options: ['Выход из synchronized(m) и последующий вход в synchronized(m)', 'Вызов Thread.sleep()', 't.start() и первое действие потока t', 'Вызов System.out.println()'], correct: [0, 2], explain: 'sleep ничего не гарантирует. println внутри синхронизирован, но полагаться на это — плохая идея.' }
  ]
},

{
  id: 'q-atomic', ch: 6, type: 'quiz', title: 'CAS и атомики',
  story: 'Блокировки работают, но под нагрузкой потоки начинают толкаться в очереди за монитором. Пакет <code>java.util.concurrent.atomic</code> предлагает другой путь — без блокировок.',
  theory: `
<p>Процессор умеет атомарно выполнять операцию <b>CAS</b> (compare-and-set): «если в ячейке значение <i>old</i>, запиши <i>new</i> и верни true, иначе ничего не делай и верни false».</p>
<p>На CAS построены <code>AtomicInteger</code>, <code>AtomicLong</code>, <code>AtomicReference</code> и др. Например, инкремент — это цикл:</p>
<pre><code>int old, next;
do {
    old = value;          // прочитать
    next = old + 1;       // вычислить
} while (!compareAndSet(old, next));   // не вышло — кто-то успел раньше, повторить</code></pre>
<p>Такие алгоритмы называют <b>неблокирующими</b> (lock-free): потоки не засыпают, а повторяют попытку.</p>
<ul>
<li>Под очень высокой конкуренцией CAS часто не удаётся, и потоки «крутятся». Для счётчиков в таком случае лучше <code>LongAdder</code>: у него несколько ячеек, которые суммируются при чтении.</li>
<li><b>Проблема ABA</b>: значение было A, стало B, снова A. CAS не заметит изменений. Решение — <code>AtomicStampedReference</code> (значение + версия).</li>
<li>Атомарны только отдельные операции. Два вызова подряд — уже не атомарная пара.</li>
</ul>`,
  questions: [
    { q: 'Что делает compareAndSet(5, 6)?', options: ['Всегда записывает 6', 'Записывает 6, только если текущее значение 5; возвращает, удалось ли', 'Сравнивает 5 и 6', 'Ждёт, пока значение станет 5'], correct: 1, explain: 'Сравнение и запись выполняются одним неделимым действием.' },
    { q: 'Когда LongAdder лучше AtomicLong?', options: ['Когда нужна операция compareAndSet', 'Когда много потоков часто увеличивают счётчик, а читают его редко', 'Всегда', 'Никогда'], correct: 1, explain: 'LongAdder распределяет конкуренцию по ячейкам. Но sum() не атомарный снимок, и CAS у него нет.' },
    { q: 'if (counter.get() < 10) counter.incrementAndGet(); — потокобезопасно ли это ограничение «не больше 10»?', options: ['Да, ведь AtomicInteger', 'Нет: это check-then-act из двух атомарных операций'], correct: 1, explain: 'Правильно — через цикл CAS или updateAndGet(x -> x < 10 ? x + 1 : x).' }
  ]
},

  theory: `

<p><b>Дедлок пула</b> (thread starvation deadlock): задача в пуле отправляет подзадачу в <i>тот же</i> пул и ждёт её через <code>get()</code>. Если все потоки пула заняты такими ожидающими задачами, подзадачи никогда не запустятся.</p>
<p><b>CompletableFuture</b> — асинхронные цепочки без блокирующего get():</p>
<pre><code>CompletableFuture.supplyAsync(() -> loadUser(id), pool)
    .thenApply(User::getEmail)
    .thenAccept(mailer::send);</code></pre>
<p>Без явного пула supplyAsync использует общий <code>ForkJoinPool.commonPool()</code>. Блокировать его медленным I/O — плохая идея.</p>
<p><b>Коллекции:</b> <code>ConcurrentHashMap</code> (null-ключи и null-значения запрещены), <code>CopyOnWriteArrayList</code> (для «много читаем, редко пишем»), <code>BlockingQueue</code>. <code>Collections.synchronizedMap</code> синхронизирует отдельные методы, но обход и составные операции нужно синхронизировать вручную.</p>
<p><b>Виртуальные потоки</b> (Java 21): <code>Executors.newVirtualThreadPerTaskExecutor()</code>. Это лёгкие потоки, которыми управляет JVM, — их можно создавать миллионами. Они хороши для задач, которые в основном ждут I/O. На CPU-задачах выигрыша нет. В Java 21–23 виртуальный поток «прилипал» к потоку-носителю (pinning) внутри synchronized; в JDK 24 это исправили.</p>`,
  questions: [
    { q: 'Пул на 1 поток. Задача внутри пула делает pool.submit(sub).get(). Что будет?', options: ['Подзадача выполнится в том же потоке', 'Дедлок: единственный поток ждёт подзадачу, которую некому выполнить', 'RejectedExecutionException'], correct: 1, explain: 'Thread starvation deadlock. Решения: отдельный пул для подзадач, неблокирующие цепочки CompletableFuture, ForkJoinPool.' },

    { q: 'Чем shutdown() отличается от shutdownNow()?', options: ['Ничем', 'shutdown доделывает поставленные задачи; shutdownNow прерывает работающие и возвращает те, что не начались', 'shutdownNow ждёт завершения'], correct: 1, explain: 'Чтобы дождаться завершения, после shutdown() вызывают awaitTermination(timeout).' },

function save() { try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {} }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return [].slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ---------- подсветка Java ---------- */
var KW = /\b(synchronized|if|while|for|return|throw|new|int|boolean|static|void|volatile|final|try|finally|continue|class|private|public)\b/g;
function hlJava(text) {
  var parts = text.split(/(\/\/.*$)/);
  var code = esc(parts[0]), cm = parts[1] ? '<span class="j-c">' + esc(parts[1]) + '</span>' : '';
  code = code.replace(/("[^"]*")|(\b\d+\b)|\b(synchronized|if|while|for|return|throw|new|int|boolean|static|void|volatile|final|try|finally|continue|class|private|public|true|false|null)\b|(\.\w+)(?=\()/g,
    function (m, str, num, kw, meth) {
      if (str) return '<span class="j-s">' + str + '</span>';
      if (num) return '<span class="j-n">' + num + '</span>';
      if (kw) return '<span class="j-k">' + kw + '</span>';
      if (meth) return '.<span class="j-m">' + meth.slice(1) + '</span>';
      return m;
    });
  return code + cm;
}
function fmtVal(v) {
  if (v === null || v === undefined) return '<span class="v-null">' + (v === null ? 'null' : '—') + '</span>';
  if (typeof v === 'string') return '<span class="v-s">"' + esc(v) + '"</span>';
  if (typeof v === 'number') return '<span class="v-n">' + v + '</span>';
  if (typeof v === 'boolean') return '<span class="v-k">' + v + '</span>';
  if (Array.isArray(v)) return '[' + v.map(fmtVal).join(', ') + ']';
  return '{' + Object.keys(v).map(function (k) { return esc(k) + '=' + fmtVal(v[k]); }).join(', ') + '}';
}

  return h + '</div>';
}
function bindQuiz(lv) {
  var solved = {}, already = progress.done[lv.id];
  $$('.qcard').forEach(function (card) {
    var qi = +card.dataset.q, q = lv.questions[qi];
    var corr = Array.isArray(q.correct) ? q.correct : [q.correct];
    function finish() {
      solved[qi] = true;
      $$('.qopt', card).forEach(function (b) { b.disabled = true; b.classList.remove('sel'); if (corr.indexOf(+b.dataset.o) >= 0) b.classList.add('right'); });
      var cb = $('.qcheck', card); if (cb) cb.remove();
      card.classList.add('solved');
      $('.qexp', card).innerHTML = '<span class="good">Верно.</span> ' + esc(q.explain);
      if (Object.keys(solved).length === lv.questions.length) complete(lv);
    }
    if (already) { finish(); return; }
    $$('.qopt', card).forEach(function (b) {
      b.onclick = function () {
        if (solved[qi]) return;
        if (q.multi) { b.classList.toggle('sel'); return; }
        if (+b.dataset.o === q.correct) finish();
        else { b.classList.add('wrong'); b.disabled = true; shake(card); $('.qexp', card).innerHTML = '<span class="bad">Не совсем.</span> Подумайте ещё.'; }
      };
    });
    var cb = $('.qcheck', card);
    if (cb) cb.onclick = function () {
      var sel = $$('.qopt.sel', card).map(function (b) { return +b.dataset.o; }).sort();
      if (sel.join() === corr.slice().sort().join()) finish();
      else {
        shake(card);
        var miss = corr.filter(function (c) { return sel.indexOf(c) < 0; }).length, extra = sel.filter(function (c) { return corr.indexOf(c) < 0; }).length;
        $('.qexp', card).innerHTML = '<span class="bad">Не совсем.</span> ' + (extra ? 'Среди выбранных есть неверные. ' : '') + (miss ? 'Выбраны не все верные варианты.' : '');
      }
    };
  });
}
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------- симулятор ---------- */
var COLORS = ['c0', 'c1', 'c2', 'c3'];
function simHTML(lv) {
  return '<div class="goal"><div class="goal-l">🎯 Цель</div>' + lv.task + '</div>' +
    '<div class="toolbar">' +
    '<button class="btn" id="undo">↶ Отменить</button>' +
    '<button class="btn" id="restart">⟲ Сначала</button>' +
    '<span class="sp"></span>' +
    '<button class="btn" id="hint">💡 Подсказка</button>' +
    '<button class="btn" id="solve">🔑 Решение</button>' +
    '<button class="btn shield" id="imposs">🛡 Сломать невозможно</button>' +
    '</div>' +
    '<div id="hintbox" class="hintbox" hidden></div>' +
    '<div id="banner"></div>' +
    '<div class="threads n' + lv.threads.length + '" id="threads"></div>' +
    '<div class="panels"><div class="panel"><div class="panel-t">Общая память (куча)</div><div id="mem"></div></div>' +
    '<div class="panel"><div class="panel-t">Мониторы и блокировки</div><div id="mons"></div></div></div>' +
    '<div class="panels"><div class="panel"><div class="panel-t">Консоль <span class="muted">System.out</span></div><div id="out" class="out"></div></div>' +
    '<div class="panel"><div class="panel-t">Журнал шагов <span class="muted" id="stepc"></span></div><div id="log" class="log"></div></div></div>';
}
function bindSim(lv) {
  sim = { level: lv, state: SIM.init(lv), history: [], log: [], won: false };
  $('#undo').onclick = function () { stopReplay(); undo(); };
  $('#restart').onclick = function () { stopReplay(); restart(); };
  $('#hint').onclick = function () { var b = $('#hintbox'); b.hidden = !b.hidden; b.innerHTML = '💡 ' + esc(lv.hint); };
  $('#solve').onclick = showSolution;
  $('#imposs').onclick = claimImpossible;
  renderSim();
  if (progress.done[lv.id]) showDone(lv, true);
}
function restart() { sim.state = SIM.init(sim.level); sim.history = []; sim.log = []; sim.won = false; if (!progress.done[sim.level.id]) $('#feedback').innerHTML = ''; renderSim(); }
function undo() {
  if (!sim.history.length) return;
  sim.state = sim.history.pop(); sim.log.pop(); sim.won = false; renderSim();
}
function doStep(ti) {
  var lv = sim.level;
  if (!SIM.canStep(lv, sim.state, ti)) { var col = $('.th[data-ti="' + ti + '"]'); if (col) shake(col); return; }
  var ns = SIM.step(lv, sim.state, ti);
  sim.history.push(sim.state);
  var op = lv.threads[ti].code[ns.last.pc];
  sim.log.push({ ti: ti, text: ns.last.note && /захватил/.test(ns.last.note) ? '(после wait) ' + ns.last.note : (op ? op.text.trim() : ''), note: ns.last.note && !/захватил/.test(ns.last.note) ? ns.last.note : '' });
  sim.state = ns;
  renderSim(true);
  checkGoal();
}
function checkGoal() {
  var v = SIM.view(sim.level, sim.state);
  if (!sim.won && sim.level.goal(v)) {
    sim.won = true;
    if (sim.level.impossible) {
      // не должно случаться — уровни проверены
      $('#banner').innerHTML = '<div class="ban bad">Цель достигнута, хотя уровень считался несокрушимым.</div>';
      return;
    }
    complete(sim.level);
  }
}
function renderSim(animate) {
  var lv = sim.level, s = sim.state, v = SIM.view(lv, s);
  // потоки
  var h = '';
  lv.threads.forEach(function (th, ti) {
    var t = s.threads[ti], st = SIM.status(lv, s, ti), can = SIM.canStep(lv, s, ti);
    var lastHere = s.last && s.last.ti === ti;
    h += '<div class="th ' + COLORS[ti % 4] + (can ? ' can' : '') + (t.done ? ' fin' : '') + '" data-ti="' + ti + '">' +
      '<div class="th-h"><span class="th-k">' + (ti + 1) + '</span><span class="th-n">' + esc(th.name) + '</span><span class="st st-' + st.code + (st.bad ? ' st-bad' : '') + '" title="' + esc(st.why) + '">' + st.code + '</span></div>' +
      (th.note ? '<div class="th-note">' + esc(th.note) + '</div>' : '') +
      '<div class="code">';
    th.code.forEach(function (op, i) {
      var isPc = !t.done && t.pc === i, isLast = lastHere && s.last.pc === i;
      var cls = 'ln' + (op.t === 'label' ? ' lbl' : '') + (op.t === 'goto' ? ' lbl' : '') + (isPc ? ' pc' : '') + (isLast ? ' last' + (animate ? ' flash' : '') : '') + (isPc && t.wait ? ' waitpc' : '');
      h += '<div class="' + cls + '"><span class="gut">' + (isPc ? (can ? '▶' : '■') : '') + '</span><span class="tx">' + hlJava(op.text || ' ') + '</span></div>';
    });
    if (t.done) h += '<div class="ln endln"><span class="gut">✓</span><span class="tx">' + (t.exc ? '<span class="exc">✗ ' + esc(t.exc) + '</span>' : '<span class="j-c">// поток завершён</span>') + '</span></div>';
    h += '</div>';
    var lk = Object.keys(t.l);
    if (lk.length) h += '<div class="locals">' + lk.map(function (k) { return '<span class="loc"><b>' + esc(k) + '</b> = ' + fmtVal(t.l[k]) + '</span>'; }).join('') + '</div>';
    h += '<div class="th-f"><span class="why">' + esc(st.why) + '</span><button class="btn step" ' + (can ? '' : 'disabled') + ' data-ti="' + ti + '">Шаг ▸</button></div></div>';
  });
  $('#threads').innerHTML = h;
  $$('.th').forEach(function (el) {
    el.onclick = function () { if (replayTimer) return; doStep(+el.dataset.ti); };
  });
  // память
  var g = s.g, gk = Object.keys(g);
  var prev = sim.history.length ? sim.history[sim.history.length - 1].g : null;
  $('#mem').innerHTML = gk.length ? gk.map(function (k) {
    var changed = prev && JSON.stringify(prev[k]) !== JSON.stringify(g[k]);
    return '<div class="var' + (changed && animate ? ' chg' : '') + '"><span class="vk">' + esc(k) + '</span><span class="vv">' + fmtVal(g[k]) + '</span></div>';
  }).join('') : '<div class="muted">нет общих переменных</div>';
  // мониторы
  var mh = '', ms = Object.keys(s.mon);
  ms.forEach(function (m) {
    var o = s.mon[m];
    mh += '<div class="var"><span class="vk">🔒 ' + esc(m) + '</span><span class="vv"><span class="own ' + COLORS[o.owner % 4] + '">' + esc(lv.threads[o.owner].name) + '</span>' + (o.count > 1 ? ' ×' + o.count : '') + (o.kind === 'rl' ? ' <span class="muted">ReentrantLock</span>' : '') + '</span></div>';
  });
  var waits = {};
  s.threads.forEach(function (t, i) { if (t.wait) (waits[t.wait.m] = waits[t.wait.m] || []).push({ i: i, ph: t.wait.phase, seq: t.wait.seq }); });
  Object.keys(waits).forEach(function (m) {
    var w = waits[m].sort(function (a, b) { return a.seq - b.seq; });
    mh += '<div class="var"><span class="vk">💤 wait-set «' + esc(m) + '»</span><span class="vv">' + w.map(function (x) { return '<span class="own ' + COLORS[x.i % 4] + '">' + esc(lv.threads[x.i].name) + (x.ph === 'reacq' ? ' (разбужен)' : '') + '</span>'; }).join(' ') + '</span></div>';
  });
  $('#mons').innerHTML = mh || '<div class="muted">все блокировки свободны</div>';
  // вывод
  $('#out').innerHTML = s.out.length ? s.out.map(function (o) { return '<div class="' + (o.err ? 'oerr' : '') + '"><span class="dot ' + COLORS[o.ti % 4] + '"></span>' + esc(o.text) + '</div>'; }).join('') : '<div class="muted">пока пусто</div>';
  // журнал
  $('#log').innerHTML = sim.log.length ? sim.log.map(function (e, i) {
    return '<div><span class="ln-i">' + (i + 1) + '</span><span class="own ' + COLORS[e.ti % 4] + '">' + esc(lv.threads[e.ti].name) + '</span> ' + hlJava(e.text) + (e.note ? ' <span class="note">— ' + esc(e.note) + '</span>' : '') + '</div>';
  }).join('') : '<div class="muted">нажмите на поток, чтобы сделать шаг</div>';
  var lg = $('#log'); lg.scrollTop = lg.scrollHeight;
  $('#stepc').textContent = s.steps ? '· шагов: ' + s.steps : '';
  $('#undo').disabled = !sim.history.length;
  // баннер состояния
  var b = '';
  if (!sim.won || sim.level.impossible) {
    if (v.deadlock) b = '<div class="ban warn">⛔ <b>Ни один поток не может продолжить.</b> ' + (sim.level.goal(v) ? '' : 'Но цель уровня в другом — отмените шаги или начните сначала.') + '</div>';
    else if (v.allDone) b = '<div class="ban warn">Все потоки завершились, а цель не достигнута. Отмените шаги или начните сначала — или, может быть, сломать это невозможно?</div>';
  }
  $('#banner').innerHTML = b;
}

/* ---------- решение и «невозможно» ---------- */
function stopReplay() { if (replayTimer) { clearTimeout(replayTimer); replayTimer = null; } document.body.classList.remove('replaying'); }
function showSolution() {
  var lv = sim.level;
  if (lv.impossible) {
    if (!confirm('Показать разгадку?')) return;
    $('#feedback').innerHTML = '<div class="fb info"><div class="fb-t">🛡 Разгадка</div>Сломать этот код нельзя. ' + esc(lv.why) + '<br><br>Нажмите «Сломать невозможно», чтобы засчитать уровень.</div>';
    return;
  }
  if (!progress.done[lv.id] && !confirm('Показать решение? Программа сама сыграет нужный порядок шагов.')) return;
  stopReplay();
  sim.state = SIM.init(lv); sim.history = []; sim.log = []; sim.won = false;
  $('#feedback').innerHTML = '';
  renderSim();
  var r = SIM.solve(lv);
  if (!r.path) { $('#banner').innerHTML = '<div class="ban warn">Решение не найдено.</div>'; return; }
  var i = 0;
  document.body.classList.add('replaying');
  (function next() {
    if (i >= r.path.length) { stopReplay(); return; }
    doStep(r.path[i++]);
    replayTimer = setTimeout(next, 650);
  })();
}
function claimImpossible() {
  var lv = sim.level;
  if (lv.impossible) { complete(lv); return; }
  var b = $('#imposs'); shake(b);
  $('#feedback').innerHTML = '<div class="fb bad">❌ <b>Ошибаетесь — сломать можно.</b> Именно так баги и попадают в продакшен: «у меня не воспроизводится». Ищите порядок шагов.</div>';
}

/* ---------- прохождение ---------- */
function complete(lv) {
  var first = !progress.done[lv.id];
  progress.done[lv.id] = true; save();
  renderSidebar();
  showDone(lv, false);
  if (first) { var h = $('h1'); if (h && !h.querySelector('.okmark')) h.insertAdjacentHTML('beforeend', ' <span class="okmark">✓</span>'); }
  if (first && doneCount() === LEVELS.length) setTimeout(showFinale, 700);
}
function showDone(lv, quiet) {
  var last = cur === LEVELS.length - 1;
  var body = (lv.impossible && lv.why ? '<div class="why-b"><b>Почему:</b> ' + esc(lv.why) + '</div>' : '') + (lv.success ? '<div>' + esc(lv.success) + '</div>' : '');
  $('#feedback').innerHTML = '<div class="fb good' + (quiet ? '' : ' pop') + '"><div class="fb-t">' + (quiet ? '✅ Уровень пройден' : (lv.impossible ? '🛡 Верно — сломать невозможно!' : (lv.type === 'quiz' ? '✅ Все ответы верны' : '💥 Сломано!'))) + '</div>' + body +
    (last ? '' : '<button class="btn primary" id="gonext">Следующий уровень →</button>') + '</div>';
  if ($('#gonext')) $('#gonext').onclick = function () { go(cur + 1); };
}
function showFinale() {
  var m = $('#modal');
  m.innerHTML = '<div class="modal-b"><div class="big">🏁</div><h2>Все потоки завершены</h2><p>Вы прошли все ' + LEVELS.length + ' уровней: гонки, мониторы, дедлоки, wait/notify, модель памяти, CAS и java.util.concurrent.</p><p>Дальше стоит почитать «Java Concurrency in Practice» (Goetz) и погонять свои классы на jcstress — это настоящий «планировщик-вредитель» для JVM.</p><button class="btn primary" id="mclose">Закрыть</button></div>';
  m.hidden = false;
  $('#mclose').onclick = function () { m.hidden = true; };
}

/* ---------- клавиатура и навигация ---------- */
document.addEventListener('keydown', function (e) {
  if (!sim || LEVELS[cur].type !== 'sim' || replayTimer) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (/^[1-9]$/.test(e.key) && +e.key <= sim.level.threads.length) { e.preventDefault(); doStep(+e.key - 1); }
  else if ((e.key === 'z' || e.key === 'я') && (e.ctrlKey || e.metaKey) || e.key === 'Backspace') { e.preventDefault(); undo(); }
});
function closeNav() { document.body.classList.remove('nav-open'); }
$('#burger').onclick = function () { document.body.classList.toggle('nav-open'); };
$('#scrim').onclick = closeNav;
$('#reset-progress').onclick = function () {
  if (!confirm('Сбросить весь прогресс?')) return;
  progress = { done: {}, current: 0 }; save(); go(0);
};
renderSidebar(); renderLevel();
})();

</script>
</body>
</html>
