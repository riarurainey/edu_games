<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дежурный — симулятор инцидентов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ebf2; --panel:#f7f8fb; --panel2:#eef1f6; --line:#cfd6e3; --text:#172033; --muted:#5c6780;
  --amber:#b86b00; --amber-bg:#fff3df; --ok:#1f8a5b; --warn:#b86b00; --crit:#cc2f2f; --info:#2f63c9;
  --chart:#2f63c9; --chart-fill:rgba(47,99,201,.12); --shadow:0 1px 0 rgba(23,32,51,.06);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1526; --panel:#152036; --panel2:#1a2742; --line:#26365a; --text:#e3e8f2; --muted:#8b98b5;
    --amber:#ffb347; --amber-bg:#2b2410; --ok:#4fd19b; --warn:#ffb347; --crit:#ff6464; --info:#7aa7ff;
    --chart:#7aa7ff; --chart-fill:rgba(122,167,255,.14); --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1526; --panel:#152036; --panel2:#1a2742; --line:#26365a; --text:#e3e8f2; --muted:#8b98b5;
  --amber:#ffb347; --amber-bg:#2b2410; --ok:#4fd19b; --warn:#ffb347; --crit:#ff6464; --info:#7aa7ff;
  --chart:#7aa7ff; --chart-fill:rgba(122,167,255,.14); --shadow:none;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}.info{color:var(--info)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.pager{display:flex;align-items:baseline;gap:10px;background:var(--amber-bg);border:1px solid var(--amber);border-radius:6px;padding:4px 12px}
.pager .clock{font:700 26px/1 var(--mono);color:var(--amber);letter-spacing:.02em}
.pager .day{font:12px var(--mono);color:var(--amber);opacity:.8}
.scn-name{font-weight:600}
.scn-sub{font-size:13px;color:var(--muted)}
.budget{display:flex;align-items:center;gap:8px;min-width:190px}
.budget .meter{flex:1;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;min-width:90px}
.budget .meter i{display:block;height:100%;background:var(--ok);transition:width .4s}
.slo{font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.spacer{flex:1}
.ctl{display:flex;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1b1300;font-weight:600}

/* layout */
.game{display:grid;gap:12px;padding:12px 16px 24px;
  grid-template-columns:minmax(230px,1fr) minmax(0,2.3fr) minmax(250px,1.05fr);
  grid-template-areas:"alerts main actions" "changes main actions" "logs logs actions"}
.p{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:0}
.p h2{font-size:14px;font-weight:600;margin:0;padding:10px 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.p h2 small{font-weight:400;color:var(--muted);font-size:12px}
.alerts{grid-area:alerts}.changes{grid-area:changes}.main{grid-area:main;display:flex;flex-direction:column;gap:12px}
.actions{grid-area:actions;align-self:start}.logs{grid-area:logs}
@media (max-width:1100px){
  .game{grid-template-columns:1fr 1fr;grid-template-areas:"main main" "alerts actions" "changes actions" "logs logs"}
}
@media (max-width:720px){
  .game{grid-template-columns:1fr;grid-template-areas:"alerts" "main" "actions" "logs" "changes";padding:10px}
  .pager .clock{font-size:22px}
  .bar{gap:10px;padding:8px 10px}
  .budget{min-width:0;flex:1 1 150px}
}

/* alerts */
.alist{list-style:none;margin:0;padding:0 8px 10px;display:flex;flex-direction:column;gap:6px}
.alist li{border-left:3px solid var(--line);background:var(--panel2);border-radius:4px;padding:6px 8px;font-size:13px}
.alist li b{font-family:var(--mono);font-size:12.5px;font-weight:600;display:block}
.alist li.crit{border-left-color:var(--crit)}.alist li.warn{border-left-color:var(--warn)}.alist li.info{border-left-color:var(--info)}
.alist .since{float:right;color:var(--muted);font:11px var(--mono)}
.empty{padding:4px 12px 12px;color:var(--muted);font-size:13px}

/* change log */
.clist{list-style:none;margin:0;padding:0 12px 12px;font-size:13px;max-height:320px;overflow:auto}
.clist li{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.clist li:first-child{border-top:0}
.clist .when{font:12px var(--mono);color:var(--muted)}
.tag{display:inline-block;font:11px var(--mono);padding:0 5px;border-radius:3px;margin-right:4px;border:1px solid var(--line);color:var(--muted)}
.tag.deploy{color:var(--info);border-color:var(--info)}.tag.flag{color:var(--warn);border-color:var(--warn)}
.tag.you{color:var(--ok);border-color:var(--ok)}.tag.ext{color:var(--crit);border-color:var(--crit)}

/* map */
.mapwrap{padding:0 8px 8px;overflow-x:auto}
.map{width:100%;min-width:540px;height:auto;display:block}
.map .node rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.map .node.ok rect{stroke:var(--ok)}.map .node.warn rect{stroke:var(--warn)}.map .node.crit rect{stroke:var(--crit);stroke-width:2.5}
.map .node.off rect{stroke-dasharray:4 3}
.map .node text{fill:var(--text);font:600 12px var(--sans)}
.map .node text.sub{fill:var(--muted);font:10.5px var(--mono)}
.map .edge{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:flow 1s linear infinite}
.map .edge.warn{stroke:var(--warn)}.map .edge.crit{stroke:var(--crit)}.map .edge.off{animation:none;opacity:.35}
@keyframes flow{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.map .edge{animation:none}}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;padding:0 8px 8px}
@media (max-width:560px){.charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ch{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 8px 4px}
.ch .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ch .ttl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .val{font:600 15px var(--mono);white-space:nowrap}
.ch svg{width:100%;height:52px;display:block}
.ch .line{fill:none;stroke:var(--chart);stroke-width:1.6}
.ch.warn .line{stroke:var(--warn)}.ch.crit .line{stroke:var(--crit)}
.ch .area{fill:var(--chart-fill);stroke:none}
.ch .thr{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1;opacity:.7}
.ch .now{stroke:var(--amber);stroke-width:1;opacity:.7}

/* actions */
.agroup{padding:2px 10px 8px}
.agroup h3{font-size:12px;font-weight:500;color:var(--muted);margin:6px 2px 6px}
.act{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:6px}
.act:hover:not(:disabled){border-color:var(--amber)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .ic{width:20px;text-align:center;flex:none}
.act .nm{font-size:13.5px;font-weight:500;display:block}
.act .ds{font-size:12px;color:var(--muted);display:block}
.act.on{border-color:var(--info);background:color-mix(in srgb,var(--info) 10%,var(--panel2))}
.pending{margin:0 10px 8px;padding:7px 9px;border:1px dashed var(--amber);border-radius:6px;font-size:12.5px;color:var(--amber)}
.flag{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid var(--line)}
.flag:first-of-type{border-top:0}
.flag .fn{font:12.5px var(--mono);display:block}
.flag .fd{font-size:12px;color:var(--muted);display:block}
.sw{flex:none;width:38px;height:22px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);position:relative;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.sw[aria-checked="true"]::after{left:18px;background:#fff}

/* logs */
.logbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logbar select,.logbar label{font-size:12.5px}
.logbar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.loglist{font:12px/1.55 var(--mono);padding:0 12px 12px;max-height:300px;overflow:auto}
.loglist div{white-space:pre-wrap;word-break:break-word;border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent);padding:2px 0}
.loglist .ts{color:var(--muted)}
.loglist .svc{color:var(--info)}
.lv-ERROR,.lv-FATAL{color:var(--crit)}.lv-WARN{color:var(--warn)}.lv-DEBUG{color:var(--muted)}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
.ov[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:760px;width:100%;padding:22px 24px}
.card h1{font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.card h2{font-size:18px;margin:22px 0 8px}
.card p{margin:0 0 10px;max-width:68ch}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.sc{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 13px}
.sc:hover{border-color:var(--amber)}
.sc b{display:block;font-size:15.5px;margin-bottom:3px}
.sc .d{font-size:13px;color:var(--muted);display:block}
.sc .meta{display:flex;justify-content:space-between;margin-top:9px;font:12px var(--mono);color:var(--muted)}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:3px}
.dots i.f{background:var(--amber)}
.pagerscreen{background:var(--amber-bg);border:1px solid var(--amber);border-radius:8px;padding:14px 16px;font-family:var(--mono);color:var(--amber);margin:12px 0 16px}
.pagerscreen .big{font-size:18px;font-weight:700;margin-bottom:4px}
.howto{font-size:14px;color:var(--muted);padding-left:18px;margin:6px 0 0}
.howto li{margin:3px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.result{font-size:34px;font-weight:700;line-height:1.1;margin:0 0 4px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 4px;font-size:14px}
.stats b{font:700 20px var(--mono);display:block}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.verdict{font:600 11.5px var(--mono);padding:1px 6px;border-radius:3px;margin-right:6px;border:1px solid currentColor}
.lessons{padding-left:18px;margin:0}
.lessons li{margin:5px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--panel);border:1px solid var(--amber);border-radius:8px;padding:10px 14px;max-width:min(560px,92vw);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
</style>
</head>
<body>

<div class="bar" id="bar" hidden>
  <div class="pager"><span class="clock" id="clock">03:17</span><span class="day">сб</span></div>
  <div><div class="scn-name" id="scnName"></div><div class="scn-sub" id="scnSub"></div></div>
  <div class="budget" title="Сколько ещё пользователи готовы терпеть ошибки и тормоза"><span class="muted" style="font-size:13px">Error budget</span><div class="meter"><i id="budgetBar"></i></div><span class="mono" id="budgetVal" style="font-size:13px">100%</span></div>
  <span class="slo" id="slo"></span>
  <div class="spacer"></div>
  <div class="ctl">
    <button class="btn" id="bPause" title="Пауза (пробел)">⏸ Пауза</button>
    <button class="btn" id="bSpeed" title="Скорость">1×</button>
    <button class="btn" id="bHint" title="Позвонить тимлиду: подсказка стоит очков">📞 Тимлид</button>
    <button class="btn" id="bMenu" title="К списку сценариев">Выйти</button>
  </div>
</div>

<main class="game" id="game" hidden>
  <section class="p alerts"><h2>Алерты <small id="alertCount"></small></h2><ul class="alist" id="alerts"></ul></section>
  <section class="p changes"><h2>Журнал изменений <small>что менялось</small></h2><ul class="clist" id="changes"></ul></section>
  <div class="main">
    <section class="p"><h2>Карта сервисов <small>полка.ру · prod</small></h2><div class="mapwrap" id="map"></div></section>
    <section class="p"><h2>Метрики <small>последние 36 мин · | — пейджер</small></h2><div class="charts" id="charts"></div></section>
  </div>
  <section class="p actions"><h2>Действия <small>эффект не мгновенный</small></h2><div id="pending"></div><div id="actions"></div>
    <div class="agroup"><h3>Фича-флаги</h3><div id="flags"></div></div></section>
  <section class="p logs"><h2>Логи
    <span class="logbar"><select id="logSvc" aria-label="Сервис"><option value="">все сервисы</option></select>
    <label><input type="checkbox" id="logWarn"> только WARN и выше</label></span></h2>
    <div class="loglist" id="logs"></div></section>
</main>

<div class="ov" id="ov"><div class="card" id="ovCard"></div></div>
<div class="toast" id="toast" hidden></div>

<script id="engine">
/* ================= ENGINE ================= */
const START_MIN = 3*60+17, HIST = 26, MAX_T = 40, TREND = 36;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function fmt(t){const m=((START_MIN+t)%1440+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}

const FLAG_INFO={
  'recs-v2':'Персональные рекомендации v2 на главной',
  'nightly-analytics':'Ночной cron: аналитический отчёт по заказам',
  'search-autocomplete-v3':'Автодополнение в поиске v3',
  'promo-banner':'Баннер осенней распродажи'
};

const V={good:'good',bad:'bad',neutral:'neutral'};
const DEFAULT_V={
  rollback:['neutral','Код API не причина этого инцидента — откат просто съел несколько минут.'],
  scaleUp:['neutral','Добавление подов не затронуло причину инцидента.'],
  scaleDown:['neutral','Число подов не было проблемой.'],
  restart:['neutral','Рестарт ничего не изменил по сути.'],
  flush:['bad','FLUSHALL на проде: все запросы, которые раньше отдавал Redis, разом ушли в Postgres. Кэш был здоров.'],
  warm:['neutral','Кэш и так был тёплым.'],
  ratelimit:['bad','Rate limit отрезал живых пользователей (429), а причина была не в объёме трафика.'],
  'ratelimit:off':['neutral','Ограничение трафика снято.'],
  cb:['neutral','Платёжный провайдер был здоров — circuit breaker ничего не решал.'],
  'cb:off':['neutral','Circuit breaker закрыт.'],
  timeout:['neutral','Таймауты к внешним API не были узким местом.'],
  'timeout:off':['neutral','Таймаут возвращён к 5 с.'],
  expandDisk:['neutral','Место на диске не было проблемой — только лишние деньги.'],
  secrets:['neutral','Секреты были в порядке.'],
  certs:['neutral','Сертификаты были действительны.'],
  waf:['bad','Топ-подсети в обычном трафике — это мобильные операторы и офисные NAT: заблокированы живые покупатели.'],
  'waf:off':['neutral','Блокировка снята.'],
  dlq:['neutral','Очередь работала нормально — сбойных сообщений не было.'],
  consumers:['neutral','Очередь не была узким местом.'],
  l1:['neutral','Горячих ключей не было — L1-кэш ничего не изменил, зато данные стали отдаваться с задержкой до 5 с.'],
  'l1:off':['neutral','L1-кэш выключен.'],
  ntp:['neutral','Время на нодах было в порядке.'],
  lbRevert:['neutral','Последнее изменение конфига LB было безобидным — откат ничего не дал.'],
  drainAz:['bad','Зона AZ-b была здорова: треть мощности ушла впустую, остальные поды получили лишнюю нагрузку.'],
  'drainAz:off':['neutral','Трафик возвращён в зону.'],
  kill:['bad','Убиты обычные пользовательские транзакции — ошибок стало больше, а БД сама по себе была ни при чём.'],
  failover:['bad','Failover здоровой базы — это несколько минут отказа записи на ровном месте.'],
};

const SCENARIOS=[
{
  id:'bad-deploy', title:'Пятничный деплой', diff:1,
  blurb:'Пользователи не могут оформить заказ. Что-то сломалось совсем недавно.',
  pager:'[CRITICAL] HighErrorRate — api 5xx > 5%',
  story:'Интернет-магазин «Полка», ночь с пятницы на субботу. Трафик обычный, но в поддержку уже пишут: «не проходит оформление заказа».',
  triggerAt:-14,
  trigger(s){s.prevVersion=s.version;s.version='v2.14.0';s.bug=0.2;},
  changelog:[
    {when:'чт 16:20',type:'deploy',text:'search-svc v1.8.2 — поправлен ранжир по новинкам'},
    {when:'пт 21:05',type:'flag',text:'promo-banner включён для 100% — старт распродажи'},
    {t:-16,type:'deploy',text:'api v2.14.0 — «промокоды: новая логика скидок» (автодеплой из main)'},
  ],
  rootFixed:s=>s.rolledBack,
  v:{
    rollback:['good','Ошибки начались через 2 минуты после деплоя v2.14.0, а в логах NullPointerException в новом коде промокодов. Откат убирает причину.'],
    scaleUp:['neutral','CPU и потоки не упирались. Больше подов с тем же багом дают те же ошибки.'],
    restart:['neutral','Рестарт не чинит баг: поды поднимаются с той же версией.'],
    'flag:promo-banner':['neutral','Баннер лишь показывает акцию, а падает расчёт скидки на бэкенде. Хорошая гипотеза, но логи указывали на версию кода.'],

function newState(sc){
  const s={t:-HIST,replicas:6,cacheHit:0.92,extLat:180,timeout:5,cb:false,rateLimit:false,bug:0,rolledBack:false,
    version:'v2.13.4',prevVersion:'v2.13.3',mem:50,
    flags:{'recs-v2':false,'nightly-analytics':true,'search-autocomplete-v3':true,'promo-banner':true},
    cronRunning:false,cronStartT:null,cronRetryAt:null,prevErr:0.002,failoverUntil:-999,restartUntil:-999,dataLoss:false,
    budget:100,pending:[],hist:[],logs:[],taken:[],youChanges:[],hints:0,streak:0,lastOom:-999,oomCount:0,replicaTicks:0,
    m:null,over:null,alertSince:{},
    disk:61,walBroken:false,diskExpands:0,certExpired:false,bots:false,waf:false,poison:false,lag:50,consumers:4,
    hotKey:false,l1:false,skew:false,azDown:false,azDrained:false,lbTimeout:false,lbReverted:false,connLeak:false,leaked:0};
  sc.setup&&sc.setup(s);
  return s;
}

function addLog(s,svc,lvl,msg){s.logs.push({t:s.t,sec:rint(0,59),svc,lvl,msg});}

function step(s,sc){
  const due=s.pending.filter(p=>p.at<=s.t);s.pending=s.pending.filter(p=>p.at>s.t);
  due.forEach(p=>p.fn(s));
  (sc.triggers||[{at:sc.triggerAt,fn:sc.trigger}]).forEach(x=>{if(x.at===s.t)x.fn(s);});
  if(!s.cronRunning&&s.cronRetryAt!==null&&s.t>=s.cronRetryAt){
    if(s.flags['nightly-analytics']){s.cronRunning=true;s.cronStartT=s.t;addLog(s,'cron','WARN','nightly-analytics: предыдущий запуск прерван, повторная попытка (retry 1/5)');}
    s.cronRetryAt=null;
  }
  s.mem+=(s.flags['recs-v2']?4.4:0.08)+rnd(-.4,.4);
  if(s.walBroken)s.disk+=1.3+rnd(-.1,.1);else if(s.disk>61.5)s.disk=Math.max(61,s.disk-6);
  s.disk=clamp(s.disk,20,100);const diskFull=s.disk>=100;
  if(s.poison)s.lag+=1800+rint(-60,60);else s.lag=Math.max(rint(20,90),s.lag+1800-s.consumers*1500);
  if(s.connLeak)s.leaked+=8+rnd(-1,1);
  let oom=false;if(s.mem>=100){oom=true;s.mem=40+rnd(0,3);s.lastOom=s.t;s.oomCount++;}
  s.mem=clamp(s.mem,30,100);

  const users=1200*(1+rnd(-.035,.035))*(1+1.3*s.prevErr);
  const bot=(s.bots&&!s.waf)?1900*(1+rnd(-.05,.05)):0;
  const offered=users+bot;
  const eff=s.rateLimit?Math.min(offered,520):offered;
  const shed=(offered-eff)/offered;
  const timeoutMs=s.timeout*1000;
  const extLat=s.extLat*(1+rnd(-.05,.05));
  const attempts=(!s.cb&&extLat>timeoutMs)?3:1;
  const extEff=Math.min(extLat,timeoutMs);
  const block=s.cb?0:0.1*(extEff/1000)*attempts/0.25;
  const gc=s.mem>80?1+(s.mem-80)/12:1;
  const appUtil=eff/(s.replicas*320*(s.azDrained?2/3:1))*(1+block)*(s.mem>80?1+(s.mem-80)/40:1);
  const cronLoad=s.cronRunning?560:0;
  const botShare=bot/offered;
  const hit=(s.hotKey&&!s.l1)?s.cacheHit*0.7:s.cacheHit;
  const dbUtil=(eff*(1-botShare)*((1-hit)*2+0.08)+eff*botShare*0.3+cronLoad)/600;
  const lock=s.cronRunning?0.9:0;
  const connMax=500;
  const connDemand=s.replicas*60*Math.min(1.45,0.3+Math.min(dbUtil,2)*0.4+lock)+s.leaked;
  let core=90*(appUtil<0.8?1:1+(appUtil-0.8)*6)*(dbUtil<0.75?1:1+(dbUtil-0.75)*9)*gc+(s.cronRunning?1900:0);
  if(connDemand>connMax)core+=1200;
  if(s.hotKey&&!s.l1)core+=350;
  if(s.azDown&&!s.azDrained)core=Math.max(core,3050);
  let p99=s.cb?core:Math.max(core,extEff*attempts*0.95);
  p99=clamp(p99*rnd(.95,1.05),40,30000);
  if(s.lbTimeout)p99=Math.min(p99,1000+rnd(0,15));
  const parts=[0.002,
    appUtil>1?Math.min(.95,(appUtil-1)/appUtil):0,
    dbUtil>1?Math.min(.9,(dbUtil-1)/dbUtil)*0.9:0,
    connDemand>connMax?(connDemand-connMax)/connDemand*0.6:0,
    s.bug,
    s.cb?0.004:(attempts>1?0.1:0),
    oom?0.32:0,
    shed*0.5,
    s.t<s.restartUntil?0.03:0,
    s.t<s.failoverUntil?0.45:0,
    s.certExpired?0.22:0,
    diskFull?0.3:0,
    (s.waf&&!s.bots)?0.04:0,
    s.lag>60000?0.12:0,
    (s.hotKey&&!s.l1)?0.06:0,
    s.skew?0.15:0,
    (s.azDown&&!s.azDrained)?0.3:0,
    s.lbTimeout?0.12:0];
  let ok=1;parts.forEach(x=>ok*=(1-x));
  const err=clamp(1-ok+rnd(-.001,.001),0,1);
  const m={t:s.t,offered,eff,shed,p99,err,appUtil,dbUtil,cacheHit:s.cacheHit,mem:s.mem,conn:Math.min(connDemand,connMax),connDemand,connMax,
    ext:s.cb?null:extEff,attempts,oom,cron:s.cronRunning,replicas:s.replicas,disk:s.disk,lag:s.lag,bot};
  if(s.cacheHit<0.92){const fill=dbUtil<1.7?0.03+0.1*(1.7-dbUtil)/1.7:0.003;s.cacheHit=Math.min(0.92,s.cacheHit+fill);}
  s.prevErr=err;s.m=m;s.hist.push(m);if(s.hist.length>TREND+4)s.hist.shift();
  genLogs(s,m);
  if(s.logs.length>220)s.logs.splice(0,s.logs.length-220);

  if(s.t>=0){
    s.budget-=err*6+(p99>1000?0.5:0)+(p99>5000?0.7:0)+(s.lag>20000?0.8:0);
    s.replicaTicks+=Math.max(0,s.replicas-6);
    const healthy=err<0.02&&p99<700&&dbUtil<0.95&&(!sc.healthyExtra||sc.healthyExtra(s));
    s.streak=(sc.rootFixed(s)&&healthy)?s.streak+1:0;
    if(s.streak>=4)s.over='win';
    else if(s.budget<=0){s.budget=0;s.over='budget';}
    else if(s.t>=MAX_T)s.over='time';
  }
  s.t++;
}

function genLogs(s,m){
  const add=(svc,lvl,msg)=>addLog(s,svc,lvl,msg);
  const eps=['GET /api/catalog?page=2','GET /api/product/'+rint(1000,99999),'POST /api/cart/items','GET /api/search?q=кроссовки','GET /api/home'];
  const n=m.err>0.3?1:2;
  for(let i=0;i<n;i++)add('api','INFO',`${pick(eps)} 200 ${Math.round(Math.min(m.p99,9000)*rnd(.08,.4))}ms`);
  if(!m.ext===false&&m.attempts===1&&Math.random()<.4&&!s.cb)add('paybridge-client','INFO',`POST https://api.paybridge.io/v2/charge 200 ${Math.round(m.ext)}ms`);
  if(s.bug>0){add('checkout','ERROR',`NullPointerException: promo.getRules() is null\n    at PromoService.applyDiscount(PromoService.java:88)\n    at CheckoutController.submit(CheckoutController.java:141)  [${s.version}]`);add('api','ERROR',`POST /api/checkout 500 (${s.version})`);}
  if(m.cacheHit<0.7)add('api','WARN',`cache MISS product:${rint(1000,99999)} → запрос в Postgres`);
  if(m.cacheHit<0.6&&Math.random()<.5)add('redis','INFO',`INFO stats: keyspace_hits=${rint(900,4000)} keyspace_misses=${rint(20000,60000)} used_memory=${(0.3+m.cacheHit*3).toFixed(1)}G uptime=${s.t+11}m`);
  if(m.dbUtil>1)add('api','WARN',`db-pool: timeout acquiring connection after 3000ms (active=${Math.round(m.conn/s.replicas)}, waiting=${rint(40,300)})`);
  if(m.dbUtil>0.9&&!s.cronRunning)add('postgres','LOG',`duration: ${rint(1500,6000)} ms  statement: SELECT * FROM products WHERE id = $1`);
  if(m.connDemand>m.connMax)add('postgres','FATAL','sorry, too many clients already (max_connections=500)');
  if(m.attempts>1){add('paybridge-client','WARN',`timeout after ${s.timeout*1000}ms POST https://api.paybridge.io/v2/charge (attempt ${rint(1,3)}/3)`);}
  if(m.appUtil>1)add('api','ERROR',`thread pool "http-worker" exhausted: 200/200 busy, queue ${rint(300,999)}, rejecting request`);
  if(s.cb&&Math.random()<.6)add('paybridge-client','INFO','circuit OPEN → fail fast; платёж поставлен в очередь payments-retry');
  if(m.oom)add('k8s','ERROR',`Pod api-7f9c${rint(10,99)}-${Math.random().toString(36).slice(2,7)} OOMKilled (memory limit 2Gi), restarting`);
  if(m.mem>80)add('api','WARN',`GC pause ${Math.round((m.mem-75)*90)}ms, heap used ${Math.round(m.mem)}%`);
  if(s.flags['recs-v2']&&Math.random()<.55)add('recs','DEBUG',`RecsV2 in-memory user cache: ${(m.mem*0.03+0.1).toFixed(2)}M entries (evictions: 0)`);
  if(s.cronRunning){
    add('postgres','LOG',`process ${rint(4000,4999)} still waiting for RowExclusiveLock on relation "orders" after 5000.${rint(100,999)} ms`);
    if(Math.random()<.55)add('cron','INFO',`nightly-analytics: step 3/7 — SELECT … FROM orders o JOIN events e ON e.user_id = o.user_id … (running ${s.t-s.cronStartT+1} min)`);
  }
  if(s.walBroken){if(Math.random()<.75)add('postgres','LOG',`archive command failed with exit code 1: upload of WAL 0000000100000A1F000000${rint(10,99)} to s3://polka-pg-wal failed: AccessDenied (InvalidAccessKeyId)`);
    if(Math.random()<.4)add('postgres','WARN',`archiver is falling behind: ${Math.round((s.disk-61)*40)} WAL segments pending`);}
  if(m.disk>=100){add('postgres','ERROR','could not extend file "base/16384/24591": No space left on device');add('api','ERROR','POST /api/cart/items 500: PSQLException: No space left on device');}
  if(s.certExpired){add('api','ERROR',`search-client: GET https://search-svc.internal/v1/query: x509: certificate has expired or is not yet valid: current time ${fmt(s.t)}:${String(rint(0,59)).padStart(2,'0')} is after 03:00:00`);
    if(Math.random()<.6)add('search-svc','WARN',`http: TLS handshake error from 10.4.${rint(1,9)}.${rint(2,250)}: remote error: tls: bad certificate`);
    add('api','ERROR','GET /api/search?q=… 502: upstream search-svc unavailable');}
  if(m.bot>0){add('lb','INFO',`top clients (1 мин): 185.220.101.0/24 AS208091 HostCloud — ${Math.round(m.bot/m.offered*100)}% запросов, UA python-requests/2.31`);
    add('api','INFO',`GET /api/search?q=&sort=price_asc&page=${rint(200,9000)} 200 ${Math.round(Math.min(m.p99,9000)*rnd(.3,.9))}ms`);}
  if(s.waf&&Math.random()<.5)add('waf','INFO',s.bots?`blocked ${rint(1700,2000)} req/s from 185.220.101.0/24`:`blocked ${rint(40,120)} req/s from 5.18.0.0/16 (мобильный оператор, NAT)`);
  if(s.poison){add('order-worker','ERROR','order-events p0 offset 88213491: JsonMappingException: Cannot deserialize value of type `BigDecimal` from String "12 990,00"');
    if(Math.random()<.6)add('order-worker','WARN',`retrying offset 88213491 (attempt ${2400+s.t*12+rint(0,11)})`);}
  else if(Math.random()<.3)add('order-worker','INFO',`order-events: processed ${rint(1700,2900)} msgs/min, lag ${Math.round(m.lag)}`);
  if(m.lag>60000)add('api','ERROR','POST /api/checkout 503: kafka producer: buffer exhausted, send timeout (order-events)');
  if(s.hotKey&&!s.l1){add('api','WARN',`redis timeout 250ms reading product:77001 (shard-3) → fallback to Postgres`);if(Math.random()<.6)add('redis','WARN',`slowlog: GET product:77001 — shard-3 CPU 100%, ${rint(88,99)}k ops/s (остальные шарды ~${rint(8,14)}k)`);}
  if(s.skew){add('api','ERROR',`[api-7f9c-${pick(['q2x','k8d'])} node-7] JWT validation failed: token issued in the future (iat skew +${rint(92,97)}s) → 401`);if(Math.random()<.35)add('node-exporter','WARN','node-7: timex sync status unsynchronized, clock offset +94.2s');}
  if(s.azDown&&!s.azDrained){add('api','ERROR',`[api-7f9c-${pick(['b1','b2'])} az-b] db-pool: connect timeout pg-1.az-a:5432 after 3000ms`);if(Math.random()<.5)add('lb','INFO',`healthcheck /healthz: ${s.replicas}/${s.replicas} targets healthy`);}
  if(s.lbTimeout){add('lb','ERROR',`upstream timed out (110) while reading response header from upstream api:8080, request: "${pick(['POST /api/checkout','GET /api/search?q=куртка&sort=rating'])}", 504 after 1.000s`);add('api','INFO',`POST /api/checkout 200 ${rint(1100,2400)}ms`);}
  if(s.connLeak){if(Math.random()<.55)add('postgres','LOG',`pg_stat_activity: ${Math.round(s.leaked)} соединений в состоянии "idle in transaction" (application_name=api)`);if(Math.random()<.55)add('api','WARN',`hikari: connection leak detected, not returned after 30s: at OrderRepository.findRecentOrders(OrderRepository.java:212) [${s.version}]`);}
  if(m.shed>0)add('lb','INFO',`rate limit: 429 → ${Math.round(m.offered-m.eff)} req/s`);
  if(m.err>0.05&&Math.random()<.5)add('lb','WARN',`upstream api: ${(m.err*100).toFixed(1)}% ошибок за последнюю минуту`);
}

  {group:'Платформа',id:'lbRevert',ic:'↶',name:()=>'Откатить последний конфиг LB',ds:()=>'git revert в infra-config, ~1 мин',dis:s=>s.lbReverted,
    run(s){s.lbReverted=true;s.pending.push({at:s.t+1,label:'Откат конфига LB',fn:s=>{s.lbTimeout=false;addLog(s,'lb','INFO','nginx config reloaded (revert of last infra-config change)');}});return 'Откат конфига запущен';}},
  {group:'Платформа',id:'drainAz',toggle:s=>s.azDrained,ic:'⊘',name:s=>s.azDrained?'Вернуть трафик в зону AZ-b':'Увести трафик из зоны AZ-b',ds:()=>'LB перестанет слать запросы в поды AZ-b',
    run(s){s.azDrained=!s.azDrained;addLog(s,'lb','INFO',s.azDrained?'zone eu-central-1b drained: 0% traffic':'zone eu-central-1b: traffic restored');return s.azDrained?'Зона AZ-b выведена':'Зона AZ-b возвращена';}},
  {group:'Очереди',id:'dlq',ic:'⤼',name:()=>'Перенести сбойные сообщения в DLQ',ds:()=>'сообщения, упавшие больше 5 раз',
    run(s){if(s.poison){s.poison=false;addLog(s,'order-worker','WARN','offset 88213491 moved to order-events.dlq after 2931 attempts');return '1 сообщение перенесено в DLQ';}addLog(s,'order-worker','INFO','no messages over retry limit');return 'Сбойных сообщений нет';}},
  {group:'Очереди',id:'consumers',ic:'⇶',name:()=>'Добавить 3 консьюмера заказов',ds:s=>`сейчас ${s.consumers}, ~1 мин`,dis:s=>s.consumers>=13,
    run(s){s.pending.push({at:s.t+1,label:'Старт консьюмеров',fn:s=>{s.consumers+=3;addLog(s,'order-worker','INFO',`consumer group order-processing: ${s.consumers} members, rebalance complete`);}});return 'Консьюмеры запускаются';}},
];

function verdictFor(sc,key,s){
  let v=sc.v[key]!==undefined?sc.v[key]:DEFAULT_V[key];
  if(typeof v==='function')v=v(s);
  if(!v){
    if(key.startsWith('flag:')){const on=key.endsWith(':on');v=on?['neutral','Флаг включён обратно.']:['neutral','Этот флаг не был связан с инцидентом.'];}
    else v=['neutral','Не повлияло на причину инцидента.'];
  }
  return v;
}

function doAction(s,sc,id){
  const a=ACTIONS.find(x=>x.id===id);if(!a||(a.dis&&a.dis(s))||s.over)return null;
  const wasOn=a.toggle?a.toggle(s):false;
  const key=a.toggle&&wasOn?id+':off':id;
  const label=typeof a.name==='function'?a.name(s):a.name;
  const verdict=verdictFor(sc,key,s);
  const msg=a.run(s);
  s.taken.push({t:s.t,key,label,verdict});s.youChanges.push({t:s.t,text:label});
  return msg;
}
function toggleFlag(s,sc,f){
  if(s.over)return null;
  const on=!s.flags[f];s.flags[f]=on;
  const key='flag:'+f+(on?':on':'');
  let verdict=verdictFor(sc,on?key:'flag:'+f,s);
  if(on&&sc.id==='leak'&&f==='recs-v2')verdict=['bad','Утекающий флаг включён обратно.'];
  const label=`Флаг ${f} → ${on?'вкл':'выкл'}`;
  s.taken.push({t:s.t,key,label,verdict});s.youChanges.push({t:s.t,text:label});
  addLog(s,'flags','INFO',`flag ${f} set to ${on} by oncall`);
  return label;
}
function score(s){
  const bad=s.taken.filter(x=>x.verdict[0]==='bad').length;
  let sc=1000+Math.round(s.budget*4)-Math.max(0,s.t)*9-bad*100-s.hints*120-(s.dataLoss?300:0)-Math.round(s.replicaTicks*1.5);
  if(s.over!=='win')sc=Math.min(sc,300);
  return Math.max(0,sc);
}
function presim(s,sc){while(s.t<0)step(s,sc);}
</script>

<script>
/* ================= UI ================= */
const $=id=>document.getElementById(id);
let SC=null,S=null,timer=null,paused=false,speedIdx=0;const SPEEDS=[2500,1200];
let logSvc='',logWarn=false;

function loadBest(){try{return JSON.parse(localStorage.getItem('oncall-best')||'{}')}catch(e){return{}}}
function saveBest(id,v){try{const b=loadBest();if(!b[id]||b[id]<v){b[id]=v;localStorage.setItem('oncall-best',JSON.stringify(b));}}catch(e){}}

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200);}
const pct=x=>(x*100).toFixed(x<0.1?1:0)+'%';
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- menu ---------- */
function showMenu(){
  stop();$('bar').hidden=true;$('game').hidden=true;
  const best=loadBest();
  $('ovCard').innerHTML=`
    <h1>Дежурный</h1>
    <p>Ты — дежурный инженер интернет-магазина. Ночью срабатывает пейджер: прод горит. По алертам, метрикам, логам и журналу изменений найди причину и почини — пока пользователи не исчерпали терпение.</p>
    <ul class="howto">
      <li>Время идёт: одна игровая минута — пара секунд. Пауза — пробел, в паузе можно спокойно читать логи.</li>
      <li>Действия срабатывают с задержкой, как в жизни. Неверные шаги могут сделать хуже.</li>
      <li>Победа — причина устранена и система здорова 4 минуты подряд. Разбор ошибок — в конце.</li>
    </ul>
    <h2>Выбери смену</h2>
    <div class="scgrid">${SCENARIOS.map(sc=>`
      <button class="sc" data-sc="${sc.id}"><b>${esc(sc.title)}</b><span class="d">${esc(sc.blurb)}</span>
      <span class="meta"><span class="dots">${[1,2,3].map(i=>`<i class="${i<=sc.diff?'f':''}"></i>`).join('')}</span><span>${best[sc.id]?'рекорд '+best[sc.id]:'не пройдено'}</span></span></button>`).join('')}
      <button class="sc" data-sc="random"><b>Случайная смена</b><span class="d">Не знаешь, что сломалось. Как в реальности.</span><span class="meta"><span>?</span><span></span></span></button>
    </div>
    <div class="row"><button class="btn" id="bTheme">Тема: ${document.documentElement.dataset.theme==='light'?'светлая':document.documentElement.dataset.theme==='dark'?'тёмная':'как в системе'}</button></div>`;
  $('ov').hidden=false;
  $('ovCard').querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{
    let id=b.dataset.sc;const random=id==='random';if(random)id=pick(SCENARIOS).id;brief(id,random);});
  $('bTheme').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||'';const next=cur===''?'dark':cur==='dark'?'light':'';
    if(next)r.dataset.theme=next;else delete r.dataset.theme;try{localStorage.setItem('oncall-theme',next)}catch(e){}showMenu();};
}

function brief(id,random){
  SC=SCENARIOS.find(x=>x.id===id);SC._random=random;
  $('ovCard').innerHTML=`
    <p class="muted">Суббота, 03:17</p>
    <div class="pagerscreen"><div class="big">📟 ${esc(SC.pager)}</div><div>полка.ру · prod · on-call: ты</div></div>
    <p>${esc(random?'Пейджер разбудил тебя посреди ночи. Разберись, что происходит.':SC.story)}</p>
    <p class="muted">Подсказка тимлида доступна по кнопке 📞, но стоит очков.</p>
    <div class="row"><button class="btn primary" id="bGo">Принять инцидент</button><button class="btn" id="bBack">Назад</button></div>`;
  $('bGo').onclick=()=>start();$('bBack').onclick=showMenu;$('bGo').focus();
}

function start(){
  S=newState(SC);presim(S,SC);
  $('ov').hidden=true;$('bar').hidden=false;$('game').hidden=false;
  $('scnName').textContent=SC._random?'Случайная смена':SC.title;
  $('scnSub').textContent='полка.ру · prod';
  const svcs=['node-exporter','api','checkout','postgres','redis','paybridge-client','search-svc','order-worker','k8s','cron','recs','lb','waf','vault-agent','cert-manager','flags'];
  $('logSvc').innerHTML='<option value="">все сервисы</option>'+svcs.map(x=>`<option>${x}</option>`).join('');
  logSvc='';logWarn=false;$('logWarn').checked=false;
  paused=false;render();run();window.scrollTo(0,0);
}
function run(){stop();timer=setInterval(tick,SPEEDS[speedIdx]);updCtl();}
function stop(){clearInterval(timer);timer=null;}
function tick(){if(!S||S.over||paused)return;step(S,SC);render();if(S.over)finish();}
function updCtl(){$('bPause').textContent=paused?'▶ Дальше':'⏸ Пауза';$('bSpeed').textContent=(speedIdx+1)+'×';}

/* ---------- render ---------- */
function render(){
  const s=S,m=s.m;
  $('clock').textContent=fmt(s.t);
  const b=Math.max(0,s.budget);$('budgetBar').style.width=b+'%';
  $('budgetBar').style.background=b>50?'var(--ok)':b>25?'var(--warn)':'var(--crit)';$('budgetVal').textContent=Math.round(b)+'%';
  const slo=$('slo');
  if(s.streak>0){slo.textContent=`Восстановление ${s.streak}/4`;slo.className='slo ok';}
  else if(m.err>0.02||m.p99>700){slo.textContent='SLO нарушен';slo.className='slo crit';}
  else{slo.textContent='Метрики в норме';slo.className='slo warn';}
  renderAlerts();renderChanges();renderMap();renderCharts();renderActions();renderLogs();
}

function computeAlerts(){
  const s=S,m=s.m,a=[];
  if(m.err>0.05)a.push(['crit','HighErrorRate',`ошибки ${pct(m.err)} (SLO 1%)`]);else if(m.err>0.02)a.push(['warn','ErrorRateElevated',`ошибки ${pct(m.err)}`]);
  if(m.p99>1500)a.push(['crit','HighLatencyP99',`p99 ${fmtMs(m.p99)}`]);else if(m.p99>600)a.push(['warn','LatencyP99Elevated',`p99 ${fmtMs(m.p99)}`]);
  if(m.appUtil>1)a.push(['crit','ThreadPoolSaturated','api: все потоки заняты']);
  if(m.dbUtil>1)a.push(['crit','PostgresCPUHigh',`нагрузка ${Math.round(m.dbUtil*100)}% ёмкости`]);else if(m.dbUtil>0.85)a.push(['warn','PostgresCPUHigh',`CPU ${Math.round(m.dbUtil*100)}%`]);
  if(m.connDemand>m.connMax*0.9)a.push(['crit','PGConnectionsSaturated',`${Math.round(m.conn)}/${m.connMax}`]);
  if(m.cacheHit<0.7)a.push(['warn','RedisHitRateLow',`hit rate ${pct(m.cacheHit)}`]);
  if(s.t-s.lastOom<=4)a.push(['crit','PodOOMKilled',`рестартов из-за OOM: ${s.oomCount}`]);
  if(m.mem>85)a.push(['warn','APIMemoryHigh',`heap ${Math.round(m.mem)}%`]);
  if(m.attempts>1)a.push(['crit','DependencyTimeouts','paybridge: таймауты']);
  if(s.cronRunning&&s.t-s.cronStartT>=5)a.push(['warn','LongRunningQuery',`запрос дольше ${s.t-s.cronStartT} мин`]);
  const prev=s.hist[s.hist.length-2];const dr=prev?m.disk-prev.disk:0;
  if(m.disk>=100)a.push(['crit','PGDiskFull','pg-1: 100%, запись невозможна']);
  else if(m.disk>95)a.push(['crit','PGDiskAlmostFull',`pg-1: ${Math.round(m.disk)}% (${dr>=0?'+':''}${dr.toFixed(1)}%/мин)`]);
  else if(m.disk>85)a.push(['warn','PGDiskAlmostFull',`pg-1: ${Math.round(m.disk)}% (${dr>=0?'+':''}${dr.toFixed(1)}%/мин)`]);
  if(s.walBroken&&m.disk>80)a.push(['warn','WALArchiveFailing','архивация WAL в S3 не проходит']);
  if(s.certExpired)a.push(['crit','UpstreamErrors','search-svc: 502 на /api/search']);
  if(m.offered>2200)a.push(['warn','TrafficSpike',`${Math.round(m.offered/1200*100)}% от обычного`]);
  if(m.lag>40000)a.push(['crit','QueueLagHigh',`order-events: ${Math.round(m.lag/1000)}k сообщений`]);else if(m.lag>5000)a.push(['warn','QueueLagHigh',`order-events: ${Math.round(m.lag/1000)}k сообщений`]);
  if(s.poison)a.push(['warn','ConsumerErrors','order-worker: ошибки обработки']);
  if(s.hotKey&&!s.l1)a.push(['warn','RedisShardCPUHigh','redis shard-3: CPU 100%']);
  if(s.skew)a.push(['crit','Auth401Spike',`401 на ~15% запросов`]);
  if(s.azDrained)a.push(['info','ZoneDrained','AZ-b без трафика']);
  if(s.waf)a.push(['info','WAFRuleActive','блокировка подсетей']);
  if(s.rateLimit)a.push(['info','RateLimitActive',`429 для ${pct(m.shed)} запросов`]);
  if(s.cb)a.push(['info','CircuitBreakerOpen','paybridge: fail fast']);
  const now=new Set(a.map(x=>x[1]));
  a.forEach(x=>{if(s.alertSince[x[1]]===undefined)s.alertSince[x[1]]=s.t;});
  Object.keys(s.alertSince).forEach(k=>{if(!now.has(k))delete s.alertSince[k];});
  return a;
}
function renderAlerts(){
  const a=computeAlerts();const order={crit:0,warn:1,info:2};a.sort((x,y)=>order[x[0]]-order[y[0]]);
  $('alertCount').textContent=a.filter(x=>x[0]==='crit').length?a.filter(x=>x[0]==='crit').length+' critical':'';
  $('alerts').innerHTML=a.length?a.map(x=>`<li class="${x[0]}"><span class="since">с ${fmt(Math.max(S.alertSince[x[1]],-HIST+1))}</span><b>${x[1]}</b>${esc(x[2])}</li>`).join(''):'<li class="info"><b>Всё тихо</b>Активных алертов нет</li>';
}
function renderChanges(){
  const items=SC.changelog.map(c=>({when:c.when||fmt(c.t),type:c.type,text:c.text,ord:c.t!==undefined?c.t:-9999})).concat(S.youChanges.map(c=>({when:fmt(c.t),type:'you',text:c.text,ord:c.t+0.5})));
  items.sort((a,b)=>b.ord-a.ord);
  const names={deploy:'deploy',flag:'flag',infra:'infra',ext:'внешнее',cron:'cron',you:'ты'};
  $('changes').innerHTML=items.map(c=>`<li><span class="when">${esc(c.when)}</span><span><span class="tag ${c.type}">${names[c.type]}</span>${esc(c.text)}</span></li>`).join('');
}
const fmtMs=v=>v>=1000?(v/1000).toFixed(1)+' с':Math.round(v)+' мс';

function renderMap(){
  const s=S,m=s.m;
  const hApi=(m.appUtil>1||s.bug>0||s.t-s.lastOom<=1||(s.azDown&&!s.azDrained)||s.skew)?'crit':(m.appUtil>0.8||m.mem>85||m.err>0.02)?'warn':'ok';
  const hLb=m.err>0.05?'crit':(m.shed>0||m.err>0.02||m.offered>2200)?'warn':'ok';
  const hRedis=(m.cacheHit<0.6||(s.hotKey&&!s.l1))?'crit':m.cacheHit<0.8?'warn':'ok';
  const hPg=(m.dbUtil>1||m.connDemand>m.connMax||s.t<s.failoverUntil||m.disk>=95)?'crit':(m.dbUtil>0.8||s.cronRunning||m.disk>85)?'warn':'ok';
  const hPay=s.cb?'off':m.attempts>1?'crit':'ok';
  const hCron=s.cronRunning?'warn':'off';
  const hSearch=s.certExpired?'crit':'ok';
  const hQ=m.lag>40000?'crit':m.lag>5000?'warn':'ok';
  const hW=s.poison?'crit':'ok';
  const node=(x,y,w,label,sub,h)=>`<g class="node ${h}" transform="translate(${x},${y})"><rect width="${w}" height="44" rx="6"/><text x="10" y="18">${label}</text><text class="sub" x="10" y="34">${sub}</text></g>`;
  const edge=(d,h)=>`<path class="edge ${h}" d="${d}"/>`;
  const e=h=>h==='off'?'off':h;
  $('map').innerHTML=`<svg class="map" viewBox="0 0 644 204" role="img" aria-label="Карта сервисов">
    ${edge('M92 106 H130',hLb)}${edge('M232 106 H280',hApi)}
    ${edge('M388 106 C420 106 420 36 452 36',hRedis)}${edge('M388 106 H452',hPg)}${edge('M388 106 C420 106 420 176 452 176',hSearch)}
    ${edge('M334 84 V36 H300',e(hPay))}${edge('M574 106 H560',e(hCron))}
    ${edge('M334 128 V154',hQ)}${edge('M280 176 H232',hW)}
    ${node(8,84,84,'Клиенты',Math.round(m.offered)+' rps','ok')}
    ${node(130,84,102,'Балансировщик',s.rateLimit?'limit 520':s.waf?'WAF: блок':'без лимита',hLb)}
    ${node(280,84,108,'API ×'+s.replicas,'CPU '+Math.min(999,Math.round(m.appUtil*100))+'%',hApi)}
    ${node(452,14,108,'Redis',(s.hotKey&&!s.l1)?'shard-3 CPU 100%':'hit '+pct(m.cacheHit),hRedis)}
    ${node(452,84,108,'Postgres','CPU '+Math.min(100,Math.round(m.dbUtil*100))+'% · диск '+Math.round(m.disk)+'%',hPg)}
    ${node(452,154,108,'search-svc',s.certExpired?'TLS ошибка':'ok',hSearch)}
    ${node(186,14,114,'paybridge.io',s.cb?'CB open':fmtMs(m.ext||0),hPay)}
    ${node(574,84,66,'cron',s.cronRunning?'работает':'ждёт',hCron==='off'?'ok off':hCron)}
    ${node(280,154,108,'order-events','lag '+(m.lag>=1000?(m.lag/1000).toFixed(1)+'k':Math.round(m.lag)),hQ)}
    ${node(130,154,102,'order-worker ×'+s.consumers,s.poison?'ошибки':'ok',hW)}
  </svg>`;
}

const CHARTS=[
  {t:'Входящий трафик',g:m=>m.offered,f:v=>Math.round(v)+' rps',max:v=>Math.max(1800,...v)*1.1},
  {t:'Latency p99',g:m=>m.p99,f:fmtMs,w:600,c:1500,max:v=>Math.max(1000,...v)*1.1},
  {t:'Ошибки (5xx + 429)',g:m=>m.err*100,f:v=>v.toFixed(v<10?1:0)+'%',w:2,c:5,max:v=>Math.max(10,...v)*1.1},
  {t:'API: загрузка потоков',g:m=>Math.min(m.appUtil,4)*100,f:v=>Math.round(v)+'%',w:80,c:100,max:v=>Math.max(120,...v)*1.1},
  {t:'Postgres: нагрузка',g:m=>Math.min(m.dbUtil,4)*100,f:v=>Math.round(v)+'%',w:85,c:100,max:v=>Math.max(120,...v)*1.1},
  {t:'Redis hit rate',g:m=>m.cacheHit*100,f:v=>Math.round(v)+'%',w:80,c:60,inv:true,max:()=>100},
  {t:'Память подов api',g:m=>m.mem,f:v=>Math.round(v)+'%',w:80,c:92,max:()=>100},
  {t:'Соединения Postgres',g:m=>m.conn,f:v=>Math.round(v)+' / 500',w:420,c:490,max:()=>540},
  {t:'Диск Postgres',g:m=>m.disk,f:v=>Math.round(v)+'%',w:85,c:95,max:()=>100},
  {t:'Очередь заказов: lag',g:m=>m.lag,f:v=>v>=1000?(v/1000).toFixed(1)+'k':String(Math.round(v)),w:5000,c:40000,max:v=>Math.max(10000,...v)*1.1},
  {t:'paybridge: ответ',g:m=>m.ext===null?0:m.ext,f:(v,m)=>m.ext===null?'CB open':fmtMs(v),w:1000,c:4000,max:v=>Math.max(1000,...v)*1.1},
];
function lvl(c,v){if(c.w===undefined)return'';if(c.inv)return v<c.c?'crit':v<c.w?'warn':'';return v>=c.c?'crit':v>=c.w?'warn':'';}
function renderCharts(){
  const H=S.hist.slice(-TREND);const W=220,Hh=52,n=H.length,dx=W/(TREND-1),off=(TREND-n)*dx;
  $('charts').innerHTML=CHARTS.map(c=>{
    const vals=H.map(c.g);const mx=c.max(vals);const y=v=>Hh-2-(Math.min(v,mx)/mx)*(Hh-6);
    const pts=vals.map((v,i)=>`${(off+i*dx).toFixed(1)},${y(v).toFixed(1)}`);
    const cur=vals[vals.length-1];const L=lvl(c,cur);
    const thr=c.w!==undefined?`<line class="thr" x1="0" x2="${W}" y1="${y(c.inv?c.w:c.w)}" y2="${y(c.w)}"/>`:'';
    const iNow=H.findIndex(m=>m.t===0);const now=iNow>=0?`<line class="now" x1="${off+iNow*dx}" x2="${off+iNow*dx}" y1="0" y2="${Hh}"/>`:'';
    return `<div class="ch ${L}"><div class="top"><span class="ttl">${c.t}</span><span class="val ${L}">${c.f(cur,H[H.length-1])}</span></div>
      <svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true">${thr}${now}
      <polygon class="area" points="${off},${Hh} ${pts.join(' ')} ${W},${Hh}"/><polyline class="line" points="${pts.join(' ')}"/></svg></div>`;
  }).join('');
}
function renderActions(){
  const s=S;
  $('pending').innerHTML=s.pending.map(p=>`<div class="pending">⏳ ${esc(p.label)} — будет в ${fmt(p.at)}</div>`).join('');
  const groups=[...new Set(ACTIONS.map(a=>a.group))];
  $('actions').innerHTML=groups.map(g=>`<div class="agroup"><h3>${g}</h3>${ACTIONS.filter(a=>a.group===g).map(a=>{
    const on=a.toggle&&a.toggle(s);const busy=s.pending.some(p=>p._id===a.id);
    return `<button class="act ${on?'on':''}" data-act="${a.id}" ${(a.dis&&a.dis(s))||busy?'disabled':''}><span class="ic">${a.ic}</span><span><span class="nm">${esc(a.name(s))}</span><span class="ds">${esc(a.ds(s))}</span></span></button>`;}).join('')}</div>`).join('');
  $('flags').innerHTML=Object.keys(FLAG_INFO).map(f=>`<div class="flag"><button class="sw" role="switch" aria-checked="${s.flags[f]}" aria-label="${f}" data-flag="${f}"></button><span><span class="fn">${f}</span><span class="fd">${FLAG_INFO[f]}</span></span></div>`).join('');
}
function renderLogs(){
  const rank={DEBUG:0,INFO:1,LOG:1,WARN:2,ERROR:3,FATAL:3};
  const L=S.logs.filter(l=>(!logSvc||l.svc===logSvc)&&(!logWarn||rank[l.lvl]>=2)).slice(-90).reverse();
  $('logs').innerHTML=L.length?L.map(l=>`<div><span class="ts">${fmt(l.t)}:${String(l.sec).padStart(2,'0')}</span> <span class="lv-${l.lvl}">${l.lvl.padEnd(5)}</span> <span class="svc">${l.svc}</span> <span class="lv-${l.lvl==='ERROR'||l.lvl==='FATAL'?l.lvl:''}">${esc(l.msg)}</span></div>`).join(''):'<div class="muted">Нет строк под этот фильтр</div>';
}

/* ---------- events ---------- */
$('actions').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!S)return;
  const before=S.pending.length;const msg=doAction(S,SC,b.dataset.act);
  if(S.pending.length>before)S.pending[S.pending.length-1]._id=b.dataset.act;
  if(msg){toast(msg);render();}});
$('flags').addEventListener('click',e=>{const b=e.target.closest('[data-flag]');if(!b||!S)return;const msg=toggleFlag(S,SC,b.dataset.flag);if(msg){toast(msg);render();}});
$('logSvc').onchange=e=>{logSvc=e.target.value;renderLogs();};
$('logWarn').onchange=e=>{logWarn=e.target.checked;renderLogs();};
$('bPause').onclick=()=>{paused=!paused;updCtl();};
$('bSpeed').onclick=()=>{speedIdx=(speedIdx+1)%SPEEDS.length;run();};
$('bHint').onclick=()=>{if(!S||S.over)return;S.hints++;paused=true;updCtl();
  $('ovCard').innerHTML=`<p class="muted">📞 Тимлид, сонным голосом</p><h1 style="font-size:22px">«${esc(SC.hint)}»</h1><p class="muted">−120 очков. Игра на паузе.</p><div class="row"><button class="btn primary" id="bOk">Понял, продолжаю</button></div>`;
  $('ov').hidden=false;$('bOk').onclick=()=>{$('ov').hidden=true;paused=false;updCtl();};$('bOk').focus();};
$('bMenu').onclick=()=>{if(confirm('Выйти из смены? Прогресс будет потерян.'))showMenu();};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&S&&!S.over&&$('ov').hidden&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();paused=!paused;updCtl();}});

/* ---------- debrief ---------- */
function finish(){
  stop();const s=S;const sc=score(s);if(s.over==='win')saveBest(SC.id,sc);
  const titles={win:'Инцидент закрыт',budget:'Error budget исчерпан',time:'Смена провалена'};
  const subs={win:`Причина устранена, система стабильна. Длительность инцидента — ${s.t} мин.`,
    budget:'Пользователи ушли к конкурентам, утром будет неприятный постмортем.',
    time:'Прошло 40 минут, проснулся CTO и забрал инцидент себе.'};
  const vName={good:'помогло',bad:'навредило',neutral:'не повлияло'};const vCls={good:'ok',bad:'crit',neutral:'muted'};
  $('ovCard').innerHTML=`
    <p class="muted">${esc(SC.title)} · ${fmt(s.t)}</p>
    <p class="result ${s.over==='win'?'ok':'crit'}">${titles[s.over]}</p>
    <p>${subs[s.over]}</p>
    <div class="stats"><span><b>${sc}</b>очков</span><span><b>${Math.round(s.budget)}%</b>бюджета осталось</span><span><b>${s.taken.length}</b>действий</span><span><b>${s.hints}</b>звонков тимлиду</span></div>
    ${s.dataLoss?'<p class="crit">Потеряны данные при failover: реплика отставала.</p>':''}
    <h2>Что случилось на самом деле</h2><p>${esc(SC.cause)}</p>
    <h2>Оптимальный путь</h2><p>${esc(SC.ideal)}</p>
    <h2>Твои действия</h2>
    ${s.taken.length?`<ul class="timeline">${s.taken.map(x=>`<li><span class="mono muted">${fmt(x.t)}</span><span><span class="verdict ${vCls[x.verdict[0]]}">${vName[x.verdict[0]]}</span><b>${esc(x.label)}</b><br><span class="muted">${esc(x.verdict[1])}</span></span></li>`).join('')}</ul>`:'<p class="muted">Ты ничего не сделал. Иногда подождать — правильно, но не в этот раз.</p>'}
    <h2>Что вынести</h2><ul class="lessons">${SC.lessons.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
    <div class="row"><button class="btn primary" id="bRetry">Ещё раз</button><button class="btn" id="bList">Другие смены</button></div>`;
  $('ov').hidden=false;$('ov').scrollTop=0;
  $('bRetry').onclick=()=>brief(SC.id,false);$('bList').onclick=showMenu;
}

try{const th=localStorage.getItem('oncall-theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
showMenu();
</script>
</body>
</html>
