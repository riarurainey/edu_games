{
  id: 'q-uf', ch: 6, type: 'quiz', title: 'Неинтерпретируемые функции',
  story: 'Иногда функция слишком сложна, чтобы описывать её полностью (хеш, шифрование, вызов внешнего сервиса). Z3 умеет рассуждать о функциях, ничего не зная об их устройстве.',
  theory: `
<pre><code>f = Function('f', IntSort(), IntSort())    # f: Int → Int
x, y = Ints('x y')
prove(Implies(x == y, f(x) == f(y)))        # proved</code></pre>
<p><b>Неинтерпретируемая функция</b> — это любая функция с нужной сигнатурой. Z3 знает о ней только одно свойство — <b>конгруэнтность</b>: равные аргументы дают равные результаты. Это теория <b>EUF</b> (Equality with Uninterpreted Functions).</p>
<p>Зачем это нужно:</p>
<ul><li>Абстракция: заменить сложную функцию (sha256, вызов БД) символом и доказать, что код корректен при <i>любой</i> её реализации.</li>
<li>Проверка компиляторов: оптимизация не должна зависеть от того, что делает вызываемая функция.</li></ul>
<p>Если ответ sat, модель покажет одну из подходящих интерпретаций: <code>f = [1 -&gt; 2, else -&gt; 3]</code>.</p>
<p>Сорта: <code>IntSort()</code>, <code>BoolSort()</code>, <code>BitVecSort(32)</code>. Функция от нескольких аргументов: <code>Function('g', IntSort(), IntSort(), BoolSort())</code>.</p>`,
  questions: [
    { q: 'Что Z3 знает о неинтерпретируемой функции f?', options: ['Ничего', 'Только что из x == y следует f(x) == f(y)', 'Что f монотонна', 'Что f(0) == 0'], correct: 1, explain: 'Конгруэнтность — единственное встроенное свойство.' },
    { q: 'Можно ли доказать f(1) == 1 для неинтерпретируемой f без доп. условий?', options: ['Да', 'Нет — найдётся f, для которой это ложно'], correct: 1, explain: 'Контрпример: f, которая всюду возвращает 0.' },
    { q: 'Зачем заменять настоящую функцию неинтерпретируемой?', options: ['Чтобы код работал быстрее', 'Чтобы доказать свойство, которое верно при любой реализации функции, — и не утонуть в её деталях', 'Так требует синтаксис Z3'], correct: 1, explain: 'Это абстракция: меньше деталей — проще доказательство.' }
  ]
},
{
  id: 'uf-prove', ch: 6, type: 'code', title: 'Свойство функции',
  story: 'Математическая олимпиада: «Известно, что f(f(f(x))) = x и f(f(f(f(f(x))))) = x. Докажите, что f(x) = x». Решите её, не придумывая ни одного шага доказательства.',
  theory: `<p>Посылки объединяются через <code>And</code>, вывод — через <code>Implies</code>. Конгруэнтность Z3 применит сам столько раз, сколько нужно.</p>`,
  task: 'Используйте <code>f = Function(\'f\', IntSort(), IntSort())</code> и <code>x = Int(\'x\')</code>.',
  starter: "from z3 import *\n\nf = Function('f', IntSort(), IntSort())\nx = Int('x')\n",
  solution: "from z3 import *\n\nf = Function('f', IntSort(), IntSort())\nx = Int('x')\nprove(Implies(And(f(f(f(x))) == x, f(f(f(f(f(x))))) == x), f(x) == x))\n",
  hint: 'prove(Implies(And(f(f(f(x))) == x, f(f(f(f(f(x))))) == x), f(x) == x))',
  check: function (h) { return h.proved("f = Function('f', IntSort(), IntSort())\nx = Int('x')\nE = [Implies(And(f(f(f(x))) == x, f(f(f(f(f(x))))) == x), f(x) == x)]"); },
  success: 'proved. Человеческое доказательство: f⁵(x) = f²(f³(x)) = f²(x) = x, тогда f(x) = f(f³(x))… Z3 провёл эти рассуждения сам.'
},
{
  id: 'clamp', ch: 6, type: 'code', title: 'Безопасный рефакторинг?',
  story: 'Две версии метода <code>clamp</code>:<pre><code>// старая\nreturn Math.max(lo, Math.min(x, hi));\n// новая\nreturn x &lt; lo ? lo : (x &gt; hi ? hi : x);</code></pre>Автор рефакторинга уверен, что они эквивалентны. Ревьюер сомневается.',
  theory: `
<p>Типичный сценарий: сначала проверяем эквивалентность «как есть» и получаем контрпример, затем добавляем предусловие и доказываем.</p>
<p><code>Math.min(a, b)</code> на языке Z3 — <code>If(a &lt; b, a, b)</code>.</p>`,
  task: 'Используйте <code>x, lo, hi = BitVecs(\'x lo hi\', 32)</code>. 1) Получите контрпример к <code>old == new</code>. 2) Докажите эквивалентность при условии <code>lo &lt;= hi</code>.',
  starter: "from z3 import *\n\nx, lo, hi = BitVecs('x lo hi', 32)\ndef jmin(a, b): return If(a < b, a, b)\ndef jmax(a, b): return If(a > b, a, b)\nold = jmax(lo, jmin(x, hi))\nnew = If(x < lo, lo, If(x > hi, hi, x))\n\n",
  solution: "from z3 import *\n\nx, lo, hi = BitVecs('x lo hi', 32)\ndef jmin(a, b): return If(a < b, a, b)\ndef jmax(a, b): return If(a > b, a, b)\nold = jmax(lo, jmin(x, hi))\nnew = If(x < lo, lo, If(x > hi, hi, x))\nprove(old == new)\nprove(Implies(lo <= hi, old == new))\n",
  hint: 'prove(old == new) даст контрпример с lo > hi. Затем prove(Implies(lo <= hi, old == new)).',
  check: function (h) {
    var ref = "x, lo, hi = BitVecs('x lo hi', 32)\nold = If(lo > If(x < hi, x, hi), lo, If(x < hi, x, hi))\nnew = If(x < lo, lo, If(x > hi, hi, x))\n";
    var r1 = h.proved(ref + 'E = [old == new]', 'sat'); if (r1) return h.fail('Шаг 1: ' + r1.msg);
    var r2 = h.proved(ref + 'E = [Implies(lo <= hi, old == new)]'); if (r2) return h.fail('Шаг 2: ' + r2.msg);
    return null;
  },
  success: 'Версии различаются только при lo > hi. Хороший повод добавить в метод проверку аргументов — или задокументировать предусловие.'
},
{
  id: 'symexec', ch: 6, type: 'code', title: 'Дойти до краша', star: true,
  story: 'Фаззер неделю бомбил метод случайными числами и так и не дошёл до строки <code>crash()</code>. Найдите вход, который до неё доводит:<pre><code>void process(int a, int b) {\n    int c = a * 3;\n    if (c &gt; b) {\n        int d = b - a;\n        if (d == 10 &amp;&amp; a % 7 == 3) {\n            crash();\n        }\n    }\n}</code></pre>',
  theory: `
<p>Символьное выполнение: условие пути (path condition) — это конъюнкция всех условий <code>if</code>, через которые надо пройти. Решите её — получите вход.</p>
<p>Помните: Java <code>%</code> — это <code>SRem</code>, а не <code>%</code> из Z3Py. Арифметика — 32-битная (BitVec), с переполнением.</p>
<p>Так работают инструменты генерации тестов: Microsoft SAGE нашёл этим способом сотни уязвимостей в Windows.</p>`,
  task: 'Используйте <code>a, b = BitVecs(\'a b\', 32)</code>. Найдите вход и напечатайте его как знаковые числа.',
  starter: "from z3 import *\n\na, b = BitVecs('a b', 32)\nc = a * 3\nd = b - a\ns = Solver()\n# условия пути\n\nprint(s.check())\nm = s.model()\nprint(m[a].as_signed_long(), m[b].as_signed_long())\n",
  solution: "from z3 import *\n\na, b = BitVecs('a b', 32)\nc = a * 3\nd = b - a\ns = Solver()\ns.add(c > b, d == 10, SRem(a, 7) == 3)\nprint(s.check())\nm = s.model()\nprint(m[a].as_signed_long(), m[b].as_signed_long())\n",
  hint: 's.add(c > b, d == 10, SRem(a, 7) == 3)',
  check: function (h) {
    var b = h.base(); if (b) return b;
    var A = h.val('a'), B = h.val('b');
    if (A === undefined || B === undefined) return h.fail('В модели нет переменных a и b (BitVec 32).');
    if (!bugPath(s32(A), s32(B))) return h.fail('С этими значениями Java-код до crash() не дойдёт. Проверьте условия — особенно остаток: Java % — это SRem.');
    return null;
  },
  success: 'Путь найден. Случайный фаззер попал бы на условие d == 10 с вероятностью 1 к 4 миллиардам.'
},

/* ======================= ГЛАВА 7 ======================= */
{
  id: 'q-smt', ch: 7, type: 'quiz', title: 'Язык SMT-LIB',
  story: 'Отдел интеграции получает задачи от других систем в стандартном формате. Все SMT-решатели (Z3, cvc5, Yices…) понимают общий язык — <b>SMT-LIB 2</b>.',
  theory: `
<p>SMT-LIB — это «ассемблер» мира решателей: префиксная запись в скобках, как в Lisp.</p>
<pre><code>(set-logic QF_LIA)                 ; логика: линейная целочисленная арифметика
(declare-const x Int)              ; объявить константу (переменную)
(declare-const y Int)
(assert (= (+ x y) 10))            ; x + y == 10
(assert (&gt; x (* 2 y)))             ; x &gt; 2*y
(check-sat)                        ; sat
(get-model)                        ; значения
(get-value (x (+ x 1)))            ; значения выражений</code></pre>
<table class="cmp"><tr><th>Z3Py</th><th>SMT-LIB</th></tr>
<tr><td><code>x + y == 10</code></td><td><code>(= (+ x y) 10)</code></td></tr>
<tr><td><code>And(a, b)</code>, <code>Implies(a, b)</code></td><td><code>(and a b)</code>, <code>(=&gt; a b)</code></td></tr>
<tr><td><code>x != y</code></td><td><code>(distinct x y)</code> или <code>(not (= x y))</code></td></tr>
<tr><td><code>If(c, a, b)</code></td><td><code>(ite c a b)</code></td></tr>
<tr><td><code>x / y</code>, <code>x % y</code></td><td><code>(div x y)</code>, <code>(mod x y)</code></td></tr>
<tr><td><code>-5</code></td><td><code>(- 5)</code></td></tr>
<tr><td><code>BitVec('a', 8)</code></td><td><code>(declare-const a (_ BitVec 8))</code></td></tr>
<tr><td><code>BitVecVal(255, 8)</code></td><td><code>#xff</code> или <code>(_ bv255 8)</code></td></tr>
<tr><td><code>a + b</code> (BitVec)</td><td><code>(bvadd a b)</code></td></tr></table>
<p>Ещё команды: <code>(push)</code> / <code>(pop)</code> — сохранить и откатить набор утверждений, <code>(define-fun f ((x Int)) Int (* x x))</code> — макрос, <code>(minimize t)</code> / <code>(maximize t)</code> — оптимизация (расширение Z3). Комментарии начинаются с <code>;</code>.</p>
<p>Логики называются по шаблону: <code>QF_</code> — без кванторов, <code>LIA</code> — линейная целочисленная арифметика, <code>NIA</code> — нелинейная, <code>BV</code> — битовые векторы, <code>UF</code> — неинтерпретируемые функции. Z3 может определить логику сам, поэтому <code>set-logic</code> необязателен.</p>`,
  questions: [
    { q: 'Как записать x * 2 + 1 > y в SMT-LIB?', options: ['(> (+ (* x 2) 1) y)', '(x * 2 + 1 > y)', '(> x * 2 + 1 y)', '(assert x*2+1>y)'], correct: 0, explain: 'Префиксная запись: операция — первая в скобках.' },
    { q: 'Как записать отрицательное число −3?', options: ['-3', '(- 3)', '#-3', 'neg 3'], correct: 1, explain: 'В стандарте SMT-LIB числовые литералы неотрицательны; минус — это операция.' },
    { q: 'Что означает логика QF_BV?', options: ['Битовые векторы без кванторов', 'Булевы переменные', 'Функции с кванторами'], correct: 0, explain: 'QF = quantifier-free, BV = bit-vectors.' },
    { q: 'Что делают (push) и (pop)?', options: ['Добавляют и удаляют переменные из модели', 'Сохраняют текущий набор утверждений и откатывают к нему', 'Ускоряют решатель'], correct: 1, explain: 'Удобно проверять гипотезы, не пересоздавая всю задачу.' }
  ]
},
{
  id: 'sexpr', ch: 7, type: 'code', title: 'Взгляд изнутри',
  story: 'Прежде чем писать на SMT-LIB вручную, посмотрим, во что Z3Py превращает ваши ограничения.',
  theory: `<p><code>s.sexpr()</code> возвращает содержимое решателя на языке SMT-LIB. Так Python-код можно передать другому решателю или отладить.</p>`,
  task: 'Создайте решатель с несколькими ограничениями (любыми, хотя бы с двумя переменными) и напечатайте <code>s.sexpr()</code>.',
  starter: "from z3 import *\n\nx, y = Ints('x y')\ns = Solver()\ns.add(x + y == 10, x > 2*y, Or(x == 7, y < 0))\n",
  solution: "from z3 import *\n\nx, y = Ints('x y')\ns = Solver()\ns.add(x + y == 10, x > 2*y, Or(x == 7, y < 0))\nprint(s.sexpr())\nprint(s.check())\n",
  hint: 'print(s.sexpr())',
  check: function (h) {
    if (h.error) return h.fail('Программа завершилась с ошибкой.');
    if (!/\(declare-fun /.test(h.text) || !/\(assert /.test(h.text)) return h.fail('В выводе нет SMT-LIB: напечатайте s.sexpr().');
    return null;
  },
  success: 'Видите declare-fun и assert? Дальше будем писать их сами.'
},
{
  id: 'smt-first', ch: 7, type: 'smt', title: 'Первый скрипт SMT-LIB',
  story: 'В кассе 30 монет по 2 и 5 рублей, всего на 99 рублей. Сколько каких монет?',
  theory: `<p>Консоль этого уровня понимает SMT-LIB. Каждая команда — в скобках. Результаты печатаются по мере выполнения.</p>`,
  task: 'Объявите <code>x</code> (двушки) и <code>y</code> (пятёрки) типа Int, запишите условия, выполните <code>(check-sat)</code> и <code>(get-model)</code>.',
  starter: "; x — монеты по 2 рубля, y — по 5 рублей\n(declare-const x Int)\n(declare-const y Int)\n\n(check-sat)\n(get-model)\n",
  solution: "(declare-const x Int)\n(declare-const y Int)\n(assert (= (+ x y) 30))\n(assert (= (+ (* 2 x) (* 5 y)) 99))\n(assert (>= x 0))\n(assert (>= y 0))\n(check-sat)\n(get-model)\n",
  hint: '(assert (= (+ x y) 30)) и (assert (= (+ (* 2 x) (* 5 y)) 99))',
  check: function (h) { return h.modelOk("x, y = Ints('x y')\nE = [x + y == 30, 2*x + 5*y == 99]"); },
  success: '17 двушек и 13 пятёрок.'
},
{
  id: 'smt-bv', ch: 7, type: 'smt', title: 'Битовые векторы в SMT-LIB',
  story: 'Прошивка «шифрует» байт так: <code>(a * 3) ^ 0x5A</code>. Зашифрованное значение — <code>0x7B</code>. Найдите исходный байт.',
  theory: `
<pre><code>(declare-const a (_ BitVec 8))
(assert (= (bvadd a #x01) #x00))   ; a + 1 == 0 по модулю 256
(check-sat)
(get-value (a))                    ; ((a #xff))</code></pre>
<p>Операции: <code>bvadd bvsub bvmul bvudiv bvurem bvand bvor bvxor bvnot bvshl bvlshr bvashr</code>, сравнения <code>bvult bvule bvslt bvsle …</code>. Литералы: <code>#x5a</code> (шестнадцатеричный, ширина 4·цифры), <code>#b0101</code> (двоичный).</p>`,
  task: 'Найдите 8-битный <code>a</code>, для которого <code>(bvxor (bvmul a #x03) #x5a)</code> равно <code>#x7b</code>.',
  starter: "(declare-const a (_ BitVec 8))\n\n(check-sat)\n(get-value (a))\n",
  solution: "(declare-const a (_ BitVec 8))\n(assert (= (bvxor (bvmul a #x03) #x5a) #x7b))\n(check-sat)\n(get-value (a))\n",
  hint: '(assert (= (bvxor (bvmul a #x03) #x5a) #x7b))',
  check: function (h) { return h.modelOk("a = BitVec('a', 8)\nE = [(a * 3) ^ 0x5A == 0x7B]"); },
  success: 'a = #x0b = 11. Умножение на нечётное число по модулю 256 обратимо — поэтому ответ единственный.'
},
{
  id: 'smt-opt', ch: 7, type: 'smt', title: 'Оптимизация в SMT-LIB',
  story: 'Мастерская делает столы (прибыль 5) и стулья (прибыль 4). Столу нужно 6 часов работы и 1 кг краски, стулу — 4 часа и 2 кг. Есть 24 часа и 6 кг краски. Сколько чего делать ради максимальной прибыли?',
  theory: `
<p>Z3 расширяет SMT-LIB командами оптимизации:</p>
<pre><code>(maximize (+ (* 3 x) y))
(check-sat)
(get-objectives)       ; значения целей
(get-model)</code></pre>`,
  task: 'Объявите <code>x</code> (столы) и <code>y</code> (стулья), запишите ограничения и максимизируйте прибыль.',
  starter: "(declare-const x Int)\n(declare-const y Int)\n\n(check-sat)\n(get-objectives)\n(get-model)\n",
  solution: "(declare-const x Int)\n(declare-const y Int)\n(assert (>= x 0))\n(assert (>= y 0))\n(assert (<= (+ (* 6 x) (* 4 y)) 24))\n(assert (<= (+ x (* 2 y)) 6))\n(maximize (+ (* 5 x) (* 4 y)))\n(check-sat)\n(get-objectives)\n(get-model)\n",
  hint: 'Ограничения: x ≥ 0, y ≥ 0, 6x + 4y ≤ 24, x + 2y ≤ 6. Цель: (maximize (+ (* 5 x) (* 4 y))).',
  check: function (h) {
    if (!h.usedOptimize()) return h.fail('Нужна команда (maximize …).');
    return h.modelOk("x, y = Ints('x y')\nE = [x >= 0, y >= 0, 6*x + 4*y <= 24, x + 2*y <= 6]") || h.modelOk("x, y = Ints('x y')\nE = [5*x + 4*y == 20]", 'План допустимый, но прибыль не максимальна.');
  },
  success: 'Максимум 20: четыре стола и ни одного стула. Без целочисленности ответ был бы дробным (3 стола и 1,5 стула, прибыль 21).'
},
{
  id: 'smt-push', ch: 7, type: 'smt', title: 'push и pop',
  story: 'Аналитик проверяет две гипотезы о системе <code>x + y = 10</code>, <code>x − y = 2</code>: «может ли x быть равным 5?» и «может ли x быть равным 6?». Пересоздавать задачу для каждой гипотезы не хочется.',
  theory: `
<pre><code>(assert ...)          ; общая часть
(push)                ; запомнить состояние
(assert (= x 5))      ; гипотеза
(check-sat)
(pop)                 ; откатить гипотезу
(push)
(assert (= x 6))
(check-sat)
(pop)</code></pre>
<p>В Z3Py то же самое: <code>s.push()</code> и <code>s.pop()</code>. Решатель при этом может сохранять выученное, поэтому серия проверок работает быстрее, чем с нуля.</p>`,
  task: 'Запишите общую часть, затем проверьте обе гипотезы через push/pop. Должно получиться unsat, затем sat.',
  starter: "(declare-const x Int)\n(declare-const y Int)\n(assert (= (+ x y) 10))\n(assert (= (- x y) 2))\n\n",
  solution: "(declare-const x Int)\n(declare-const y Int)\n(assert (= (+ x y) 10))\n(assert (= (- x y) 2))\n(push)\n(assert (= x 5))\n(check-sat)\n(pop)\n(push)\n(assert (= x 6))\n(check-sat)\n(get-model)\n(pop)\n",
  hint: '(push) (assert (= x 5)) (check-sat) (pop), затем то же для 6.',
  check: function (h) {
    if (!/\(push/.test(h.src) || !/\(pop/.test(h.src)) return h.fail('Используйте (push) и (pop).');
    var rs = h.checks.map(function (c) { return c.result; });
    var iu = rs.indexOf('unsat'), is = rs.lastIndexOf('sat');
    if (iu < 0 || is < 0 || is < iu) return h.fail('Ожидалась сначала проверка с unsat (x = 5), затем с sat (x = 6).');
    var last = h.checks[is];
    var hasX6 = last.asserts.some(function (a) { return /x 6\)|6 x\)/.test(Z3C.toSmt(a)); });
    var hasX5 = last.asserts.some(function (a) { return /x 5\)|5 x\)/.test(Z3C.toSmt(a)); });
    if (!hasX6 || hasX5) return h.fail('Во второй проверке должна быть только гипотеза x = 6 — первая должна быть отменена через (pop).');
    return null;
  },
  success: 'x = 6, y = 4. Гипотеза x = 5 опровергнута, и pop аккуратно её убрал.'
},

/* ======================= ГЛАВА 8 ======================= */
{
  id: 'q-java', ch: 8, type: 'quiz', title: 'Z3 из Java',
  story: 'Финальная глава. Бюро встраивает оракула прямо в Java-сервисы.',
  theory: `
<p>У Z3 есть официальный Java API (пакет <code>com.microsoft.z3</code>). Jar и нативная библиотека (<code>libz3java</code>) входят в релизы Z3 на GitHub. Есть сторонние сборки в Maven, например <code>tools.aqua:z3-turnkey</code>, где нативные библиотеки уже упакованы.</p>
<pre><code>import com.microsoft.z3.*;

try (Context ctx = new Context()) {               // Context — AutoCloseable
    IntExpr x = ctx.mkIntConst("x");
    IntExpr y = ctx.mkIntConst("y");
    Solver s = ctx.mkSolver();
    s.add(ctx.mkEq(ctx.mkAdd(x, y), ctx.mkInt(10)));   // x + y == 10
    s.add(ctx.mkGt(x, y));                             // x &gt; y
    if (s.check() == Status.SATISFIABLE) {
        Model m = s.getModel();
        System.out.println(m.eval(x, false));          // значение x
    }
}</code></pre>
<p>Соответствие с Python: <code>Int("x")</code> → <code>ctx.mkIntConst("x")</code>, <code>BitVec("a", 32)</code> → <code>ctx.mkBVConst("a", 32)</code>, <code>And</code> → <code>ctx.mkAnd</code>, <code>If</code> → <code>ctx.mkITE</code>, <code>Optimize()</code> → <code>ctx.mkOptimize()</code>, <code>sat/unsat/unknown</code> → <code>Status.SATISFIABLE / UNSATISFIABLE / UNKNOWN</code>.</p>
<p>Где Z3 работает в реальном мире:</p>
<ul><li><b>Верификация</b>: Dafny, Boogie, F*, Liquid Haskell доказывают корректность программ с помощью Z3.</li>
<li><b>Безопасность</b>: angr (символьное выполнение бинарников), Microsoft SAGE (генерация тестов), проверка политик доступа в облаках.</li>
<li><b>Компиляторы</b>: Alive2 проверяет оптимизации LLVM.</li>
<li><b>Планирование и конфигурации</b>: расписания, проверка сетевых правил, конфликтов зависимостей.</li></ul>`,
  questions: [
    { q: 'Какой объект в Java API создаёт все выражения и решатели?', options: ['Solver', 'Context', 'Model', 'Z3Factory'], correct: 1, explain: 'Всё создаётся через ctx.mk…, а Context нужно закрывать (try-with-resources).' },
    { q: 'Как в Java проверить, что решение найдено?', options: ['s.check() == true', 's.check() == Status.SATISFIABLE', 's.isSat()', 's.check().equals("sat")'], correct: 1, explain: 'check() возвращает enum Status.' },
    { q: 'Как записать в Java API If(c, a, b)?', options: ['ctx.mkIf(c, a, b)', 'ctx.mkITE(c, a, b)', 'c ? a : b', 'ctx.mkCond(c, a, b)'], correct: 1, explain: 'ITE = if-then-else, как ite в SMT-LIB.' },
    { q: 'Какая задача НЕ подходит для Z3?', options: ['Найти вход, ведущий к ошибке в коде', 'Составить расписание с ограничениями', 'Отсортировать миллион чисел', 'Доказать эквивалентность двух формул'], correct: 2, explain: 'Для задач с известным быстрым алгоритмом решатель не нужен — он для поиска и доказательств.' }
  ]
},
{
  id: 'boss-lock', ch: 8, type: 'code', title: 'Босс: кодовый замок', star: true,
  story: 'Вирусная головоломка. Код замка — три <b>разные</b> цифры. Подсказки:<br>682 — одна цифра верна и стоит на своём месте;<br>614 — одна цифра верна, но не на своём месте;<br>206 — две цифры верны, но не на своих местах;<br>738 — ни одна цифра не верна;<br>780 — одна цифра верна, но не на своём месте.',
  theory: `
<p>Напишите вспомогательные функции Python, которые строят выражения Z3:</p>
<pre><code>code = [a, b, c]

def well_placed(guess):            # сколько цифр на своём месте
    return Sum([If(code[i] == int(guess[i]), 1, 0) for i in range(3)])

def present(guess):                # сколько цифр догадки есть в коде
    return Sum([If(Or([x == int(g) for x in code]), 1, 0) for g in guess])</code></pre>
<p>«Верна, но не на месте» = <code>present - well_placed</code>.</p>`,
  task: 'Используйте <code>a, b, c = Ints(\'a b c\')</code> и найдите код.',
  starter: "from z3 import *\n\na, b, c = Ints('a b c')\ncode = [a, b, c]\ns = Solver()\ns.add([And(0 <= x, x <= 9) for x in code], Distinct(code))\n\n",
  solution: "from z3 import *\n\na, b, c = Ints('a b c')\ncode = [a, b, c]\ns = Solver()\ns.add([And(0 <= x, x <= 9) for x in code], Distinct(code))\ndef well(g): return Sum([If(code[i] == int(g[i]), 1, 0) for i in range(3)])\ndef present(g): return Sum([If(Or([x == int(d) for x in code]), 1, 0) for d in g])\ndef hint(g, w, r):\n    s.add(well(g) == w, present(g) - well(g) == r)\nhint('682', 1, 0)\nhint('614', 0, 1)\nhint('206', 0, 2)\nhint('738', 0, 0)\nhint('780', 0, 1)\nprint(s.check())\nm = s.model()\nprint(m[a], m[b], m[c])\n",
  hint: 'Для каждой подсказки (g, «на месте», «не на месте») добавьте: well(g) == на_месте и present(g) - well(g) == не_на_месте.',
  check: function (h) { return h.modelOk("a, b, c = Ints('a b c')\nE = [a == 0, b == 4, c == 2]", 'Код не подходит под все подсказки. Проверьте функции подсчёта и каждую из пяти подсказок.'); },
  success: 'Код 042. Пять подсказок превратились в десять ограничений, и решатель нашёл единственный вариант.'
},
{
  id: 'boss-duty', ch: 8, type: 'code', title: 'Босс: график дежурств', star: true,
  story: 'Последний заказ — график дежурств на неделю (5 дней, пн–пт) для 4 инженеров:<br>• каждый день дежурят ровно двое;<br>• каждый инженер дежурит 2 или 3 дня;<br>• никто не дежурит два дня подряд;<br>• Аня (0) не может в понедельник;<br>• Боря (1) и Вика (2) никогда не дежурят вместе.',
  theory: `
<p>Матрица Bool-переменных «человек p дежурит в день d»: <code>d_p_d</code>. Количества — через <code>Sum(If(…))</code> или <code>AtMost</code>/<code>AtLeast</code>. «Не подряд»: <code>Not(And(D[p][d], D[p][d+1]))</code>.</p>`,
  task: 'Используйте переменные <code>d_0_0 … d_3_4</code> (как в заготовке) и найдите любой подходящий график.',
  starter: "from z3 import *\n\nnames = [\"Аня\", \"Боря\", \"Вика\", \"Гоша\"]\ndays = [\"пн\", \"вт\", \"ср\", \"чт\", \"пт\"]\nD = [[Bool(f\"d_{p}_{d}\") for d in range(5)] for p in range(4)]\ns = Solver()\n\nif s.check() == sat:\n    m = s.model()\n    for d in range(5):\n        print(days[d], [names[p] for p in range(4) if is_true(m[D[p][d]])])\nelse:\n    print(\"невозможно\")\n",
  solution: "from z3 import *\n\nnames = [\"Аня\", \"Боря\", \"Вика\", \"Гоша\"]\ndays = [\"пн\", \"вт\", \"ср\", \"чт\", \"пт\"]\nD = [[Bool(f\"d_{p}_{d}\") for d in range(5)] for p in range(4)]\ns = Solver()\ndef cnt(xs): return Sum([If(x, 1, 0) for x in xs])\ns.add([cnt([D[p][d] for p in range(4)]) == 2 for d in range(5)])\ns.add([And(cnt(D[p]) >= 2, cnt(D[p]) <= 3) for p in range(4)])\ns.add([Not(And(D[p][d], D[p][d + 1])) for p in range(4) for d in range(4)])\ns.add(Not(D[0][0]))\ns.add([Not(And(D[1][d], D[2][d])) for d in range(5)])\nif s.check() == sat:\n    m = s.model()\n    for d in range(5):\n        print(days[d], [names[p] for p in range(4) if is_true(m[D[p][d]])])\nelse:\n    print(\"невозможно\")\n",
  hint: 'Вспомогательная функция cnt(xs) = Sum([If(x, 1, 0) for x in xs]). Дни: cnt([D[p][d] for p in range(4)]) == 2. Люди: 2 ≤ cnt(D[p]) ≤ 3. Подряд: Not(And(D[p][d], D[p][d+1])).',
  check: function (h) { return h.modelOk("D = [[Bool(f'd_{p}_{d}') for d in range(5)] for p in range(4)]\ndef cnt(xs): return Sum([If(x, 1, 0) for x in xs])\nE = [cnt([D[p][d] for p in range(4)]) == 2 for d in range(5)] + [And(cnt(D[p]) >= 2, cnt(D[p]) <= 3) for p in range(4)] + [Not(And(D[p][d], D[p][d + 1])) for p in range(4) for d in range(4)] + [Not(D[0][0])] + [Not(And(D[1][d], D[2][d])) for d in range(5)]"); },
  success: 'График готов. Расписания, назначения и конфигурации — самый частый «бытовой» сценарий для Z3. Вы прошли игру!'
}
];
})();
if (typeof module !== 'undefined') module.exports = { LEVELS: LEVELS, CHAPTERS: CHAPTERS };

</script>
<script>
/* ===== Интерфейс игры ===== */
(function () {
'use strict';
var STORE = 'z3-bureau-v1';
var progress = load();
var cur = Math.min(progress.current || 0, LEVELS.length - 1);
var sandbox = null; // null | 'py' | 'smt'
var running = false, worker = null, workerOk = null, pending = null, runTimer = null;

function load() { try { var p = JSON.parse(localStorage.getItem(STORE)); if (p && p.done) return p; } catch (e) {} return { done: {}, code: {}, current: 0 }; }
function save() { try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {} }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return [].slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ---------- фоновый поток ---------- */
var GLUE = '\nself.onmessage=function(e){var r;try{r=RUNNER.exec(e.data,LEVELS);}catch(x){r={out:[],error:"Внутренняя ошибка: "+(x&&x.message||x),verdict:null,ms:0};}self.postMessage(r);};';
function makeWorker() {
  try {
    var src = $('#engine-src').textContent + '\n' + $('#levels-src').textContent + GLUE;
    var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    var w = new Worker(url);
    w.onmessage = function (e) { workerOk = true; finish(e.data); };
    w.onerror = function (e) {
      e.preventDefault && e.preventDefault();
      if (!workerOk) { workerOk = false; worker = null; if (pending) { var req = pending; pending = null; runLocal(req); } }
    };
    return w;
  } catch (e) { workerOk = false; return null; }
}
function exec(req) {
  running = true; pending = req; setRunning(true);
  if (workerOk !== false) {
    if (!worker) worker = makeWorker();
    if (worker) { worker.postMessage(req); return; }
  }
  runLocal(req);
}
function runLocal(req) { setTimeout(function () { finish(RUNNER.exec(req, LEVELS)); }, 30); }
function stop() {
  if (!running) return;
  if (worker && workerOk !== false) { worker.terminate(); worker = null; }
  running = false; pending = null; setRunning(false);
  appendOut('<div class="o-info">■ Остановлено.</div>');
}
function setRunning(on) {
  var b = $('#run'), st = $('#stop');
  if (b) { b.disabled = on; b.innerHTML = on ? '<span class="spin"></span> Решаю…' : '▶ Выполнить'; }
  if (st) st.hidden = !on;
}

/* ---------- подсветка кода ---------- */
var PYKW = /\b(from|import|def|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|break|continue|pass|lambda|print|range|len|sum|zip|enumerate)\b/;
var Z3FN = /\b(Int|Ints|IntVal|IntVector|Bool|Bools|BoolVal|BitVec|BitVecs|BitVecVal|Solver|Optimize|solve|prove|simplify|And|Or|Not|Implies|Xor|If|Distinct|Sum|Product|Abs|AtMost|AtLeast|ULT|ULE|UGT|UGE|UDiv|URem|SRem|LShR|RotateLeft|RotateRight|Concat|Extract|ZeroExt|SignExt|BV2Int|Int2BV|Function|IntSort|BoolSort|BitVecSort|sat|unsat|unknown|is_true|is_false)\b/;
function hlPy(src) {
  var re = /(#[^\n]*)|([rRbBfF]{0,2}("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?))|(\b0[xXbB][0-9a-fA-F_]+\b|\b\d[\d_]*\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  var out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="h-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="h-s">' + esc(m[2]) + '</span>';
    else if (m[4]) out += '<span class="h-n">' + esc(m[4]) + '</span>';
    else if (m[5]) {
      var w = m[5];
      if (PYKW.test(w) && w.length === (w.match(PYKW) || [''])[0].length) out += '<span class="h-k">' + w + '</span>';
      else if (Z3FN.test(w) && w.length === (w.match(Z3FN) || [''])[0].length) out += '<span class="h-z">' + w + '</span>';
      else out += esc(w);
    }
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
var SMTCMD = /^(declare-const|declare-fun|define-fun|assert|check-sat|get-model|get-value|push|pop|set-logic|set-option|minimize|maximize|get-objectives|echo|reset|eval|exit|check-sat-assuming|get-assertions)$/;
function hlSmt(src) {
  var re = /(;[^\n]*)|("(?:[^"]|"")*"?)|(#x[0-9a-fA-F]+|#b[01]+|\b\d+\b)|([()])|([^\s()";]+)/g, out = '', last = 0, m, prevParen = false;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="h-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="h-s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="h-n">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="h-p">' + m[4] + '</span>';
    else if (m[5]) {
      var w = m[5];
      if (SMTCMD.test(w)) out += '<span class="h-k">' + esc(w) + '</span>';
      else if (/^(Int|Bool|BitVec|_)$/.test(w)) out += '<span class="h-z">' + esc(w) + '</span>';
      else if (prevParen) out += '<span class="h-o">' + esc(w) + '</span>';
      else out += esc(w);
    }
    prevParen = !!m[4] && m[4] === '(';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* ---------- боковая панель ---------- */
function doneCount() { return LEVELS.filter(function (l) { return progress.done[l.id]; }).length; }
function renderSidebar() {
  var h = '';
  CHAPTERS.forEach(function (ch) {
    var lv = LEVELS.map(function (l, i) { return { l: l, i: i }; }).filter(function (x) { return x.l.ch === ch.n; });
    var d = lv.filter(function (x) { return progress.done[x.l.id]; }).length;
    h += '<div class="chap"><div class="chap-t"><span><b>' + ch.n + '</b> ' + esc(ch.title) + '</span><span class="chap-c">' + d + '/' + lv.length + '</span></div>';
    lv.forEach(function (x) {
      var ic = x.l.type === 'quiz' ? '?' : x.l.type === 'smt' ? '()' : (x.l.star ? '★' : '›');
      h += '<button class="lv' + (x.i === cur && !sandbox ? ' active' : '') + (progress.done[x.l.id] ? ' done' : '') + '" data-i="' + x.i + '"><span class="lv-n">' + (x.i + 1) + '</span><span class="lv-t">' + esc(x.l.title) + '</span><span class="lv-s">' + (progress.done[x.l.id] ? '✓' : ic) + '</span></button>';
    });
    h += '</div>';
  });
  $('#levels').innerHTML = h;
  $$('.lv').forEach(function (b) { b.onclick = function () { go(+b.dataset.i); closeNav(); }; });
  var n = doneCount();
  $('#prog-text').textContent = n + ' / ' + LEVELS.length;
  $('#prog-bar').style.width = (100 * n / LEVELS.length) + '%';
  $('#sandbox-btn').classList.toggle('on', !!sandbox);
}
function chapterOf(lv) { for (var i = 0; i < CHAPTERS.length; i++) if (CHAPTERS[i].n === lv.ch) return CHAPTERS[i]; return { n: 0, title: '' }; }
function go(i) {
  if (running) stop();
  sandbox = null;
  cur = Math.max(0, Math.min(LEVELS.length - 1, i));
  progress.current = cur; save();
  renderSidebar(); renderLevel();
  window.scrollTo(0, 0);
}

/* ---------- уровень ---------- */
function renderLevel() {
  var lv = LEVELS[cur], ch = chapterOf(lv);
  var tl = lv.type === 'quiz' ? '<span class="tag t-quiz">теория</span>' : lv.type === 'smt' ? '<span class="tag t-smt">SMT-LIB</span>' : '<span class="tag t-code">практика</span>';
  if (lv.star) tl += '<span class="tag t-star">★ сложный</span>';
  var h = '<div class="crumb">Глава ' + ch.n + ' · ' + esc(ch.title) + tl + '</div>' +
    '<h1><span class="num">№' + (cur + 1) + '</span> ' + esc(lv.title) + (progress.done[lv.id] ? ' <span class="okmark">✓</span>' : '') + '</h1>' +
    '<div class="story"><div class="story-l">Заявка в Бюро</div>' + lv.story + '</div>';
  if (lv.theory) h += '<details class="theory"' + (lv.type === 'quiz' || !progress.done[lv.id] ? ' open' : '') + '><summary>Справка</summary><div class="theory-b">' + lv.theory + '</div></details>';
  if (lv.type === 'quiz') h += quizHTML(lv);
  else h += '<div class="task"><div class="task-l">Задание</div>' + lv.task + '</div>' + editorHTML(lv.type === 'smt' ? 'smt' : 'py', true);
  h += '<div id="feedback"></div>';
  h += '<div class="nav"><button class="btn ghost" id="prev"' + (cur === 0 ? ' disabled' : '') + '>← Назад</button><button class="btn ghost" id="next"' + (cur === LEVELS.length - 1 ? ' disabled' : '') + '>Далее →</button></div>';
  $('#content').innerHTML = h;
  $('#prev').onclick = function () { go(cur - 1); };
  $('#next').onclick = function () { go(cur + 1); };
  if (lv.type === 'quiz') bindQuiz(lv); else bindEditor(lv, lv.type === 'smt' ? 'smt' : 'py');
}

/* ---------- викторина ---------- */
function quizHTML(lv) {
  var h = '<div class="quiz">';
  lv.questions.forEach(function (q, qi) {
    h += '<div class="qcard" data-q="' + qi + '"><div class="qq"><span class="qn">' + (qi + 1) + '</span><span>' + esc(q.q) + (q.multi ? ' <span class="multi">несколько ответов</span>' : '') + '</span></div><div class="qopts">';
    q.options.forEach(function (o, oi) { h += '<button class="qopt" data-o="' + oi + '">' + esc(o) + '</button>'; });
    h += '</div>' + (q.multi ? '<button class="btn small qcheck">Проверить</button>' : '') + '<div class="qexp"></div></div>';
  });
  return h + '</div>';
}
function bindQuiz(lv) {
  var solved = {}, already = progress.done[lv.id];
  $$('.qcard').forEach(function (card) {
    var qi = +card.dataset.q, q = lv.questions[qi], corr = Array.isArray(q.correct) ? q.correct : [q.correct];
    function finish() {
      solved[qi] = true;
      $$('.qopt', card).forEach(function (b) { b.disabled = true; b.classList.remove('sel'); if (corr.indexOf(+b.dataset.o) >= 0) b.classList.add('right'); });
      var cb = $('.qcheck', card); if (cb) cb.remove();
      card.classList.add('solved');
      $('.qexp', card).innerHTML = '<b class="good">Верно.</b> ' + esc(q.explain);
      if (Object.keys(solved).length === lv.questions.length) complete(lv);
    }
    if (already) { finish(); return; }
    $$('.qopt', card).forEach(function (b) {
      b.onclick = function () {
        if (solved[qi]) return;
        if (q.multi) { b.classList.toggle('sel'); return; }
        if (+b.dataset.o === q.correct) finish();
        else { b.classList.add('wrong'); b.disabled = true; shake(card); $('.qexp', card).innerHTML = '<b class="bad">Не совсем.</b> Подумайте ещё.'; }
      };
    });
    var cb = $('.qcheck', card);
    if (cb) cb.onclick = function () {
      var sel = $$('.qopt.sel', card).map(function (b) { return +b.dataset.o; }).sort();
      if (sel.join() === corr.slice().sort().join()) finish(); else { shake(card); $('.qexp', card).innerHTML = '<b class="bad">Не совсем.</b> Проверьте выбор.'; }
    };
  });
}
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------- редактор ---------- */
function editorHTML(mode, withLevelBtns) {
  return '<div class="ed">' +
    '<div class="ed-top"><span class="ed-lang">' + (mode === 'smt' ? 'SMT-LIB 2' : 'Python · Z3Py') + '</span><span class="ed-keys">Ctrl+Enter — выполнить · Ctrl+/ — комментарий</span></div>' +
    '<div class="ed-area"><pre class="ed-hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div>' +
    '<div class="ed-btns"><button class="btn primary" id="run">▶ Выполнить</button><button class="btn" id="stop" hidden>■ Стоп</button>' +
    (withLevelBtns ? '<button class="btn" id="hint">Подсказка</button><button class="btn" id="sol">Решение</button>' : '') +
    '<span class="sp"></span><button class="btn ghost" id="reset">Вернуть заготовку</button><button class="btn ghost" id="clear">Очистить вывод</button></div>' +
    '<div id="hintbox" class="hintbox" hidden></div>' +
    '<div id="out" class="out"><div class="o-empty">Вывод программы появится здесь.</div></div></div>';
}
function codeKey(lv, mode) { return lv ? lv.id : '__sandbox_' + mode; }
var SANDBOX_PY = "from z3 import *\n\n# Песочница: пишите что угодно\nx, y = Ints('x y')\ns = Solver()\ns.add(x + y == 10, x > y, y > 0)\nwhile s.check() == sat:\n    m = s.model()\n    print(m)\n    s.add(Or(x != m[x], y != m[y]))\n";
var SANDBOX_SMT = "; Песочница SMT-LIB\n(declare-const x Int)\n(declare-const y Int)\n(assert (= (+ x y) 10))\n(assert (> x y))\n(check-sat)\n(get-model)\n";
function bindEditor(lv, mode) {
  var ta = $('#code'), hl = $('.ed-hl'), key = codeKey(lv, mode);
  var starter = lv ? lv.starter : (mode === 'smt' ? SANDBOX_SMT : SANDBOX_PY);
  ta.value = progress.code[key] !== undefined ? progress.code[key] : starter;
  function paint() { hl.innerHTML = (mode === 'smt' ? hlSmt(ta.value) : hlPy(ta.value)) + '\n'; grow(); }
  function grow() { ta.style.height = 'auto'; var hgt = Math.max(160, Math.min(560, ta.scrollHeight + 2)); ta.style.height = hgt + 'px'; hl.style.height = hgt + 'px'; }
  function store() { progress.code[key] = ta.value; save(); }
  ta.addEventListener('input', function () { paint(); store(); });
  ta.addEventListener('scroll', function () { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doRun(lv, mode); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === '/') { e.preventDefault(); toggleComment(ta, mode === 'smt' ? ';' : '#'); paint(); store(); return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      var s0 = ta.selectionStart, s1 = ta.selectionEnd, v = ta.value;
      if (s0 !== s1 || e.shiftKey) { indentLines(ta, e.shiftKey ? -1 : 1); }
      else insert(ta, '    ');
      paint(); store(); return;
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      var before = ta.value.slice(0, ta.selectionStart), line = before.split('\n').pop(), ind = (line.match(/^[ \t]*/) || [''])[0];
      if (mode === 'py' && /:\s*(#.*)?$/.test(line)) ind += '    ';
      if (mode === 'smt') { var bal = 0; for (var i = 0; i < line.length; i++) { if (line[i] === '(') bal++; else if (line[i] === ')') bal--; } if (bal > 0) ind += '  '; }
      e.preventDefault(); insert(ta, '\n' + ind); paint(); store(); return;
    }
    if (e.key === 'Backspace' && ta.selectionStart === ta.selectionEnd) {
      var b2 = ta.value.slice(0, ta.selectionStart), ln = b2.split('\n').pop();
      if (ln.length && /^ +$/.test(ln) && ln.length % 4 === 0) { e.preventDefault(); ta.setRangeText('', ta.selectionStart - 4, ta.selectionStart, 'end'); paint(); store(); }
    }
  });
  paint();
  $('#run').onclick = function () { doRun(lv, mode); };
  $('#stop').onclick = stop;
  $('#clear').onclick = function () { $('#out').innerHTML = '<div class="o-empty">Вывод очищен.</div>'; };
  $('#reset').onclick = function () { if (ta.value !== starter && !confirm('Вернуть исходную заготовку? Ваш код на этом уровне будет заменён.')) return; ta.value = starter; paint(); store(); };
  if (lv && $('#hint')) $('#hint').onclick = function () { var hb = $('#hintbox'); hb.hidden = !hb.hidden; hb.innerHTML = '<b>Подсказка.</b> ' + esc(lv.hint); };
  if (lv && $('#sol')) $('#sol').onclick = function () {
    if (!progress.done[lv.id] && !confirm('Показать готовое решение? Сначала стоит попробовать самому — так запомнится лучше.')) return;
    ta.value = lv.solution; paint(); store(); ta.focus();
  };
  if (lv && progress.done[lv.id]) showDone(lv, true);
  setTimeout(function () { if (window.innerWidth > 900) ta.focus(); }, 40);
}
function insert(ta, txt) { ta.setRangeText(txt, ta.selectionStart, ta.selectionEnd, 'end'); }
function lineRange(ta) { var v = ta.value, a = v.lastIndexOf('\n', ta.selectionStart - 1) + 1, b = v.indexOf('\n', ta.selectionEnd); if (b < 0) b = v.length; return [a, b]; }
function indentLines(ta, dir) {
  var r = lineRange(ta), seg = ta.value.slice(r[0], r[1]);
  var res = seg.split('\n').map(function (l) { return dir > 0 ? '    ' + l : l.replace(/^ {1,4}/, ''); }).join('\n');
  ta.setRangeText(res, r[0], r[1], 'select');
}
function toggleComment(ta, mark) {
  var r = lineRange(ta), seg = ta.value.slice(r[0], r[1]), lines = seg.split('\n');
  var all = lines.every(function (l) { return !l.trim() || l.trim().indexOf(mark) === 0; });
  var res = lines.map(function (l) { if (!l.trim()) return l; return all ? l.replace(new RegExp('^(\\s*)' + (mark === '#' ? '#' : ';') + ' ?'), '$1') : l.replace(/^(\s*)/, '$1' + mark + ' '); }).join('\n');
  ta.setRangeText(res, r[0], r[1], 'select');
}

/* ---------- запуск ---------- */
var runCtx = null;
function doRun(lv, mode) {
  if (running) return;
  var code = $('#code').value;
  runCtx = { lv: lv, mode: mode, t: Date.now() };
  appendOut('<div class="o-run"><span class="o-pr">' + (mode === 'smt' ? 'z3 -smt2' : 'python') + '</span> запуск…</div>', true);
  exec({ code: code, mode: mode, levelId: lv ? lv.id : null });
}
function colorLine(l) {
  var t = esc(l);
  if (/^(sat|proved)$/.test(l)) return '<span class="o-sat">' + t + '</span>';
  if (/^(unsat|no solution)$/.test(l)) return '<span class="o-unsat">' + t + '</span>';
  if (/^(unknown|failed to (solve|prove))$/.test(l)) return '<span class="o-unk">' + t + '</span>';
  if (/^counterexample$/.test(l)) return '<span class="o-cex">' + t + '</span>';
  if (/^\(error /.test(l)) return '<span class="o-err">' + t + '</span>';
  return t;
}
function finish(r) {
  running = false; pending = null; setRunning(false);
  var ctx = runCtx || {}, lines = r.out || [];
  var body = lines.length ? '<pre class="o-v">' + lines.slice(0, 2000).map(colorLine).join('\n') + '</pre>' : '';
  if (lines.length > 2000) body += '<div class="o-info">… вывод обрезан</div>';
  if (r.error) body += '<div class="o-error">' + esc(r.error) + '</div>';
  if (!lines.length && !r.error) body += '<div class="o-info">(программа ничего не напечатала — используйте print(...))</div>';
  body += '<div class="o-info">выполнено за ' + (r.ms < 1000 ? r.ms + ' мс' : (r.ms / 1000).toFixed(1) + ' с') + '</div>';
  replaceLastRun(body);
  if (!ctx.lv) return;
  var lv = ctx.lv, v = r.verdict;
  if (v && v.ok) complete(lv);
  else if (v && !progress.done[lv.id]) $('#feedback').innerHTML = '<div class="fb bad"><b>Пока не засчитано.</b> ' + esc(v.msg || '') + '</div>';
}
function appendOut(html, isRun) {
  var o = $('#out'); if (!o) return;
  var em = o.querySelector('.o-empty'); if (em) em.remove();
  var div = document.createElement('div'); div.className = 'o-block' + (isRun ? ' o-pending' : ''); div.innerHTML = html;
  o.appendChild(div);
  while (o.children.length > 25) o.removeChild(o.firstChild);
  o.scrollTop = o.scrollHeight;
}
function replaceLastRun(html) {
  var o = $('#out'); if (!o) return;
  var p = o.querySelector('.o-pending:last-of-type') || o.lastElementChild;
  if (p && p.classList.contains('o-pending')) { p.classList.remove('o-pending'); p.innerHTML = p.innerHTML.replace('запуск…', '') + html; }
  else appendOut(html);
  o.scrollTop = o.scrollHeight;
}

/* ---------- прохождение ---------- */
function complete(lv) {
  var first = !progress.done[lv.id];
  progress.done[lv.id] = true; save();
  renderSidebar();
  showDone(lv, false);
  if (first) { var h1 = $('h1'); if (h1 && !h1.querySelector('.okmark')) h1.insertAdjacentHTML('beforeend', ' <span class="okmark">✓</span>'); }
  if (first && doneCount() === LEVELS.length) setTimeout(showFinale, 700);
}
function showDone(lv, quiet) {
  var last = cur === LEVELS.length - 1;
  $('#feedback').innerHTML = '<div class="fb good' + (quiet ? '' : ' pop') + '"><div class="fb-t">' + (quiet ? 'Заявка закрыта' : (lv.type === 'quiz' ? 'Всё верно' : 'Задача решена')) + '</div>' +
    (lv.success ? '<div>' + esc(lv.success) + '</div>' : '') + (last ? '' : '<button class="btn primary" id="gonext">Следующая заявка →</button>') + '</div>';
  if ($('#gonext')) $('#gonext').onclick = function () { go(cur + 1); };
}
function showFinale() {
  var m = $('#modal');
  m.innerHTML = '<div class="modal-b"><div class="seal">sat</div><h2>Все заявки закрыты</h2><p>Вы прошли все ' + LEVELS.length + ' уровней: логику, арифметику, оптимизацию, битовые векторы, функции, SMT-LIB и Java API.</p><p>Дальше — настоящий Z3: <code>pip install z3-solver</code>. Почти весь код из игры заработает без изменений.</p><button class="btn primary" id="mclose">Закрыть</button></div>';
  m.hidden = false; $('#mclose').onclick = function () { m.hidden = true; };
}

/* ---------- песочница ---------- */
var CHEAT = `<div class="cheat"><div><h4>Переменные</h4><pre><code>x = Int('x');  a, b = Ints('a b')
p = Bool('p'); v = BitVec('v', 32)
xs = [Int(f"x{i}") for i in range(5)]
f = Function('f', IntSort(), IntSort())</code></pre>
<h4>Логика и арифметика</h4><pre><code>And(..) Or(..) Not(..) Implies(a, b) Xor(a, b)
If(c, a, b)  Distinct(..)  Sum(list)  Abs(x)
AtMost(b1, b2, b3, 2)  AtLeast(.., k)
+ - * / %   == != &lt; &lt;= &gt; &gt;=</code></pre>
<h4>BitVec</h4><pre><code>&amp; | ^ ~ &lt;&lt; &gt;&gt;   LShR  ULT ULE UGT UGE
UDiv URem SRem  RotateLeft  Concat
Extract(hi, lo, v)  ZeroExt(n, v)  SignExt
BV2Int(v)  Int2BV(x, 32)</code></pre></div>
<div><h4>Решатели</h4><pre><code>solve(c1, c2)        prove(claim)
s = Solver(); s.add(...); s.check()
m = s.model(); m[x]; m.eval(expr)
m[x].as_long(); m[v].as_signed_long()
s.push(); s.pop(); s.sexpr()
o = Optimize(); h = o.minimize(e)
o.check(); h.value()</code></pre>
<h4>Все решения</h4><pre><code>while s.check() == sat:
    m = s.model()
    s.add(Or([v != m[v] for v in vs]))</code></pre>
<h4>SMT-LIB</h4><pre><code>(declare-const x Int)  (assert (&gt; x 0))
(check-sat) (get-model) (get-value (x))
(push) (pop) (minimize x) (get-objectives)</code></pre></div></div>`;
function openSandbox(mode) {
  if (running) stop();
  sandbox = mode || 'py'; renderSidebar(); closeNav();
  var h = '<div class="crumb">Свободный режим</div><h1>Песочница</h1>' +
    '<div class="tabs"><button class="tab' + (sandbox === 'py' ? ' on' : '') + '" data-m="py">Python · Z3Py</button><button class="tab' + (sandbox === 'smt' ? ' on' : '') + '" data-m="smt">SMT-LIB</button></div>' +
    '<details class="theory"><summary>Шпаргалка</summary><div class="theory-b">' + CHEAT + '</div></details>' + editorHTML(sandbox, false);
  $('#content').innerHTML = h;
  $$('.tab').forEach(function (t) { t.onclick = function () { openSandbox(t.dataset.m); }; });
  bindEditor(null, sandbox);
}

/* ---------- навигация ---------- */
function closeNav() { document.body.classList.remove('nav-open'); }
$('#burger').onclick = function () { document.body.classList.toggle('nav-open'); };
$('#scrim').onclick = closeNav;
$('#sandbox-btn').onclick = function () { openSandbox('py'); };
$('#reset-progress').onclick = function () {
  if (!confirm('Сбросить весь прогресс и сохранённый код?')) return;
  progress = { done: {}, code: {}, current: 0 }; save(); go(0);
};
renderSidebar(); renderLevel();
})();

</script>
