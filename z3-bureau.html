<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z3: Бюро невозможных задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f1e8; --paper2:#ebe6d8; --card:#fbf9f3; --ink:#1c2230; --ink2:#4a5263; --muted:#7a8091; --rule:#d9d2bf; --rule2:#c9c0a8;
  --blue:#2742b8; --blue-soft:rgba(39,66,184,.08); --sat:#0d7a56; --unsat:#b8322a; --unk:#b07a10;
  --code-bg:#161b26; --code-ink:#e3e7ef; --code-dim:#6b7488; --code-line:#262d3c;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; --serif:'IBM Plex Serif',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#14161c; --paper2:#1b1e26; --card:#1a1d25; --ink:#e7e5de; --ink2:#b4b6bf; --muted:#8a8f9c; --rule:#2c303b; --rule2:#3a3f4c;
    --blue:#8ea2ff; --blue-soft:rgba(142,162,255,.1); --sat:#4ed39d; --unsat:#ff7a6e; --unk:#f0b44a; --code-bg:#0e1016; --code-line:#20242f; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--sans);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px;background-attachment:local}
code,kbd{font-family:var(--mono);font-size:.86em}
code{background:var(--blue-soft);padding:1px 5px;border-radius:3px;color:var(--blue)}
kbd{border:1px solid var(--rule2);border-bottom-width:2px;padding:0 5px;border-radius:3px;background:var(--card)}
header{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--paper);border-bottom:2px solid var(--ink)}
.logo{display:flex;align-items:center;gap:10px;font:600 16px var(--sans);white-space:nowrap}
.logo .z{font:600 15px var(--mono);background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:3px;letter-spacing:.5px}
.logo .t{font-family:var(--serif);font-style:italic;font-weight:400;font-size:17px}
.prog{flex:1;max-width:320px;display:flex;align-items:center;gap:10px;margin-left:auto}
.prog-track{flex:1;height:8px;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;background:var(--card)}
#prog-bar{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--sat) 0 6px,color-mix(in srgb,var(--sat) 70%,transparent) 6px 12px);transition:width .5s}
#prog-text{font:500 12px var(--mono);color:var(--ink2);white-space:nowrap}
.hbtn{background:var(--card);border:1.5px solid var(--ink);color:var(--ink);border-radius:3px;padding:5px 12px;font:500 13px var(--sans);cursor:pointer}
.hbtn:hover,.hbtn.on{background:var(--ink);color:var(--paper)}
#burger{display:none}
.wrap{display:flex;min-height:calc(100vh - 60px)}
aside{width:290px;flex:none;border-right:1.5px solid var(--rule2);background:var(--paper2);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:8px 10px 30px}
.chap-t{display:flex;justify-content:space-between;gap:8px;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.8px;color:var(--ink2);padding:16px 8px 6px;border-bottom:1px dashed var(--rule2);margin-bottom:4px}
.chap-t b{font-family:var(--mono);color:var(--blue)}
.chap-c{font-family:var(--mono)}
.lv{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:5px 8px;border-radius:3px;cursor:pointer;font:14px var(--sans)}
.lv:hover{background:var(--blue-soft)}
.lv.active{background:var(--ink);color:var(--paper)}
.lv.active .lv-n,.lv.active .lv-s{color:var(--paper)}
.lv-n{font:12px var(--mono);color:var(--muted);width:22px;text-align:right;flex:none}
.lv-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-s{font:600 11px var(--mono);color:var(--muted);min-width:18px;text-align:center}
.lv.done .lv-s{color:var(--sat)}
.side-foot{padding:16px 8px 0;margin-top:10px;border-top:1px dashed var(--rule2)}
main{flex:1;min-width:0;padding:28px 34px 80px}
#content{max-width:920px;margin:0 auto}
.crumb{font:500 12px var(--mono);color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;border-radius:2px;border:1.5px solid}
.t-quiz{color:var(--blue);border-color:var(--blue)}.t-code{color:var(--sat);border-color:var(--sat)}.t-smt{color:var(--unk);border-color:var(--unk)}.t-star{color:var(--unsat);border-color:var(--unsat)}
h1{font:600 30px/1.2 var(--serif);margin:8px 0 18px;letter-spacing:-.3px}
h1 .num{font:500 18px var(--mono);color:var(--blue);vertical-align:middle;margin-right:4px}
.okmark{color:var(--sat);font-size:.7em}
.story{background:var(--card);border:1.5px solid var(--ink);border-radius:3px;padding:14px 20px 16px;font:16.5px/1.65 var(--serif);margin-bottom:14px;box-shadow:4px 4px 0 var(--rule2);position:relative}
.story-l,.task-l{font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.story pre{background:var(--code-bg);color:var(--code-ink);border-radius:3px;padding:10px 14px;font:13px/1.55 var(--mono);overflow-x:auto;margin:8px 0}
.story pre code{background:none;color:inherit;padding:0}
.theory{background:var(--card);border:1.5px solid var(--rule2);border-radius:3px;margin-bottom:14px}
.theory summary{cursor:pointer;padding:10px 18px;font:600 14px var(--sans);list-style:none;user-select:none}
.theory summary::-webkit-details-marker{display:none}
.theory summary::before{content:'＋';display:inline-block;width:20px;font-family:var(--mono);color:var(--blue)}
.theory[open] summary::before{content:'－'}
.theory-b{padding:2px 22px 16px;border-top:1px dashed var(--rule2)}
.theory-b p,.theory-b ul{margin:11px 0}
.theory-b li{margin:4px 0}
.theory-b pre{background:var(--code-bg);color:var(--code-ink);border-radius:3px;padding:12px 16px;overflow-x:auto;font:13px/1.6 var(--mono)}
.theory-b pre code{background:none;color:inherit;padding:0;font-size:inherit}
.note{font-size:13.5px;color:var(--ink2);border-left:3px solid var(--unk);padding-left:12px}
table.cmp{border-collapse:collapse;margin:12px 0;font-size:14px;width:100%}
table.cmp th,table.cmp td{border:1px solid var(--rule2);padding:6px 10px;text-align:left;vertical-align:top}
table.cmp th{background:var(--paper2);font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.task{border:1.5px solid var(--blue);background:var(--blue-soft);border-radius:3px;padding:12px 18px;margin-bottom:14px}
.task .task-l{color:var(--blue)}
.ed{background:var(--code-bg);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;box-shadow:5px 5px 0 var(--rule2)}
.ed-top{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--code-line);background:#1c2230}
.ed-lang{font:600 12px var(--mono);color:#9fb0ff;letter-spacing:.3px}
.ed-keys{margin-left:auto;font:11px var(--mono);color:var(--code-dim)}
.ed-area{position:relative}
.ed-hl,#code{margin:0;padding:14px 16px;font:13.5px/1.6 var(--mono);white-space:pre;tab-size:4;border:0;width:100%;overflow:auto;letter-spacing:0}
.ed-hl{position:absolute;inset:0;color:var(--code-ink);pointer-events:none;overflow:hidden}
#code{position:relative;display:block;background:transparent;color:transparent;caret-color:#fff;resize:vertical;outline:0;min-height:160px}
#code::selection{background:rgba(142,162,255,.35);color:transparent}
.h-k{color:#c792ea}.h-z{color:#82aaff;font-weight:500}.h-s{color:#c3e88d}.h-n{color:#f78c6c}.h-c{color:#6b7488;font-style:italic}.h-p{color:#6b7488}.h-o{color:#89ddff}
.ed-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--code-line);background:#121620}
.sp{flex:1}
.btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:3px;font:500 13px var(--sans);cursor:pointer;transition:transform .08s}
.btn:active:not(:disabled){transform:translate(1px,1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--sat);border-color:var(--sat);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.small{padding:4px 11px;font-size:12px;margin-top:10px}
.ed-btns .btn{background:#222939;color:#dfe4ee;border-color:#39415a}
.ed-btns .btn.primary{background:#1f9a6e;border-color:#1f9a6e;color:#fff}
.ed-btns .btn.ghost{background:transparent;color:#9aa3b8}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.hintbox{margin:0;padding:10px 16px;background:#2a2516;color:#f3d48a;border-top:1px solid #4a3f1d;font-size:14px;font-family:var(--mono);white-space:pre-wrap}
.hintbox b{font-family:var(--sans)}
.out{max-height:420px;overflow-y:auto;border-top:1px solid var(--code-line);padding:4px 0;font:13px/1.55 var(--mono);color:var(--code-ink);background:#0f131b}
.o-empty{color:var(--code-dim);padding:10px 16px}
.o-block{padding:8px 16px;border-bottom:1px dashed var(--code-line)}
.o-block:last-child{border-bottom:0}
.o-run{color:var(--code-dim);font-size:12px}
.o-pr{color:#9fb0ff;font-weight:600;margin-right:6px}
.o-v{margin:4px 0;white-space:pre-wrap;word-break:break-word}
.o-sat{color:#4ed39d;font-weight:600}.o-unsat{color:#ff7a6e;font-weight:600}.o-unk{color:#f0b44a;font-weight:600}.o-cex{color:#ff9e64;font-weight:600}
.o-err,.o-error{color:#ff8a80}
.o-error{white-space:pre-wrap;font-family:var(--sans);font-size:14px;margin-top:4px;padding:8px 10px;border-left:3px solid #ff8a80;background:rgba(255,138,128,.08)}
.o-info{color:var(--code-dim);font-size:11.5px}
#feedback{margin-top:16px}
.fb{border-radius:3px;padding:13px 18px;border:1.5px solid}
.fb.bad{border-color:var(--unsat);background:color-mix(in srgb,var(--unsat) 7%,var(--card));color:var(--ink)}
.fb.bad b{color:var(--unsat)}
.fb.good{border-color:var(--sat);background:color-mix(in srgb,var(--sat) 8%,var(--card));font-family:var(--serif);font-size:16px;box-shadow:4px 4px 0 color-mix(in srgb,var(--sat) 30%,transparent)}
.fb-t{font:600 14px var(--mono);color:var(--sat);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.fb-t::before{content:'✓ sat · '}
.fb .btn{margin-top:12px;font-family:var(--sans)}
.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.quiz{display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--card);border:1.5px solid var(--rule2);border-radius:3px;padding:15px 18px}
.qcard.solved{border-color:var(--sat)}
.qq{font-weight:600;font-size:15.5px;display:flex;gap:10px;margin-bottom:12px}
.qn{flex:none;width:24px;height:24px;border:1.5px solid var(--ink);border-radius:2px;display:grid;place-items:center;font:600 12px var(--mono)}
.multi{font:500 11px var(--sans);color:var(--unk);border:1px solid var(--unk);border-radius:2px;padding:0 6px;margin-left:4px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopt{text-align:left;background:var(--paper);border:1.5px solid var(--rule2);color:var(--ink);padding:9px 12px;border-radius:3px;font:14px var(--sans);cursor:pointer}
.qopt:hover:not(:disabled){border-color:var(--ink)}
.qopt.sel{border-color:var(--unk);background:color-mix(in srgb,var(--unk) 10%,var(--paper))}
.qopt:disabled{cursor:default}
.qopt.right{border-color:var(--sat);background:color-mix(in srgb,var(--sat) 12%,var(--paper));font-weight:500}
.qopt.wrong{border-color:var(--unsat);opacity:.6;text-decoration:line-through}
.qexp{margin-top:10px;font-size:14px;color:var(--ink2)}
.good{color:var(--sat)}.bad{color:var(--unsat)}
.nav{display:flex;justify-content:space-between;margin-top:28px;padding-top:16px;border-top:1.5px solid var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:6px 14px;font:500 13px var(--sans);border-radius:3px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--paper)}
.cheat{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cheat h4{margin:12px 0 4px;font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.cheat pre{margin:0 0 6px;font-size:12px !important}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.6);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.modal-b{max-width:500px;background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:26px 28px;text-align:center;font-family:var(--serif);font-size:16px;box-shadow:8px 8px 0 var(--rule2)}
.modal-b h2{font-size:26px;margin:8px 0}
.seal{display:inline-block;font:600 22px var(--mono);color:var(--sat);border:3px double var(--sat);border-radius:50%;width:84px;height:84px;line-height:78px;transform:rotate(-12deg)}
#scrim{display:none}
@media (max-width:900px){
  #burger{display:inline-block}
  aside{position:fixed;left:0;top:60px;z-index:30;transform:translateX(-105%);transition:transform .25s;box-shadow:10px 0 40px rgba(0,0,0,.25)}
  body.nav-open aside{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:60px 0 0 0;background:rgba(0,0,0,.35);z-index:25}
  main{padding:18px 16px 60px}
  h1{font-size:23px}
  .qopts,.cheat{grid-template-columns:1fr}
  .logo .t{display:none}
  .ed-keys{display:none}
  .ed-hl,#code{font-size:12.5px;padding:12px}
  .prog{max-width:none}
}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="burger" aria-label="Уровни">☰</button>
  <div class="logo"><span class="z">Z3</span><span class="t">Бюро невозможных задач</span></div>
  <div class="prog"><div class="prog-track"><div id="prog-bar"></div></div><span id="prog-text">0 / 0</span></div>
  <button class="hbtn" id="sandbox-btn">Песочница</button>
</header>
<div class="wrap">
  <aside><div id="levels"></div><div class="side-foot"><button class="hbtn" id="reset-progress">Сбросить прогресс</button></div></aside>
  <div id="scrim"></div>
  <main><div id="content"></div></main>
</div>
<div id="modal" hidden></div>
<script id="engine-src">
/* ===== CDCL SAT-решатель (в стиле MiniSat) ===== */
var SAT = (function () {
'use strict';

/* clauses: массив массивов литералов в формате DIMACS (v / -v), переменные 1..nv
   возвращает { status: 'sat'|'unsat'|'unknown', model: Uint8Array (1 = true) } */
function solve(nv, inClauses, opt) {
  opt = opt || {};
  var deadline = Date.now() + (opt.timeMs || 8000);
  var N = nv + 1;
  var assigns = new Int8Array(N);          // 0 — не назначена, 1 — true, -1 — false
  var levelA = new Int32Array(N);
  var reason = new Int32Array(N).fill(-1);
  var act = new Float64Array(N);
  var phase = new Int8Array(N);
  var seen = new Uint8Array(N);
  var watches = new Array(2 * N);
  for (var i = 0; i < 2 * N; i++) watches[i] = [];
  var clauses = [];
  var learntIdx = [], learntLbd = {};
  var trail = new Int32Array(N), tsize = 0, trailLim = [], qhead = 0;
  var varInc = 1, conflicts = 0, decisions = 0;

  function val(l) { var a = assigns[l >> 1]; return (l & 1) ? -a : a; }
  function enqueue(l, from) { var v = l >> 1; assigns[v] = (l & 1) ? -1 : 1; levelA[v] = trailLim.length; reason[v] = from; trail[tsize++] = l; }
  function toLit(d) { return d > 0 ? 2 * d : 2 * (-d) + 1; }

  /* ---- куча VSIDS ---- */
  var heap = [], pos = new Int32Array(N).fill(-1);
  function hless(a, b) { return act[a] > act[b]; }
  function up(i) { var v = heap[i]; while (i > 0) { var p = (i - 1) >> 1; if (!hless(v, heap[p])) break; heap[i] = heap[p]; pos[heap[i]] = i; i = p; } heap[i] = v; pos[v] = i; }
  function down(i) {
    var v = heap[i], n = heap.length;
    for (;;) {
      var c = 2 * i + 1; if (c >= n) break;
      if (c + 1 < n && hless(heap[c + 1], heap[c])) c++;
      if (!hless(heap[c], v)) break;
      heap[i] = heap[c]; pos[heap[i]] = i; i = c;
    }
    heap[i] = v; pos[v] = i;
  }
  function hinsert(v) { if (pos[v] >= 0) return; heap.push(v); pos[v] = heap.length - 1; up(heap.length - 1); }
  function hpop() { var v = heap[0], last = heap.pop(); pos[v] = -1; if (heap.length) { heap[0] = last; pos[last] = 0; down(0); } return v; }
  function bump(v) {
    act[v] += varInc;
    if (act[v] > 1e100) { for (var k = 1; k < N; k++) act[k] *= 1e-100; varInc *= 1e-100; }
    if (pos[v] >= 0) up(pos[v]);
  }

  /* ---- добавление клауз ---- */
  var ok = true;
  function addClause(dl) {
    var lits = [], s = {};
    for (var k = 0; k < dl.length; k++) {
      var l = toLit(dl[k]);
      if (s[l ^ 1]) return;            // тавтология
      if (s[l]) continue;
      s[l] = 1;
      var vv = val(l);
      if (vv === 1) return;            // уже выполнена на уровне 0
      if (vv === -1) continue;
      lits.push(l);
    }
    if (lits.length === 0) { ok = false; return; }
    if (lits.length === 1) { enqueue(lits[0], -1); return; }
    var ci = clauses.length;
    clauses.push(Int32Array.from(lits));
    watches[lits[0]].push(ci); watches[lits[1]].push(ci);
  }
  for (i = 0; i < inClauses.length && ok; i++) {
    addClause(inClauses[i]);
    if (ok && qhead < tsize && propagate() >= 0) ok = false;
  }
  if (!ok) return { status: 'unsat' };
  // начальная активность: переменные, встречающиеся чаще, — первыми
  for (i = 0; i < clauses.length; i++) { var cc = clauses[i]; for (var k = 0; k < cc.length; k++) act[cc[k] >> 1] += 1e-3; }
  for (var v = 1; v < N; v++) if (!assigns[v]) hinsert(v);

  function propagate() {
    while (qhead < tsize) {
      var p = trail[qhead++], fl = p ^ 1, ws = watches[fl], i = 0, j = 0, n = ws.length;
      while (i < n) {
        var ci = ws[i++], c = clauses[ci];
        if (c === null) continue;
        if (c[0] === fl) { c[0] = c[1]; c[1] = fl; }
        if (val(c[0]) === 1) { ws[j++] = ci; continue; }
        var found = false;
        for (var k = 2; k < c.length; k++) {
          if (val(c[k]) !== -1) { c[1] = c[k]; c[k] = fl; watches[c[1]].push(ci); found = true; break; }
        }
        if (found) continue;
        ws[j++] = ci;
        if (val(c[0]) === -1) { while (i < n) ws[j++] = ws[i++]; ws.length = j; qhead = tsize; return ci; }
        enqueue(c[0], ci);
      }
      ws.length = j;
    }
    return -1;
  }

  function analyze(ci) {
    var learnt = [0], pathC = 0, p = -1, idx = tsize - 1, lvl = trailLim.length;
    do {
      var c = clauses[ci];
      for (var k = (p === -1 ? 0 : 1); k < c.length; k++) {
        var q = c[k], v = q >> 1;
        if (!seen[v] && levelA[v] > 0) {
          seen[v] = 1; bump(v);
          if (levelA[v] >= lvl) pathC++; else learnt.push(q);
        }
      }
      while (!seen[trail[idx--] >> 1]);
      p = trail[idx + 1]; ci = reason[p >> 1]; seen[p >> 1] = 0; pathC--;
    } while (pathC > 0);
    learnt[0] = p ^ 1;
    // локальная минимизация

{
  id: 'banquet', ch: 2, type: 'code', title: 'Перебор всех решений', star: true,
  story: 'Ресторан составляет банкетное меню из 5 блюд A–E. Правила шефа: A и B вместе не подаются; нужно хотя бы одно из C или D; всего блюд 2 или 3; E подаётся только вместе с A. <b>Сколько существует вариантов меню?</b>',
  theory: `
<p>Z3 возвращает одну модель. Чтобы перечислить все, после каждого решения добавляют <b>блокирующее ограничение</b> — «хотя бы одна переменная должна отличаться»:</p>
<pre><code>count = 0

    m = s.model()
    count += 1
    s.add(Or([v != m[v] for v in vars]))   # запретить найденное решение
print(count)</code></pre>
<p>Для логических переменных <code>v != m[v]</code> работает так же, как для чисел.</p>
<p>Ограничения «не больше k» и «не меньше k» из набора Bool есть в готовом виде: <code>AtMost(a, b, c, 2)</code>, <code>AtLeast(…)</code>. Или через <code>Sum(If(…))</code>.</p>`,

  solution: "from z3 import *\n\nA, B, C, D, E = Bools('A B C D E')\ndishes = [A, B, C, D, E]\ns = Solver()\ns.add(Not(And(A, B)))\ns.add(Or(C, D))\nn = Sum([If(d, 1, 0) for d in dishes])\ns.add(n >= 2, n <= 3)\ns.add(Implies(E, A))\ncount = 0\nwhile s.check() == sat:\n    m = s.model()\n    count += 1\n    s.add(Or([d != m[d] for d in dishes]))\nprint(count)\n",
  hint: 'Правила: Not(And(A, B)), Or(C, D), 2 ≤ Sum(If(d,1,0)) ≤ 3, Implies(E, A). Учтите: блюдо, которое не встречается в правилах, может отсутствовать в модели, тогда m[d] вернёт None. Здесь все пять блюд участвуют в правиле про количество, так что всё в порядке.',
  check: function (h) {
    var b = h.base(); if (b) return b;
    var nums = (h.text.match(/-?\d+/g) || []).map(Number);

    if (h.checks.length < BANQUET + 1) return h.fail('Число верное, но его нужно получить перебором через Solver: каждое решение — отдельный check().');
    return null;
  },

  task: 'Используйте переменные <code>m00 … m22</code> (как в заготовке). Числа 1–9, все разные, все 8 линий с равной суммой.',
  starter: "from z3 import *\n\nX = [[Int(f\"m{i}{j}\") for j in range(3)] for i in range(3)]\ncells = [X[i][j] for i in range(3) for j in range(3)]\ns = Solver()\n\nif s.check() == sat:\n    m = s.model()\n    for i in range(3):\n        print(*[m[X[i][j]] for j in range(3)])\n",
  solution: "from z3 import *\n\nX = [[Int(f\"m{i}{j}\") for j in range(3)] for i in range(3)]\ncells = [X[i][j] for i in range(3) for j in range(3)]\ns = Solver()\ns.add([And(1 <= c, c <= 9) for c in cells])\ns.add(Distinct(cells))\nt = Int('t')\ns.add([Sum(X[i]) == t for i in range(3)])\ns.add([Sum([X[i][j] for i in range(3)]) == t for j in range(3)])\ns.add(Sum([X[i][i] for i in range(3)]) == t)\ns.add(Sum([X[i][2 - i] for i in range(3)]) == t)\nif s.check() == sat:\n    m = s.model()\n    for i in range(3):\n        print(*[m[X[i][j]] for j in range(3)])\n",
  hint: 'Введите t = Int("t") и добавьте Sum(X[i]) == t для строк, Sum([X[i][j] for i in range(3)]) == t для столбцов и две диагонали.',
  check: function (h) { return h.modelOk("X = [[Int(f'm{i}{j}') for j in range(3)] for i in range(3)]\nc = [X[i][j] for i in range(3) for j in range(3)]\nE = [And(1 <= v, v <= 9) for v in c] + [Distinct(c)] + [Sum(X[i]) == 15 for i in range(3)] + [Sum([X[i][j] for i in range(3)]) == 15 for j in range(3)] + [X[0][0] + X[1][1] + X[2][2] == 15, X[0][2] + X[1][1] + X[2][0] == 15]"); },
  success: 'Квадрат Ло Шу — ему около 4000 лет. В центре всегда 5.'
},

  starter: "from z3 import *\n\ngrid = [\n  [5,3,0, 0,7,0, 0,0,0],\n  [6,0,0, 1,9,5, 0,0,0],\n  [0,9,8, 0,0,0, 0,6,0],\n  [8,0,0, 0,6,0, 0,0,3],\n  [4,0,0, 8,0,3, 0,0,1],\n  [7,0,0, 0,2,0, 0,0,6],\n  [0,6,0, 0,0,0, 2,8,0],\n  [0,0,0, 4,1,9, 0,0,5],\n  [0,0,0, 0,8,0, 0,7,9]]\n\nX = [[Int(f\"x_{i}_{j}\") for j in range(9)] for i in range(9)]\ns = Solver()\n\n# 1) клетки от 1 до 9\n# 2) строки\n# 3) столбцы\n# 4) квадраты 3x3\n# 5) известные клетки\n\nif s.check() == sat:\n    m = s.model()\n    for i in range(9):\n        print(\" \".join(str(m[X[i][j]]) for j in range(9)))\nelse:\n    print(\"нет решения\")\n",

{
  id: 'queens', ch: 3, type: 'code', title: 'Восемь ферзей',
  story: 'Шахматный клуб просит расставить 8 ферзей на доске 8×8 так, чтобы ни один не бил другого.',
  theory: `
<p>Хитрая модель уменьшает число переменных: в каждой строке ровно один ферзь, поэтому достаточно <code>q[i]</code> — номер столбца ферзя в строке i.</p>
<ul><li>Разные столбцы: <code>Distinct(q)</code>.</li>
<li>Диагонали «↘»: у ферзей на одной такой диагонали совпадает <code>q[i] - i</code>.</li>
<li>Диагонали «↙»: совпадает <code>q[i] + i</code>.</li></ul>`,
  task: 'Используйте переменные <code>q0 … q7</code> со значениями 0–7 и найдите расстановку.',
  starter: "from z3 import *\n\nq = [Int(f\"q{i}\") for i in range(8)]\ns = Solver()\n\nif s.check() == sat:\n    m = s.model()\n    for i in range(8):\n        col = m[q[i]].as_long()\n        print(\". \" * col + \"Q \" + \". \" * (7 - col))\n",
  solution: "from z3 import *\n\nq = [Int(f\"q{i}\") for i in range(8)]\ns = Solver()\ns.add([And(0 <= x, x < 8) for x in q])\ns.add(Distinct(q))\ns.add(Distinct([q[i] + i for i in range(8)]))\ns.add(Distinct([q[i] - i for i in range(8)]))\nif s.check() == sat:\n    m = s.model()\n    for i in range(8):\n        col = m[q[i]].as_long()\n        print(\". \" * col + \"Q \" + \". \" * (7 - col))\n",
  hint: 'Три Distinct: Distinct(q), Distinct([q[i] + i ...]), Distinct([q[i] - i ...]) и границы 0 ≤ q[i] < 8.',
  check: function (h) { return h.modelOk("q = [Int(f'q{i}') for i in range(8)]\nE = [And(0 <= x, x < 8) for x in q] + [Distinct(q), Distinct([q[i] + i for i in range(8)]), Distinct([q[i] - i for i in range(8)])]"); },
  success: 'Доска расставлена. Обратите внимание, как .as_long() превратил значение из модели в число Python для печати.'
},
{
  id: 'queens-count', ch: 3, type: 'code', title: 'Сколько всего расстановок?', star: true,
  story: 'Клуб хочет напечатать в журнале все расстановки восьми ферзей. Сколько страниц понадобится?',
  theory: `<p>Соедините модель ферзей с перебором всех решений из главы 2. Блокирующее ограничение: <code>Or([x != m[x] for x in q])</code>.</p>`,
  task: 'Посчитайте и напечатайте число всех расстановок 8 ферзей.',
  starter: "from z3 import *\n\nq = [Int(f\"q{i}\") for i in range(8)]\ns = Solver()\n\ncount = 0\n\nprint(count)\n",
  solution: "from z3 import *\n\nq = [Int(f\"q{i}\") for i in range(8)]\ns = Solver()\ns.add([And(0 <= x, x < 8) for x in q])\ns.add(Distinct(q))\ns.add(Distinct([q[i] + i for i in range(8)]))\ns.add(Distinct([q[i] - i for i in range(8)]))\ncount = 0\nwhile s.check() == sat:\n    m = s.model()\n    count += 1\n    s.add(Or([x != m[x] for x in q]))\nprint(count)\n",
  hint: 'Скопируйте ограничения из прошлого уровня и добавьте цикл while s.check() == sat с блокирующим Or.',
  check: function (h) {
    var b = h.base(); if (b) return b;
    if ((h.text.match(/-?\d+/g) || []).map(Number).indexOf(92) < 0) return h.fail('Напечатанное число не совпадает с правильным. Проверьте ограничения и цикл.');
    if (h.checks.length < 93) return h.fail('Число верное, но его нужно получить перебором через Solver.');
    return null;
  },
  success: '92 расстановки (из них 12 уникальных с точностью до поворотов и отражений).'
},

{
  id: 'q-opt', ch: 4, type: 'quiz', title: 'Не просто решение, а лучшее',
  story: 'Клиенты хотят не любое решение, а самое выгодное: меньше монет, больше прибыли, короче расписание.',
  theory: `
<p>Вместо <code>Solver</code> используйте <code>Optimize</code>. У него есть всё то же самое плюс цели:</p>
<pre><code>o = Optimize()
o.add(x &gt;= 0, y &gt;= 0, x + y &lt;= 10)
h = o.maximize(3*x + 2*y)      # или o.minimize(...)
print(o.check())               # sat
print(o.model())               # оптимальная модель
print(h.value())               # значение цели</code></pre>
<ul><li>Целей может быть несколько — по умолчанию они оптимизируются <b>лексикографически</b>: сначала первая, затем вторая при лучшем значении первой.</li>
<li>Целочисленная оптимизация (ILP) — NP-трудная задача, но для многих практических случаев Z3 справляется.</li>
<li>Если цель не ограничена, настоящий Z3 вернёт значение <code>oo</code> (бесконечность). В этой игре Int ограничены ±2³¹, поэтому вы увидите граничное значение.</li></ul>`,
  questions: [
    { q: 'Какой объект нужен для поиска минимума?', options: ['Solver с методом minimize', 'Optimize', 'solve(min=...)', 'prove'], correct: 1, explain: 'У Solver нет minimize — только у Optimize.' },
    { q: 'Как узнать значение цели после check()?', options: ['o.value()', 'h.value(), где h — результат o.maximize(...)', 'o.model().max'], correct: 1, explain: 'minimize/maximize возвращают «ручку» цели.' },
    { q: 'Две цели: minimize(cost), затем minimize(time). Что оптимизируется?', options: ['Сумма cost + time', 'Сначала cost; среди решений с минимальным cost — минимальный time', 'Только последняя цель'], correct: 1, explain: 'Лексикографический порядок — по умолчанию в Z3.' }
  ]
},
{
  id: 'coins', ch: 4, type: 'code', title: 'Размен монет',
  story: 'Автомат должен выдать сдачу 87 рублей монетами по 1, 2, 5, 10 и 50 рублей — <b>минимальным числом монет</b>.',
  theory: `<p>Переменная <code>cK</code> — сколько монет номиналом K. Сумма номиналов: <code>Sum([cnt * value ...])</code>. Цель — минимизировать общее число монет.</p>`,
  task: 'Используйте переменные <code>c1, c2, c5, c10, c50</code> и <code>Optimize</code>.',
  starter: "from z3 import *\n\nvalues = [1, 2, 5, 10, 50]\nc = [Int(f\"c{v}\") for v in values]\no = Optimize()\n\nprint(o.check())\nprint(o.model())\n",
  solution: "from z3 import *\n\nvalues = [1, 2, 5, 10, 50]\nc = [Int(f\"c{v}\") for v in values]\no = Optimize()\no.add([x >= 0 for x in c])\no.add(Sum([x * v for x, v in zip(c, values)]) == 87)\no.minimize(Sum(c))\nprint(o.check())\nprint(o.model())\n",
  hint: 'o.add([x >= 0 for x in c]); o.add(Sum([x * v for x, v in zip(c, values)]) == 87); o.minimize(Sum(c))',
  check: function (h) {
    if (!h.usedOptimize()) return h.fail('Нужно использовать Optimize и minimize.');
    return h.modelOk("c1, c2, c5, c10, c50 = Ints('c1 c2 c5 c10 c50')\nE = [c1 >= 0, c2 >= 0, c5 >= 0, c10 >= 0, c50 >= 0, c1 + 2*c2 + 5*c5 + 10*c10 + 50*c50 == 87]") || h.modelOk("c1, c2, c5, c10, c50 = Ints('c1 c2 c5 c10 c50')\nE = [c1 + c2 + c5 + c10 + c50 == 6]", 'Размен правильный, но монет больше, чем нужно. Проверьте цель minimize.');
  },
  success: '6 монет: 50 + 10·3 + 5 + 2. Без отрицательных количеств решатель «выдал» бы −1000 монет — проверьте, убрав ограничение ≥ 0.'
},

{
  id: 'q-bv', ch: 5, type: 'quiz', title: 'Битовые векторы = int из Java',
  story: 'Отдел безопасности Бюро проверяет Java-код. Здесь числа уже не математические, а машинные — с переполнениями.',
  theory: `
<p><code>BitVec('x', 32)</code> — 32-битное число, ровно как <code>int</code> в Java: арифметика по модулю 2³², дополнительный код. <code>BitVec('b', 8)</code> — как <code>byte</code>, 64 — как <code>long</code>.</p>
<table class="cmp"><tr><th>Java</th><th>Z3Py (BitVec)</th></tr>
<tr><td><code>a + b</code>, <code>a - b</code>, <code>a * b</code></td><td><code>a + b</code>, <code>a - b</code>, <code>a * b</code> (с переполнением)</td></tr>
<tr><td><code>a / b</code></td><td><code>a / b</code> — знаковое деление</td></tr>
<tr><td><code>a % b</code></td><td><code>SRem(a, b)</code>! Оператор <code>%</code> в Z3Py — это SMod (знак как у делителя)</td></tr>
<tr><td><code>&amp; | ^ ~</code></td><td><code>&amp; | ^ ~</code></td></tr>
<tr><td><code>a &lt;&lt; n</code>, <code>a &gt;&gt; n</code></td><td><code>a &lt;&lt; n</code>, <code>a &gt;&gt; n</code> (арифметический)</td></tr>
<tr><td><code>a &gt;&gt;&gt; n</code></td><td><code>LShR(a, n)</code> — логический сдвиг</td></tr>
<tr><td><code>a &lt; b</code> (знаковое)</td><td><code>a &lt; b</code> — знаковое</td></tr>
<tr><td><code>Integer.compareUnsigned</code></td><td><code>ULT, ULE, UGT, UGE</code>, <code>UDiv</code>, <code>URem</code></td></tr>
<tr><td><code>Integer.rotateLeft(a, n)</code></td><td><code>RotateLeft(a, n)</code></td></tr>
<tr><td><code>(byte) x</code>, <code>(long) x</code></td><td><code>Extract(7, 0, x)</code>, <code>SignExt(32, x)</code></td></tr></table>
<p>Модель печатает BitVec как <b>беззнаковое</b> число: −1 у 32-битного вектора выглядит как 4294967295. Знаковое значение: <code>m[x].as_signed_long()</code>.</p>
<p>Внутри Z3 такие задачи решаются <b>бит-бластингом</b>: каждое 32-битное число превращается в 32 логические переменные, сложение — в схему сумматора, и всё уходит в SAT-решатель. Мини-Z3 этой игры работает так же.</p>`,
  questions: [
    { q: 'Какой тип Z3 точно моделирует Java int?', options: ['Int', 'BitVec(32)', 'BitVec(64)', 'Real'], correct: 1, explain: 'Int не переполняется, BitVec(32) — переполняется как в Java.' },
    { q: 'Как в Z3Py записать Java-выражение x >>> 3?', options: ['x >> 3', 'x >>> 3', 'LShR(x, 3)', 'URem(x, 3)'], correct: 2, explain: 'В Python нет >>>. >> в Z3Py — арифметический сдвиг, как >> в Java.' },
    { q: 'Чему соответствует Java a % b для BitVec?', options: ['a % b', 'SRem(a, b)', 'URem(a, b)', 'a / b'], correct: 1, explain: 'В Java знак остатка совпадает со знаком делимого — это SRem. % в Z3Py — SMod.' },
    { q: 'Модель показывает x = 4294967295 для BitVec(32). Какое это значение в Java int?', options: ['4294967295', '-1', '0', 'переполнение'], correct: 1, explain: 'Модель печатает беззнаковое значение; в дополнительном коде это −1.' }
  ]
},

{
  id: 'pow2', ch: 5, type: 'code', title: 'Битовый трюк',
  story: 'В коде встречается проверка <code>(x &amp; (x - 1)) == 0</code> с комментарием «x — степень двойки». Правда ли это для любого int?',
  theory: `
<p>Множество «x — степень двойки или ноль» можно задать явно через <code>Or</code>:</p>

<p>Здесь <code>1 &lt;&lt; i</code> — обычное число Python, Z3 превратит его в 32-битную константу. Учтите, что <code>1 &lt;&lt; 31</code> в int — это отрицательное число MIN_VALUE.</p>
<p><b>Ловушка приоритетов:</b> в Python <code>a == b == c</code> — это цепочка сравнений. Ставьте скобки: <code>(A) == (B)</code>.</p>`,
  task: 'Докажите, что <code>(x &amp; (x - 1)) == 0</code> эквивалентно «x равен 0 или степени двойки» для 32-битного <code>x</code>.',
  starter: "from z3 import *\n\nx = BitVec('x', 32)\ntrick = (x & (x - 1)) == 0\npow2 = Or([x == 0] + [x == (1 << i) for i in range(32)])\n",
  solution: "from z3 import *\n\nx = BitVec('x', 32)\ntrick = (x & (x - 1)) == 0\npow2 = Or([x == 0] + [x == (1 << i) for i in range(32)])\nprove(trick == pow2)\n",
  hint: 'prove(trick == pow2)',
  check: function (h) { return h.proved("x = BitVec('x', 32)\nE = [((x & (x - 1)) == 0) == Or([x == 0] + [x == (1 << i) for i in range(32)])]"); },
  success: 'proved. Но заметьте: трюк считает «степенью двойки» и 0, и MIN_VALUE. Поэтому в JDK пишут x > 0 && (x & (x - 1)) == 0.'
},
{

{
  id: 'hashcode', ch: 5, type: 'code', title: 'Коллизия String.hashCode', star: true,
  story: 'Злоумышленник хочет забить HashMap сервера ключами с одинаковым хешем (атака HashDoS). Найдите 4-буквенное слово из латинских букв, у которого <code>hashCode()</code> такой же, как у <code>"Java"</code>, но которое не равно <code>"Java"</code>.',
  theory: `
<p>В Java <code>String.hashCode()</code> считается так:</p>
<pre><code>int h = 0;
for (char c : s.toCharArray()) h = 31 * h + c;</code></pre>
<p>Символы — неизвестные BitVec(32), а цикл можно выполнить прямо в Python, накапливая выражение Z3. Чтобы получить строку из модели: <code>chr(m[c].as_long())</code>.</p>
<p>Буква латиницы: <code>Or(And(c &gt;= 65, c &lt;= 90), And(c &gt;= 97, c &lt;= 122))</code>.</p>`,
  task: 'Найдите слово и напечатайте его.',
  starter: "from z3 import *\n\ndef java_hash(s):\n    h = 0\n    for ch in s:\n        h = (31 * h + ord(ch)) & 0xFFFFFFFF\n    return h\n\ncs = [BitVec(f\"c{i}\", 32) for i in range(4)]\nh = BitVecVal(0, 32)\nfor c in cs:\n    h = 31 * h + c\ns = Solver()\n\n",
  solution: "from z3 import *\n\ndef java_hash(s):\n    h = 0\n    for ch in s:\n        h = (31 * h + ord(ch)) & 0xFFFFFFFF\n    return h\n\ncs = [BitVec(f\"c{i}\", 32) for i in range(4)]\nh = BitVecVal(0, 32)\nfor c in cs:\n    h = 31 * h + c\ns = Solver()\ns.add([Or(And(c >= 65, c <= 90), And(c >= 97, c <= 122)) for c in cs])\ns.add(h == java_hash(\"Java\"))\ns.add(Or([c != ord(ch) for c, ch in zip(cs, \"Java\")]))\nprint(s.check())\nm = s.model()\nword = \"\".join(chr(m[c].as_long()) for c in cs)\nprint(word)\n",
  hint: 'Три ограничения: все символы — буквы; h == java_hash("Java"); слово отличается: Or([c != ord(ch) for c, ch in zip(cs, "Java")]). Затем соберите строку через chr(m[c].as_long()).',
  check: function (h) {
    var b = h.base(); if (b) return b;
    var target = jhash('Java');
    var words = h.text.match(/[A-Za-z]{4}/g) || [];
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (w !== 'Java' && jhash(w) === target && /^[A-Za-z]{4}$/.test(w)) {
        var re = new RegExp('(^|[^A-Za-z])' + w + '([^A-Za-z]|$)', 'm');
        if (re.test(h.text)) return null;
      }
    }
    return h.fail('В выводе не найдено подходящее слово: 4 латинские буквы, не «Java», с тем же hashCode. Напечатайте слово отдельно.');
  },
  success: 'Коллизия найдена. Именно поэтому с Java 8 HashMap превращает длинные цепочки коллизий в красно-чёрные деревья.'
},
{

k = k ^ (k &lt;&lt; 7)     # key ^= key &lt;&lt; 7</code></pre>

{

  story: 'Ещё одна проверка — на этот раз пароля из 6 символов (коды ASCII 33–126):<pre><code>c[0] + c[1] == 226\n(c[1] ^ c[2]) == 3\nc[2] * 2 + c[3] == 334\nc[3] - c[4] == 67\n(c[4] ^ c[5]) == 65\nc[5] + c[0] == 229\nc[0] % 5 == 0</code></pre>',
